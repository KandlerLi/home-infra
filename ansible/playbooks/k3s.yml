---
# Not imported into site.yml on purpose: run explicitly with --ask-become-pass.

- name: Provision k3s learning node
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: libvirt_host
    - role: k3s_node
      # node-1 runs everything except the CI runners and needed the CPU headroom.
      k3s_node_vm_vcpus: 3
      # Sized for Paperless-ngx OCR peaks (ADR 0023).
      k3s_node_vm_memory_mb: 10240

# Runner node: tainted for CI, in k3s_agent_nodes so the server-unit play below skips it.
- name: Provision k3s runner node
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_vm_name: k3s-node-2
      # Two runner slots per repository, each able to burst to ~1.75 GiB.
      k3s_node_vm_memory_mb: 8192
      # The runner caches outgrew 40 GiB; the qcow2 is sparse.
      k3s_node_vm_disk_size_gb: 100
      k3s_node_vm_disk_path: /mnt/black-hdd/k3s/k3s-node-2.qcow2
      k3s_node_vm_ip: 192.168.101.11
      k3s_node_vm_mac: "52:54:00:00:00:21"
      k3s_node_ssh_host_key_alias: k3s-node-2-via-homeserver
      k3s_node_inventory_group: k3s_agent_nodes

- name: Install k3s on the learning node
  hosts: k3s_nodes
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_role_mode: configure_guest

# Read off node-1 into a hostvar, never written to disk.
- name: Retrieve k3s cluster join token
  hosts: k3s_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Read k3s server node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_file
      no_log: true

    - name: Expose k3s node-token as a fact
      ansible.builtin.set_fact:
        k3s_node_join_token: "{{ k3s_node_token_file.content | b64decode | trim }}"
      no_log: true

- name: Install k3s on the runner node
  hosts: k3s_agent_nodes
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_role_mode: configure_guest
      k3s_node_join_mode: agent
      # A literal: role defaults aren't reliably visible via hostvars across plays.
      k3s_node_join_server_url: "https://192.168.101.10:6443"
      k3s_node_join_token: "{{ hostvars['k3s-node-1'].k3s_node_join_token }}"
      k3s_node_agent_node_taint: "ci=github-runner:NoSchedule"
      k3s_node_agent_node_label: "role=github-runner"

# The VMs exist as hosts only after the provision plays above added them.
- name: Security updates on the k3s nodes
  hosts: k3s_nodes:k3s_agent_nodes
  become: true
  gather_facts: true

  roles:
    - role: unattended_upgrades

# Runs on the homeserver, which owns the forwarded ports: see the k3s_ingress_forward README.
- name: Forward ingress traffic to k3s's own Traefik
  hosts: home_servers
  become: true
  gather_facts: false

  roles:
    - role: k3s_ingress_forward
