---
# Not imported into site.yml on purpose: run explicitly via scripts/roll-out-k3s.sh.

- name: Provision k3s learning node
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: libvirt_host
    - role: k3s_node
      # node-1 runs everything except the CI runners and needed the CPU headroom.
      k3s_node_vm_vcpus: 3
      # Paperless-ngx OCR peaks (ADR 0023) plus the Minecraft server's 4 GiB (ADR 0036).
      k3s_node_vm_memory_mb: 14336
      # Every app image lives here; 40 GiB hit the 85% disk alert on 2026-11-16. The qcow2 is sparse.
      k3s_node_vm_disk_size_gb: 80
      # On the SSD (tracker #40).
      k3s_node_storage_mount: /
      k3s_node_vm_storage_dir: /var/lib/libvirt/k3s
      k3s_node_vm_disk_path: /var/lib/libvirt/k3s/k3s-node-1.qcow2

# Runner node: tainted for CI, in k3s_agent_nodes so the server-unit play below skips it.
- name: Provision k3s runner node
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_vm_name: k3s-node-2
      # Four runner Pods at 900m CPU each (tracker #57); 3 + 4 vCPUs leave one of the i7-2600's 8 threads to the host.
      k3s_node_vm_vcpus: 4
      k3s_node_vm_memory_mb: 8192
      # The runner caches outgrew 40 GiB; the qcow2 is sparse.
      k3s_node_vm_disk_size_gb: 100
      k3s_node_storage_mount: /
      k3s_node_vm_storage_dir: /var/lib/libvirt/k3s
      k3s_node_vm_disk_path: /var/lib/libvirt/k3s/k3s-node-2.qcow2
      k3s_node_vm_ip: 192.168.101.11
      k3s_node_vm_mac: "52:54:00:00:00:21"
      k3s_node_ssh_host_key_alias: k3s-node-2-via-homeserver
      k3s_node_inventory_group: k3s_agent_nodes

# Minecraft node (ADR 0036): tainted so only the public game server runs here, off node-1's kernel.
- name: Provision k3s Minecraft node
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_vm_name: k3s-node-3
      # Minecraft's 4 GiB limit plus the k3s agent; 3 + 4 + 2 vCPUs slightly overcommit the 8 threads.
      k3s_node_vm_vcpus: 2
      k3s_node_vm_memory_mb: 6144
      k3s_node_vm_disk_size_gb: 30
      k3s_node_storage_mount: /
      k3s_node_vm_storage_dir: /var/lib/libvirt/k3s
      k3s_node_vm_disk_path: /var/lib/libvirt/k3s/k3s-node-3.qcow2
      k3s_node_vm_ip: 192.168.101.12
      k3s_node_vm_mac: "52:54:00:00:00:22"
      k3s_node_ssh_host_key_alias: k3s-node-3-via-homeserver
      k3s_node_inventory_group: k3s_minecraft_nodes

- name: Install k3s on the learning node
  hosts: k3s_nodes
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_role_mode: configure_guest
      # terraform-state's k3s_oidc_issuer, for the External Secrets Operator's AWS login (ADR 0032).
      k3s_node_service_account_issuer: https://d2qu1br0nx9kep.cloudfront.net
      # k3s-bootstrap's hostPath PVs whose workloads run as non-root (PodSecurity restricted, tracker #50).
      k3s_node_host_path_dirs:
        - { path: /var/lib/k3s-sankey-export, owner: 10010, group: 10010, mode: "0750" }
        - { path: /var/lib/k3s-apps-data/blocky-postgres, owner: 70, group: 70, mode: "0700" }
        - { path: /var/lib/k3s-apps-data/paperless-postgres, owner: 70, group: 70, mode: "0700" }
        - { path: /var/lib/k3s-apps-data/nextcloud-html, owner: 33, group: 33, mode: "0750" }
        - { path: /var/lib/k3s-apps-data/nextcloud-postgres, owner: 70, group: 70, mode: "0700" }
        # The homeserver's minecraft-backup ids, which the Pod runs as for its NFS backup writes.
        - { path: /var/lib/k3s-apps-data/minecraft, owner: 980, group: 975, mode: "0750" }

# Read off node-1 into a hostvar, never written to disk.
- name: Retrieve k3s cluster join token
  hosts: k3s_nodes
  become: true
  gather_facts: false

  tasks:
    # k3s writes it in secure format (CA hash included) once agent-token-file is set.
    - name: Wait for the k3s agent token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/agent-token
        timeout: 120
      when: not ansible_check_mode

    # A dry run before the first apply finds none yet: the agents then get a placeholder diff.
    - name: Check for the k3s agent token
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/agent-token
      register: k3s_node_agent_token_stat

    # Never node-token: that is the server token, and agents' root would hold the cluster's CA keys.
    - name: Read the k3s agent token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/agent-token
      register: k3s_node_token_file
      no_log: true
      when: k3s_node_agent_token_stat.stat.exists

    - name: Expose the k3s agent token as a fact
      ansible.builtin.set_fact:
        k3s_node_join_token: >-
          {{ (k3s_node_token_file.content | b64decode | trim)
             if k3s_node_agent_token_stat.stat.exists else 'written-by-the-first-apply' }}
      no_log: true

- name: Install k3s on the runner node
  hosts: k3s_agent_nodes
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_role_mode: configure_guest
      k3s_node_join_mode: agent
      # A literal: role defaults aren't reliably visible via hostvars across plays.
      k3s_node_join_server_url: "https://192.168.101.10:6443"
      k3s_node_join_token: "{{ hostvars['k3s-node-1'].k3s_node_join_token }}"
      k3s_node_agent_node_taint: "ci=github-runner:NoSchedule"
      k3s_node_agent_node_label: "role=github-runner"

  post_tasks:
    # The slot runners' hostPath caches; ARC runner Pods use emptyDir only (tracker #53).
    - name: Remove the retired runner slot caches
      ansible.builtin.file:
        path: /var/lib/k3s-github-runner-cache
        state: absent

- name: Install k3s on the Minecraft node
  hosts: k3s_minecraft_nodes
  become: true
  gather_facts: true

  roles:
    - role: k3s_node
      k3s_node_role_mode: configure_guest
      k3s_node_join_mode: agent
      k3s_node_join_server_url: "https://192.168.101.10:6443"
      k3s_node_join_token: "{{ hostvars['k3s-node-1'].k3s_node_join_token }}"
      k3s_node_agent_node_taint: "workload=minecraft:NoSchedule"
      k3s_node_agent_node_label: "role=minecraft"
      k3s_node_host_path_dirs:
        # The homeserver's minecraft-backup ids, which the Pod runs as for its NFS backup writes.
        - { path: /var/lib/k3s-apps-data/minecraft, owner: 980, group: 975, mode: "0750" }

# The VMs exist as hosts only after the provision plays above added them.
- name: Security updates on the k3s nodes
  hosts: k3s_nodes:k3s_agent_nodes:k3s_minecraft_nodes
  become: true
  gather_facts: true

  roles:
    - role: unattended_upgrades

# Runs on the homeserver, which owns the forwarded ports: see the k3s_ingress_forward README.
- name: Forward ingress traffic to k3s's own Traefik
  hosts: home_servers
  become: true
  gather_facts: false

  roles:
    - role: k3s_ingress_forward
