---
- name: Remove public landing page routing
  hosts: home_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require explicit landing page rollback confirmation
      ansible.builtin.assert:
        that:
          - >-
            home_rollback_confirmation | default('')
            == "ROLL_BACK_HOME"
        fail_msg: >-
          Pass home_rollback_confirmation=ROLL_BACK_HOME only after
          confirming the public landing page route should be removed.

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_home_enabled: false
