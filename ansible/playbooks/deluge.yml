---
- name: Configure Deluge host prerequisites
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - deluge

  # One-time cleanup, not standing config: the deluge role used to run
  # Deluge itself as a Docker container (retired 2026-08-29/30, see
  # infra/k3s-apps) and no longer has a container_name/image variable at
  # all -- hardcoded here instead, since these values only need to exist
  # long enough to remove what the old role left behind. Remove this
  # tasks block once confirmed applied and the container/image are
  # actually gone (same "temporary check, deleted once proven clean"
  # pattern used for base's old iperf3 purge task).
  tasks:
    - name: Ensure the retired Deluge Docker container is gone
      community.docker.docker_container:
        name: deluge
        state: absent

    # name/tag deliberately kept separate, NOT a single "repo:tag@digest"
    # string. Confirmed live and by reading the module's own source
    # (parse_repository_tag splits on "@" first): a combined string
    # leaves `tag` holding the digest and `name` still containing
    # ":2.2.0-ls381", so absent()'s find_image(name, tag) lookup can
    # never match the real locally-stored "linuxserver/deluge:2.2.0-ls381"
    # image -- it silently reports "already absent" instead of removing
    # anything or erroring. This exact bug is why the image was still
    # sitting on the homeserver (215MB, confirmed via a live digest
    # check) after this task had already run once.
    - name: Ensure the retired Deluge Docker image is gone
      community.docker.docker_image:
        name: linuxserver/deluge
        tag: 2.2.0-ls381
        state: absent
