---
- name: Migrate Nextcloud AIO to shared ingress
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: nextcloud_aio
      nextcloud_aio_reverse_proxy_enabled: true
      nextcloud_aio_ingress_cutover_confirmation: >-
        {{ ingress_cutover_confirmation | default('') }}

    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_cutover_confirmation: >-
        {{ ingress_cutover_confirmation | default('') }}
