---
# One-time cutover playbook for shared_ingress's own move to k3s (see
# infra/k3s-apps' own modules/ingress/ and this repo's own
# k3s_ingress_forward role). Stops shared_ingress's own container --
# never deletes it -- so this stays a fast, reviewed rollback path.
# The `shared_ingress` role itself (and the family of guarded
# publish/rollback playbooks built around it) was deleted outright on
# 2026-09-01 once the cutover was confirmed live -- this playbook
# deliberately never invoked that role (see the literal container name
# below), so it keeps working unaffected: the container's own config
# lives in Docker's own state regardless of whether the Ansible source
# that originally created it still exists in this repo.
#
# Manages the container directly (docker_container: state:
# stopped/started) rather than through any role, since there's no
# `shared_ingress_enabled`-style flag left to flip and re-apply.
#
# Cut over:
#   ansible-playbook ansible/playbooks/shared-ingress-k3s-cutover.yml \
#     -e k3s_ingress_cutover_confirmation=CUTOVER_SHARED_INGRESS_TO_K3S \
#     --ask-become-pass
#
# Roll back (starts the existing, already-configured container back up
# exactly as it was -- no image pull, no recreation):
#   ansible-playbook ansible/playbooks/shared-ingress-k3s-cutover.yml \
#     -e k3s_ingress_cutover_confirmation=CUTOVER_SHARED_INGRESS_TO_K3S \
#     -e shared_ingress_k3s_cutover_action=rollback \
#     --ask-become-pass

- name: Cut shared_ingress over to k3s, or roll back
  hosts: home_servers
  become: true
  gather_facts: false

  vars:
    shared_ingress_k3s_cutover_action: cutover

  pre_tasks:
    - name: Require explicit cutover confirmation
      ansible.builtin.assert:
        that:
          - >-
            k3s_ingress_cutover_confirmation | default('')
            == "CUTOVER_SHARED_INGRESS_TO_K3S"
        fail_msg: >-
          Pass -e
          k3s_ingress_cutover_confirmation=CUTOVER_SHARED_INGRESS_TO_K3S
          only during a reviewed cutover or rollback.

    - name: Validate cutover action
      ansible.builtin.assert:
        that:
          - shared_ingress_k3s_cutover_action in ["cutover", "rollback"]
        fail_msg: >-
          shared_ingress_k3s_cutover_action must be "cutover" or
          "rollback".

  tasks:
    # Same container name the now-deleted shared_ingress role's own
    # shared_ingress_container_name default used -- a literal here
    # since that role (and its own defaults) no longer exist to
    # reference at all.
    - name: Stop shared_ingress's own container
      community.docker.docker_container:
        name: shared-ingress
        state: stopped
      when: shared_ingress_k3s_cutover_action == "cutover"

    - name: Start shared_ingress's own container back up
      community.docker.docker_container:
        name: shared-ingress
        state: started
      when: shared_ingress_k3s_cutover_action == "rollback"
