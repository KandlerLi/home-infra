---
- name: Remove public Grafana routing
  hosts: home_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require explicit Grafana rollback confirmation
      ansible.builtin.assert:
        that:
          - >-
            grafana_rollback_confirmation | default('')
            == "ROLL_BACK_GRAFANA"
        fail_msg: >-
          Pass grafana_rollback_confirmation=ROLL_BACK_GRAFANA only after
          confirming the public dashboard route should be removed.

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_grafana_enabled: false
