---
- name: Publish the landing page through existing shared ingress
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_home_enabled: true
      shared_ingress_home_publish_confirmation: >-
        {{ home_publish_confirmation | default('') }}
