---
- name: Configure home servers
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - base
    - storage
    - docker
    - blocky
    - deluge
    - nextcloud_aio
    - nextcloud_tools
    - sankey_export
    - home_agent
    - open_webui
    - shared_ingress
    - monitoring

- name: Configure GitHub Actions runner
  ansible.builtin.import_playbook: github-runner.yml
