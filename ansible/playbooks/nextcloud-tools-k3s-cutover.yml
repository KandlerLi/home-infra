---
# One-time stop of the orphaned nextcloud-tools.service, left running after its role was retired.

- name: Cut the homeserver's own nextcloud-tools.service over to k3s, or roll back
  hosts: home_servers
  become: true
  gather_facts: false

  vars:
    nextcloud_tools_k3s_cutover_action: cutover

  pre_tasks:
    - name: Require explicit cutover confirmation
      ansible.builtin.assert:
        that:
          - >-
            nextcloud_tools_cutover_confirmation | default('')
            == "CUTOVER_NEXTCLOUD_TOOLS_TO_K3S"
        fail_msg: >-
          Pass -e
          nextcloud_tools_cutover_confirmation=CUTOVER_NEXTCLOUD_TOOLS_TO_K3S
          only during a reviewed cutover or rollback.

    - name: Validate cutover action
      ansible.builtin.assert:
        that:
          - nextcloud_tools_k3s_cutover_action in ["cutover", "rollback"]
        fail_msg: >-
          nextcloud_tools_k3s_cutover_action must be "cutover" or
          "rollback".

  tasks:
    # Literal unit name: the role that defined it is gone.
    - name: Stop and disable nextcloud-tools.service
      ansible.builtin.systemd_service:
        name: nextcloud-tools.service
        state: stopped
        enabled: false
      when: nextcloud_tools_k3s_cutover_action == "cutover"

    - name: Start and enable nextcloud-tools.service back up
      ansible.builtin.systemd_service:
        name: nextcloud-tools.service
        state: started
        enabled: true
      when: nextcloud_tools_k3s_cutover_action == "rollback"
