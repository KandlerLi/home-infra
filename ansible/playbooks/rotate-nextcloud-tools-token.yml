---
- name: Rotate the restricted Nextcloud tools app password
  hosts: home_servers
  become: true
  gather_facts: true

  vars:
    nextcloud_tools_rotation_confirmation: ""

  pre_tasks:
    - name: Require confirmation for Nextcloud tools token rotation
      ansible.builtin.assert:
        that:
          - >-
            nextcloud_tools_rotation_confirmation
            == 'ROTATE_NEXTCLOUD_TOOLS_TOKEN'
        fail_msg: >-
          Token rotation requires the exact confirmation
          ROTATE_NEXTCLOUD_TOOLS_TOKEN.

    - name: List tokens before rotation
      community.docker.docker_container_exec:
        container: "{{ nextcloud_tools_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - user:auth-tokens:list
          - --output=json
          - "{{ nextcloud_tools_username }}"
      register: nextcloud_tools_tokens_before_rotation
      changed_when: false
      no_log: true

    - name: Record managed token identifiers before rotation
      ansible.builtin.set_fact:
        nextcloud_tools_old_token_ids: >-
          {{
            (nextcloud_tools_tokens_before_rotation.stdout | from_json)
            | selectattr('name', 'equalto', nextcloud_tools_token_name)
            | map(attribute='id')
            | list
          }}
      no_log: true

    - name: Generate and validate a replacement Nextcloud app password
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/generate_and_validate_nextcloud_app_password.yml"

    - name: Validate replacement token against loopback WebDAV
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:11000/remote.php/dav/files/{{ nextcloud_tools_username }}/
        method: PROPFIND
        url_username: "{{ nextcloud_tools_username }}"
        url_password: "{{ nextcloud_tools_generated_app_password }}"
        force_basic_auth: true
        headers:
          Host: "{{ nextcloud_tools_http_host }}"
          Depth: "0"
        body: >-
          <?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop>
          <d:resourcetype/></d:prop></d:propfind>
        status_code: 207
        return_content: false
      no_log: true

  roles:
    - role: nextcloud_tools
      nextcloud_tools_enabled: true
      nextcloud_tools_app_password: "{{ nextcloud_tools_generated_app_password }}"
    - role: home_agent
      home_agent_enabled: true
      home_agent_nextcloud_tools_enabled: true
      home_agent_force_recreate: true

  post_tasks:
    - name: Revoke superseded managed tokens
      community.docker.docker_container_exec:
        container: "{{ nextcloud_tools_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - user:auth-tokens:delete
          - "{{ nextcloud_tools_username }}"
          - "{{ item | string }}"
      loop: "{{ nextcloud_tools_old_token_ids }}"
      no_log: true

    - name: Verify restricted Nextcloud tools after rotation
      ansible.builtin.uri:
        url: http://localhost/v1/health
        unix_socket: "{{ nextcloud_tools_socket_path }}"
        method: GET
        return_content: false
        status_code: 200
