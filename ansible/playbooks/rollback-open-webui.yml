---
- name: Restore direct home-agent routing
  hosts: home_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require explicit Open WebUI rollback confirmation
      ansible.builtin.assert:
        that:
          - >-
            open_webui_rollback_confirmation | default('')
            == "ROLL_BACK_OPEN_WEBUI"
        fail_msg: >-
          Pass open_webui_rollback_confirmation=ROLL_BACK_OPEN_WEBUI only
          after confirming that direct home-agent routing is the intended
          production rollback.

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_agent_enabled: true
      shared_ingress_open_webui_enabled: false
