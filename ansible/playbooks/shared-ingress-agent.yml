---
- name: Publish home agent through existing shared ingress
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_agent_enabled: true
      shared_ingress_cutover_confirmation: >-
        {{ ingress_cutover_confirmation | default('') }}
