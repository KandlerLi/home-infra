---
- name: Publish Deluge through existing shared ingress
  hosts: home_servers
  become: true
  gather_facts: true

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_deluge_enabled: true
      shared_ingress_deluge_publish_confirmation: >-
        {{ deluge_publish_confirmation | default('') }}
