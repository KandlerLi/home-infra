---
- name: Remove public Deluge routing
  hosts: home_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require explicit Deluge rollback confirmation
      ansible.builtin.assert:
        that:
          - >-
            deluge_rollback_confirmation | default('')
            == "ROLL_BACK_DELUGE"
        fail_msg: >-
          Pass deluge_rollback_confirmation=ROLL_BACK_DELUGE only after
          confirming the public torrent route should be removed.

  roles:
    - role: shared_ingress
      shared_ingress_enabled: true
      shared_ingress_start: true
      shared_ingress_deluge_enabled: false
