---
blocky_enabled: false

blocky_container_name: blocky
blocky_image_name: ghcr.io/0xerr0r/blocky
blocky_image_tag: v0.34.0
blocky_image_digest: >-
  sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
blocky_image: >-
  {{ blocky_image_name }}:{{ blocky_image_tag }}@{{ blocky_image_digest }}
blocky_restart_policy: unless-stopped
blocky_config_dir: /etc/blocky
blocky_memory_limit: 256M
blocky_cpu_limit: 1.0
blocky_pids_limit: 128

# network_mode: host is required here, not just convenient (see
# tasks/main.yml) -- DNS has to be reachable at the homeserver's real LAN
# IP, which a loopback-published port can't provide. Bound to the real
# LAN IP specifically, not 0.0.0.0, so it doesn't also start answering on
# the runner VM's isolated network (virbr10) or any future interface for
# no reason. Discovered from the host's own default route rather than
# hardcoded, so it can't silently go stale if DHCP ever reassigns it.
blocky_bind_address: "{{ ansible_default_ipv4.address }}"
blocky_dns_port: 53
# The HTTP/metrics/API port stays loopback-only -- Prometheus (also
# host-networked, see the monitoring role) reaches it at 127.0.0.1, and
# nothing outside the host needs it.
blocky_http_port: 4000

# Static IPs only, never hostnames -- Blocky needs to resolve these
# before it can be the network's only resolver, and using a hostname
# here would make that resolution depend on Blocky itself (or whatever
# upstream is currently configured), a chicken-and-egg problem Blocky's
# own changelog has repeatedly had to patch around. Same reasoning for
# bootstrapDns below.
blocky_upstreams:
  - 1.1.1.1
  - 9.9.9.9
blocky_bootstrap_dns:
  - 1.1.1.1
  - 9.9.9.9

# A small, well-established starting blocklist -- not meant to be
# exhaustive, easy to extend. Every group listed here is also added to
# clientGroupsBlock.default in the template, so a new group only needs
# adding here to take effect.
blocky_denylists:
  ads:
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

blocky_postgres_container_name: blocky-postgres
blocky_postgres_image_name: postgres
blocky_postgres_image_tag: 17-alpine
blocky_postgres_image_digest: >-
  sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
blocky_postgres_image: >-
  {{ blocky_postgres_image_name }}:{{ blocky_postgres_image_tag }}@{{ blocky_postgres_image_digest }}
blocky_postgres_restart_policy: unless-stopped
# Root disk only has ~19 GiB free -- same reasoning the monitoring role's
# Prometheus TSDB already used to stay off it. Query-log data is small
# and bounded by blocky_query_log_retention_days regardless of where it
# lives; this is a single overridable path, easy to point at the SSD
# (the root disk) instead later if wanted -- see the role's README for
# the tradeoff.
blocky_postgres_data_dir: /mnt/black-hdd/blocky/postgres
blocky_postgres_port: 5432
blocky_postgres_database: blocky_query_log
blocky_postgres_user: blocky
# Set through SOPS before the first deploy, same as deluge_web_password.
blocky_postgres_password: ""
blocky_postgres_memory_limit: 256M
blocky_postgres_cpu_limit: 0.5
blocky_postgres_pids_limit: 96

blocky_query_log_retention_days: 7
