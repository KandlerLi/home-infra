---
- name: Configure Blocky
  when: blocky_enabled | bool
  block:
    - name: Validate Blocky configuration
      ansible.builtin.assert:
        that:
          - blocky_postgres_password | trim | length >= 16
          - blocky_postgres_password | trim != "CHANGE_ME"
          - blocky_dns_port | int == 53
          - blocky_http_port | int >= 1024
          - blocky_http_port | int <= 65535
          - blocky_postgres_port | int >= 1024
          - blocky_postgres_port | int <= 65535
          - blocky_upstreams | length > 0
          - blocky_bootstrap_dns | length > 0
          - blocky_denylists | length > 0
          - blocky_postgres_data_dir != blocky_config_dir
        fail_msg: >-
          Configure blocky_postgres_password through SOPS, keep the
          Blocky HTTP/Postgres ports off the DNS port, and configure at
          least one upstream, bootstrap resolver, and denylist group.
      no_log: true

    - name: Create Blocky config directory
      ansible.builtin.file:
        path: "{{ blocky_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Blocky Postgres data directory
      ansible.builtin.file:
        path: "{{ blocky_postgres_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Embeds blocky_postgres_password in the queryLog.target connection
    # string -- same no_log treatment as every other credential-bearing
    # config file in this repo (nextcloud_tools' app-password file,
    # shared_ingress's dynamic.yml.j2).
    - name: Install Blocky configuration
      ansible.builtin.template:
        src: config.yml.j2
        dest: "{{ blocky_config_dir }}/config.yml"
        owner: root
        group: root
        mode: "0644"
      register: blocky_config
      no_log: true

    # dnsutils (dig) isn't part of base's package list -- installed here,
    # scoped to this role, the same way sankey_export installs its own
    # Playwright/Chromium dependency rather than widening base.
    - name: Install dig for the DNS verification check below
      ansible.builtin.apt:
        name: dnsutils
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Pull pinned Blocky and Postgres images
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
        state: present
      loop:
        - "{{ blocky_image }}"
        - "{{ blocky_postgres_image }}"
      loop_control:
        label: "{{ item }}"

    # network_mode: host so Blocky's own DNS listener can bind the
    # homeserver's real LAN IP directly (see blocky_bind_address in
    # defaults/main.yml) -- a loopback-published port can't be reached
    # by other devices on the network the way network-wide ad-blocking
    # needs. Postgres only ever binds 127.0.0.1 (enforced below via its
    # own listen_addresses, not by network isolation), so sharing the
    # host network namespace with it is safe.
    #
    # No dedicated host uid mapping (unlike most containers in this
    # repo): the official postgres image's entrypoint needs to start as
    # root to gosu/chown into its own internal postgres user on first
    # run, so cap_drop: ALL and a forced uid would break that -- loopback
    # binding is the actual security boundary here, not capability
    # dropping (matching cAdvisor's own "runs as image default" exception
    # in the monitoring role, for the same class of reason).
    - name: Ensure Blocky Postgres container is running
      community.docker.docker_container:
        name: "{{ blocky_postgres_container_name }}"
        image: "{{ blocky_postgres_image }}"
        state: started
        restart_policy: "{{ blocky_postgres_restart_policy }}"
        network_mode: host
        security_opts:
          - no-new-privileges:true
        memory: "{{ blocky_postgres_memory_limit }}"
        cpus: "{{ blocky_postgres_cpu_limit }}"
        pids_limit: "{{ blocky_postgres_pids_limit }}"
        volumes:
          - "{{ blocky_postgres_data_dir }}:/var/lib/postgresql/data"
        env:
          POSTGRES_USER: "{{ blocky_postgres_user }}"
          POSTGRES_PASSWORD: "{{ blocky_postgres_password }}"
          POSTGRES_DB: "{{ blocky_postgres_database }}"
        # Without this, host networking would make Postgres listen on
        # every host interface by default (including the LAN-facing IP)
        # -- confirmed against the official image's own default
        # postgresql.conf. Constraining listen_addresses here is what
        # actually keeps this loopback-only, not the network_mode.
        command:
          - postgres
          - -c
          - listen_addresses=127.0.0.1
        healthcheck:
          test:
            - CMD-SHELL
            - "pg_isready -U {{ blocky_postgres_user }} -d {{ blocky_postgres_database }}"
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 20s
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"
      no_log: true

    - name: Wait for Blocky Postgres to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ blocky_postgres_port }}"
        timeout: 30
      when: not ansible_check_mode

    # cap_drop: ALL + capabilities: [NET_BIND_SERVICE] is the same shape
    # shared_ingress (Traefik) already uses for its own privileged ports
    # 80/443 -- the minimal capability Blocky needs to bind port 53
    # itself, nothing else, and no root uid override required for it.
    - name: Ensure Blocky container is running
      community.docker.docker_container:
        name: "{{ blocky_container_name }}"
        image: "{{ blocky_image }}"
        state: started
        recreate: "{{ blocky_config.changed }}"
        restart_policy: "{{ blocky_restart_policy }}"
        network_mode: host
        read_only: true
        cap_drop:
          - ALL
        capabilities:
          - NET_BIND_SERVICE
        security_opts:
          - no-new-privileges:true
        memory: "{{ blocky_memory_limit }}"
        cpus: "{{ blocky_cpu_limit }}"
        pids_limit: "{{ blocky_pids_limit }}"
        volumes:
          - "{{ blocky_config_dir }}/config.yml:/app/config.yml:ro"
        tmpfs:
          - /tmp:rw,noexec,nosuid,nodev,size=16m
        healthcheck:
          test:
            - CMD
            - wget
            - --spider
            - --quiet
            - "http://127.0.0.1:{{ blocky_http_port }}/api/blocking/status"
          interval: 30s
          timeout: 5s
          retries: 5
          start_period: 15s
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"

    - name: Verify Blocky is answering DNS queries
      ansible.builtin.command:
        cmd: >-
          dig +short +timeout=5 @{{ blocky_bind_address }}
          -p {{ blocky_dns_port }} example.com
      register: blocky_dns_check
      changed_when: false
      retries: 10
      delay: 2
      until: blocky_dns_check.rc == 0 and blocky_dns_check.stdout | trim | length > 0
      when: not ansible_check_mode
