# Validates even when disabled, so a broken source list can't lie dormant.
- name: Validate aux_backup configuration
  ansible.builtin.assert:
    that:
      - >-
        not (aux_backup_enabled | bool)
        or (aux_backup_sources | length > 0)
    fail_msg: >-
      aux_backup_sources is empty -- aux_backup_enabled can't be true
      with nothing configured to back up.

# The script needs rsync for sqlite_files sources; not installed here by default.
- name: Install rsync
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true

- name: Create aux_backup install directory
  ansible.builtin.file:
    path: "{{ aux_backup_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ReadWritePaths= needs the directory before the unit's first start.
- name: Create aux_backup destination directory
  ansible.builtin.file:
    path: "{{ aux_backup_dest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install aux-backup script
  ansible.builtin.template:
    src: aux-backup.sh.j2
    dest: "{{ aux_backup_install_dir }}/aux-backup.sh"
    owner: root
    group: root
    mode: "0755"
  register: aux_backup_script

- name: Install aux-backup systemd service unit
  ansible.builtin.template:
    src: aux-backup.service.j2
    dest: /etc/systemd/system/aux-backup.service
    owner: root
    group: root
    mode: "0644"
  register: aux_backup_service_unit

- name: Install aux-backup systemd timer unit
  ansible.builtin.template:
    src: aux-backup.timer.j2
    dest: /etc/systemd/system/aux-backup.timer
    owner: root
    group: root
    mode: "0644"
  register: aux_backup_timer_unit

- name: Reload systemd for the aux-backup units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    aux_backup_script.changed
    or aux_backup_service_unit.changed
    or aux_backup_timer_unit.changed

# A real toggle: disabling stops the timer.
- name: Ensure aux-backup timer is in its desired running state
  ansible.builtin.systemd_service:
    name: aux-backup.timer
    enabled: "{{ aux_backup_enabled | bool }}"
    state: >-
      {{
        ('restarted' if (aux_backup_timer_unit.changed) else 'started')
        if (aux_backup_enabled | bool)
        else 'stopped'
      }}
