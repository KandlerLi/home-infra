# Opt-in. Small host directories Nextcloud AIO's Borg backup never covers: see the README.
aux_backup_enabled: false

# Same disk as Borg, its own subdirectory; plain dated tarballs.
aux_backup_dest_dir: /mnt/red-hdd/aux-backups

# Independent of Borg's retention.
aux_backup_retention_days: 14

# Offset from Nextcloud's 03:00 Borg backup.
aux_backup_schedule: "*-*-* 03:30:00"

# name labels the archive and the logs; path is the real host directory.
aux_backup_sources:
  - name: deluge-config
    path: /mnt/black-hdd/deluge-config
  - name: open-webui
    path: /var/lib/open-webui
    # Live WAL-mode SQLite: snapshotted with the online backup API, never copied raw.
    sqlite_files:
      - webui.db

# Same location convention as blocky_ipv6_relay_install_dir.
aux_backup_install_dir: /usr/local/lib/aux-backup
