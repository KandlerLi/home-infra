---
# Opt-in. Host side of Paperless-ngx (ADR 0023): see the README.
paperless_storage_enabled: false

# Live documents on the black HDD, exports on the red HDD.
paperless_storage_media_dir: /mnt/black-hdd/paperless-media
paperless_storage_export_dir: /mnt/red-hdd/paperless-export

# Pinned, so k3s-apps can hardcode the same ids.
paperless_storage_user: paperless
paperless_storage_uid: 983
paperless_storage_gid: 978
