---
# Validates even when disabled, so a typo can't lie dormant.
- name: Validate blocky_ipv6_relay configuration
  ansible.builtin.assert:
    that:
      - >-
        not (blocky_ipv6_relay_enabled | bool)
        or (
          blocky_ipv6_relay_lan_prefix | trim | length > 0
          and blocky_ipv6_relay_lan_prefix | trim != "::/0"
        )
    fail_msg: >-
      blocky_ipv6_relay_lan_prefix must be set to the LAN's own real
      IPv6 prefix (never ::/0) before blocky_ipv6_relay_enabled can be
      true -- see this role's own README/defaults for where to find
      it. An empty or wide-open value here would mean either nothing
      is protecting this DNS relay, or it's protecting nothing.

- name: Create blocky_ipv6_relay service account
  ansible.builtin.user:
    name: "{{ blocky_ipv6_relay_service_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create blocky_ipv6_relay install directory
  ansible.builtin.file:
    path: "{{ blocky_ipv6_relay_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install blocky_ipv6_relay script
  ansible.builtin.copy:
    src: blocky_ipv6_relay.py
    dest: "{{ blocky_ipv6_relay_install_dir }}/blocky_ipv6_relay.py"
    owner: root
    group: root
    mode: "0644"
  register: blocky_ipv6_relay_script

- name: Install blocky_ipv6_relay systemd unit
  ansible.builtin.template:
    src: blocky-ipv6-relay.service.j2
    dest: /etc/systemd/system/blocky-ipv6-relay.service
    owner: root
    group: root
    mode: "0644"
  register: blocky_ipv6_relay_unit

- name: Reload systemd for the blocky_ipv6_relay unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: blocky_ipv6_relay_unit.changed

# A real toggle: disabling stops a running relay.
- name: Ensure blocky_ipv6_relay is in its desired running state
  ansible.builtin.systemd_service:
    name: blocky-ipv6-relay.service
    enabled: "{{ blocky_ipv6_relay_enabled | bool }}"
    state: >-
      {{
        (
          'restarted'
          if (blocky_ipv6_relay_script.changed or blocky_ipv6_relay_unit.changed)
          else 'started'
        )
        if (blocky_ipv6_relay_enabled | bool)
        else 'stopped'
      }}

# Gated on the prefix, so disabling still removes a live rule.
- name: Preseed iptables-persistent to skip its install-time prompts
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "iptables-persistent/autosave_{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - v4
    - v6
  when: blocky_ipv6_relay_lan_prefix | length > 0

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true
  when: blocky_ipv6_relay_lan_prefix | length > 0

# ip_version: ipv6 targets ip6tables only.
- name: Allow blocky_ipv6_relay's own DNS port through ip6tables
  ansible.builtin.iptables:
    state: "{{ 'present' if (blocky_ipv6_relay_enabled | bool) else 'absent' }}"
    ip_version: ipv6
    chain: INPUT
    protocol: "{{ item }}"
    destination_port: 53
    source: "{{ blocky_ipv6_relay_lan_prefix }}"
    jump: ACCEPT
    comment: "blocky_ipv6_relay: allow {{ item }} 53 from {{ blocky_ipv6_relay_lan_prefix }}"
  loop:
    - tcp
    - udp
  loop_control:
    label: "{{ item }} 53 from {{ blocky_ipv6_relay_lan_prefix }}"
  when: blocky_ipv6_relay_lan_prefix | length > 0
  register: blocky_ipv6_relay_firewall_result

- name: Persist blocky_ipv6_relay's own ip6tables rule across reboots
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: blocky_ipv6_relay_firewall_result is changed
