# Opt-in: it answers real LAN DNS queries. See the README.
blocky_ipv6_relay_enabled: false

# Blocky's fixed k3s LoadBalancer address.
blocky_ipv6_relay_backend_host: 192.168.101.10
blocky_ipv6_relay_backend_port: 53

# The access boundary: the ip6tables rule only admits this prefix. Empty refuses to deploy. See the README.
blocky_ipv6_relay_lan_prefix: ""

blocky_ipv6_relay_service_user: blocky-ipv6-relay
blocky_ipv6_relay_install_dir: /usr/local/lib/blocky-ipv6-relay
