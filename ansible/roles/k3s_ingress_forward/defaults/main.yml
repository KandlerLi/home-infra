# Opt-in, matching every other role's own convention -- forwards the
# homeserver's own public/LAN-facing ports straight through to a k3s
# Service, a plain L4 DNAT relay. Originally built for k3s's own
# Traefik (infra/k3s-apps' own modules/ingress/), so ACME's
# TLS-ALPN-01 challenge could still reach the real cert-issuing
# instance directly, below the TLS layer -- the same relay now also
# carries LAN-facing DNS traffic to infra/k3s-apps' own modules/
# blocky/. See this role's own README for the full "why DNAT, not
# bridging the k3s VM onto the LAN" reasoning.
k3s_ingress_forward_enabled: false

# k3s-node-1's own static address (k3s_node's own k3s_node_vm_ip
# default) -- a literal here rather than a cross-role variable lookup,
# matching ansible/playbooks/k3s.yml's own k3s_node_join_server_url
# precedent for the same reason (role defaults aren't reliably
# exposed across roles the way a real dependency would be). Asserted
# against below -- this role forwards real public traffic, so a
# silent typo here would relay it to the wrong place entirely.
k3s_ingress_forward_target_ip: 192.168.101.10

# k3s_node's own libvirt bridge for the k3s network (k3s_node's own
# k3s_node_network_bridge default) -- a literal here rather than a
# cross-role lookup, same reasoning as k3s_ingress_forward_target_ip
# above. Excluded from the DNAT rule's own in_interface match below:
# PREROUTING/nat sees every packet entering any interface, including
# the k3s VM's own outbound connections as they transit this bridge
# on their way out to the internet. Without this exclusion, an
# outbound packet from the VM itself using source port 80/443 -- e.g.
# any HTTPS image pull -- matches the DNAT rule's own destination_port
# match just as well as real inbound traffic does, and gets hairpinned
# straight back to the VM's own address instead of ever leaving.
# Confirmed live (2026-09-01): this exact bug silently broke every
# outbound HTTPS/HTTP connection from k3s-node-1, surfacing as
# ImagePullBackOff with no other visible cause.
k3s_ingress_forward_target_bridge: virbr11

# public_port: what the homeserver itself listens on (the FRITZ!Box's
# own port-forward already targets the homeserver's LAN IP for
# 80/443, so that's also what a manual router forward should point
# at; 53 needs no router change at all -- LAN clients already point
# at the homeserver's own LAN IP for DNS). target_port: what the k3s
# Service actually has bound inside the cluster. protocol: tcp by
# default (every rule here needed only tcp until DNS); DNS needs both
# tcp and udp, so this is a real per-rule field, not a role-wide
# constant. Overridable at apply time (e.g. -e for a throwaway
# rehearsal port) without touching this file -- see the role's own
# README for the staging-ACME rehearsal's own rule shape.
k3s_ingress_forward_rules:
  - public_port: 80
    target_port: 80
  - public_port: 443
    target_port: 443
  # The real cutover: infra/k3s-apps' own modules/blocky verified
  # healthy internally first (2026-09-01) -- both containers running,
  # a real in-cluster nslookup resolving correctly via both the
  # Service name and this exact 192.168.101.10 target -- before ever
  # forwarding real LAN DNS traffic to it. tcp+udp both needed (DNS
  # falls back to tcp for responses too large for a single udp
  # datagram); everything else in this list only ever needed tcp.
  - public_port: 53
    target_port: 53
    protocol: tcp
  - public_port: 53
    target_port: 53
    protocol: udp
  # Inbound SMTP for the k3s-native Stalwart mail server (infra/k3s-apps'
  # own modules/stalwart/). The FRITZ!Box's own port-forward for 25
  # (manual, out-of-band) targets the homeserver's LAN IP, same as
  # 80/443; this rule is what carries it the rest of the way into the
  # cluster. Only inbound port 25 -- submission/IMAP are not exposed
  # publicly by this change. Harmless while nothing listens yet: the
  # connection is simply refused at 192.168.101.10:25.
  - public_port: 25
    target_port: 25
    protocol: tcp
