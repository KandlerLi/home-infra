# Opt-in L4 DNAT relay from the homeserver's ports to k3s Services. See the README.
k3s_ingress_forward_enabled: false

# k3s-node-1's static address.
k3s_ingress_forward_target_ip: 192.168.101.10

# Excluded from the DNAT match, or the VM's own outbound traffic gets hairpinned.
k3s_ingress_forward_target_bridge: virbr11

# public_port on the homeserver, target_port on the k3s Service, protocol per rule.
k3s_ingress_forward_rules:
  - public_port: 80
    target_port: 80
  - public_port: 443
    target_port: 443
  # DNS to Blocky, tcp and udp.
  - public_port: 53
    target_port: 53
    protocol: tcp
  - public_port: 53
    target_port: 53
    protocol: udp
  # Inbound SMTP for Stalwart; nothing else mail-related on plaintext.
  - public_port: 25
    target_port: 25
    protocol: tcp
  # IMAPS and implicit-TLS submission only; plaintext 143/587 are never forwarded.
  - public_port: 993
    target_port: 993
    protocol: tcp
  - public_port: 465
    target_port: 465
    protocol: tcp
