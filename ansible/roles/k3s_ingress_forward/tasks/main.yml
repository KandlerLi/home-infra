---
- name: Validate k3s ingress forward configuration
  ansible.builtin.assert:
    that:
      - k3s_ingress_forward_target_ip == "192.168.101.10"
      - k3s_ingress_forward_rules | length > 0
    fail_msg: >-
      k3s_ingress_forward_target_ip must stay pinned to k3s-node-1's own
      static address -- this role forwards real public traffic, so a
      silent typo here would relay it to the wrong place entirely.

# debconf preseed avoids apt blocking on iptables-persistent's
# interactive "Save current IPv4/IPv6 rules?" install-time prompt.
- name: Preseed iptables-persistent to skip its install-time prompts
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "iptables-persistent/autosave_{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - v4
    - v6

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true

# Confirmed live on the homeserver (2026-08-31): FORWARD's own default
# policy is ACCEPT, but libvirt's own LIBVIRT_FWI chain (its
# auto-managed "forward into this NAT network" chain) only accepts
# RELATED,ESTABLISHED traffic into a NAT-mode network by default --
# the standard libvirt firewall pattern, REJECTing a fresh externally-
# initiated connection otherwise. Inserted at rule_num 1 of the base
# FORWARD chain -- ahead of Docker's own DOCKER-USER/DOCKER-FORWARD
# chains and libvirt's own LIBVIRT_FWX/FWI/FWO chains alike -- so this
# terminates before ever reaching either vendor's chains, and doesn't
# depend on their internal contents at all. Scoped tightly to exactly
# k3s_ingress_forward_target_ip and each rule's own target_port, never
# a blanket FORWARD ACCEPT, so nothing else forwarded through this
# host is affected. Return traffic (the VM responding back out) isn't
# covered here deliberately -- libvirt's own LIBVIRT_FWO chain already
# permits the NAT network's own subnet to send established/outbound
# traffic freely, that being the entire point of a NAT-mode network.
- name: Allow forwarded ingress traffic to reach k3s
  ansible.builtin.iptables:
    state: "{{ 'present' if (k3s_ingress_forward_enabled | bool) else 'absent' }}"
    action: insert
    rule_num: 1
    chain: FORWARD
    destination: "{{ k3s_ingress_forward_target_ip }}"
    protocol: "{{ item.protocol | default('tcp') }}"
    destination_port: "{{ item.target_port }}"
    ctstate:
      - NEW
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    comment: >-
      k3s_ingress_forward: allow {{ item.protocol | default('tcp') }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  register: k3s_ingress_forward_accept_result

# One-time reconciliation, the same class of fix as the DNAT rule's
# own reconciliation below: this rule's own comment format (and its
# always-tcp protocol) predates per-rule protocol support (commit
# 84662f5) -- confirmed live (2026-09-01), inspecting the actual
# persisted /etc/iptables/rules.v4: the pre-fix shape was never
# cleaned up here the way it was for the DNAT rule, so duplicate
# FORWARD ACCEPT rules for 80/443 have been sitting there ever since
# (harmless -- both just ACCEPT the same traffic -- but exactly the
# kind of silent config drift this repo tries not to accumulate).
- name: Remove the pre-fix FORWARD accept rule shape (always tcp, no protocol in comment)
  ansible.builtin.iptables:
    state: absent
    chain: FORWARD
    destination: "{{ k3s_ingress_forward_target_ip }}"
    protocol: tcp
    destination_port: "{{ item.target_port }}"
    ctstate:
      - NEW
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    comment: >-
      k3s_ingress_forward: allow ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  when: k3s_ingress_forward_enabled | bool
  register: k3s_ingress_forward_accept_reconcile_result

# One-time reconciliation: every DNAT rule this role ever applied
# before 2026-09-01 was created without an in_interface restriction,
# so it also hairpinned the k3s VM's own outbound traffic back to
# itself (see k3s_ingress_forward_target_bridge's own comment in
# defaults/main.yml). Ansible's iptables module matches rules by
# their exact parameter set, so simply re-applying the corrected rule
# below would add it alongside the old one rather than replacing it --
# and since DNAT terminates further PREROUTING processing, the old,
# broken rule (evaluated first) would keep winning. This explicitly
# removes that old rule shape; a no-op forever after the first apply
# that includes it, safe to delete once every real host has picked up
# this fix.
- name: Remove the pre-fix DNAT rule shape (no interface restriction)
  ansible.builtin.iptables:
    state: absent
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "{{ item.public_port }}"
    jump: DNAT
    to_destination: "{{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}"
    # Matches this role's very first shape (commit 4accac7), from
    # before per-rule protocol support added a "tcp"/"udp" prefix to
    # this comment (commit 84662f5) -- iptables -C requires every
    # specified field to match exactly, comment included, so this has
    # to reproduce the original text verbatim, not the current
    # template, to actually find and remove the live rule.
    comment: >-
      k3s_ingress_forward: {{ item.public_port }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  when: k3s_ingress_forward_enabled | bool
  register: k3s_ingress_forward_reconcile_result

- name: Relay ingress traffic to k3s via DNAT
  ansible.builtin.iptables:
    state: "{{ 'present' if (k3s_ingress_forward_enabled | bool) else 'absent' }}"
    table: nat
    chain: PREROUTING
    # Excludes the k3s VM's own outbound traffic from matching this
    # rule -- see k3s_ingress_forward_target_bridge's own comment in
    # defaults/main.yml for why this is required, not optional.
    in_interface: "!{{ k3s_ingress_forward_target_bridge }}"
    protocol: "{{ item.protocol | default('tcp') }}"
    destination_port: "{{ item.public_port }}"
    jump: DNAT
    to_destination: "{{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}"
    comment: >-
      k3s_ingress_forward: {{ item.protocol | default('tcp') }}
      {{ item.public_port }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  register: k3s_ingress_forward_dnat_result

# One-time catch-up for the same 2026-09-01 bug: the reconciliation
# task's own result went unregistered for one real apply (fixed
# above), so a run that genuinely removed the old rule live still
# skipped persisting -- the saved iptables-persistent state on disk
# is stale relative to the live table until this runs once. Safe to
# delete once every real host has picked up this fix (matches the
# reconciliation task's own note on its own eventual removal).
- name: Force-persist once to catch the saved state up to 2026-09-01's live fix
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: k3s_ingress_forward_enabled | bool

- name: Persist iptables rules across reboots
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: >-
    k3s_ingress_forward_accept_result is changed
    or k3s_ingress_forward_accept_reconcile_result is changed
    or k3s_ingress_forward_reconcile_result is changed
    or k3s_ingress_forward_dnat_result is changed
