---
- name: Validate k3s ingress forward configuration
  ansible.builtin.assert:
    that:
      - k3s_ingress_forward_target_ip == "192.168.101.10"
      - k3s_ingress_forward_rules | length > 0
    fail_msg: >-
      k3s_ingress_forward_target_ip must stay pinned to k3s-node-1's own
      static address -- this role forwards real public traffic, so a
      silent typo here would relay it to the wrong place entirely.

# debconf preseed avoids apt blocking on iptables-persistent's
# interactive "Save current IPv4/IPv6 rules?" install-time prompt.
- name: Preseed iptables-persistent to skip its install-time prompts
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "iptables-persistent/autosave_{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - v4
    - v6

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true

# Inserted at rule_num 1 of the base FORWARD chain -- ahead of Docker's
# and libvirt's own chains, so this terminates before ever reaching
# either. See docs/home-infra-ai-context's current-state.md ("k3s
# learning cluster") for why libvirt's own LIBVIRT_FWI chain needs
# this. Scoped tightly to k3s_ingress_forward_target_ip and each
# rule's own target_port, never a blanket FORWARD ACCEPT.
- name: Allow forwarded ingress traffic to reach k3s
  ansible.builtin.iptables:
    state: "{{ 'present' if (k3s_ingress_forward_enabled | bool) else 'absent' }}"
    action: insert
    rule_num: 1
    chain: FORWARD
    destination: "{{ k3s_ingress_forward_target_ip }}"
    protocol: "{{ item.protocol | default('tcp') }}"
    destination_port: "{{ item.target_port }}"
    ctstate:
      - NEW
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    comment: >-
      k3s_ingress_forward: allow {{ item.protocol | default('tcp') }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  register: k3s_ingress_forward_accept_result

# One-time reconciliation: this rule's own comment format (and its
# always-tcp protocol) predates per-rule protocol support, and the
# pre-fix shape was never cleaned up the way the DNAT rule's own was --
# harmless duplicate ACCEPT rules, but the kind of drift this repo
# tries not to accumulate.
- name: Remove the pre-fix FORWARD accept rule shape (always tcp, no protocol in comment)
  ansible.builtin.iptables:
    state: absent
    chain: FORWARD
    destination: "{{ k3s_ingress_forward_target_ip }}"
    protocol: tcp
    destination_port: "{{ item.target_port }}"
    ctstate:
      - NEW
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    comment: >-
      k3s_ingress_forward: allow ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  when: k3s_ingress_forward_enabled | bool
  register: k3s_ingress_forward_accept_reconcile_result

# One-time reconciliation for the hairpin bug this role's DNAT rule
# used to have -- see current-state.md. Ansible's iptables module
# matches rules by exact parameter set, so re-applying the corrected
# rule alone would add it alongside the old, still-winning one instead
# of replacing it. Safe to delete once every real host has picked up
# this fix.
- name: Remove the pre-fix DNAT rule shape (no interface restriction)
  ansible.builtin.iptables:
    state: absent
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "{{ item.public_port }}"
    jump: DNAT
    to_destination: "{{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}"
    # Matches this role's very first shape (commit 4accac7), from
    # before per-rule protocol support added a "tcp"/"udp" prefix to
    # this comment (commit 84662f5) -- iptables -C requires every
    # specified field to match exactly, comment included, so this has
    # to reproduce the original text verbatim, not the current
    # template, to actually find and remove the live rule.
    comment: >-
      k3s_ingress_forward: {{ item.public_port }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  when: k3s_ingress_forward_enabled | bool
  register: k3s_ingress_forward_reconcile_result

# One-time reconciliation, same class of bug as the interface-
# restriction fix above -- see current-state.md for the real Nextcloud
# AIO/ghcr.io crash loop this caused. Removes the old,
# destination-unrestricted rule shape; a no-op after the first apply
# that includes it.
- name: Remove the destination-unrestricted DNAT rule shape (2026-09-05 fix)
  ansible.builtin.iptables:
    state: absent
    table: nat
    chain: PREROUTING
    in_interface: "!{{ k3s_ingress_forward_target_bridge }}"
    protocol: "{{ item.protocol | default('tcp') }}"
    destination_port: "{{ item.public_port }}"
    jump: DNAT
    to_destination: "{{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}"
    comment: >-
      k3s_ingress_forward: {{ item.protocol | default('tcp') }}
      {{ item.public_port }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  when: k3s_ingress_forward_enabled | bool
  register: k3s_ingress_forward_dnat_reconcile_result

- name: Relay ingress traffic to k3s via DNAT
  ansible.builtin.iptables:
    state: "{{ 'present' if (k3s_ingress_forward_enabled | bool) else 'absent' }}"
    table: nat
    chain: PREROUTING
    # Excludes the k3s VM's own outbound traffic from matching this
    # rule -- see k3s_ingress_forward_target_bridge's own comment in
    # defaults/main.yml for why this is required, not optional.
    in_interface: "!{{ k3s_ingress_forward_target_bridge }}"
    # Restricts this rule to packets actually addressed to this host --
    # ansible_host is the same address inventory already uses to reach
    # this box, so there's no separate literal to drift out of sync.
    # See the reconciliation task above for why this wasn't here
    # before, and what it broke.
    destination: "{{ ansible_host }}"
    protocol: "{{ item.protocol | default('tcp') }}"
    destination_port: "{{ item.public_port }}"
    jump: DNAT
    to_destination: "{{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}"
    comment: >-
      k3s_ingress_forward: {{ item.protocol | default('tcp') }}
      {{ item.public_port }} ->
      {{ k3s_ingress_forward_target_ip }}:{{ item.target_port }}
  loop: "{{ k3s_ingress_forward_rules }}"
  loop_control:
    label: >-
      {{ item.protocol | default('tcp') }}
      {{ item.public_port }} -> {{ item.target_port }}
  register: k3s_ingress_forward_dnat_result

# One-time catch-up: an earlier apply removed the old rule live but
# skipped persisting, so the saved iptables-persistent state on disk
# is stale until this runs once. Safe to delete once every real host
# has picked up this fix.
- name: Force-persist once to catch the saved state up to 2026-09-01's live fix
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: k3s_ingress_forward_enabled | bool

- name: Persist iptables rules across reboots
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: >-
    k3s_ingress_forward_accept_result is changed
    or k3s_ingress_forward_accept_reconcile_result is changed
    or k3s_ingress_forward_reconcile_result is changed
    or k3s_ingress_forward_dnat_reconcile_result is changed
    or k3s_ingress_forward_dnat_result is changed
