---
- name: Configure Minecraft backup destination
  when: minecraft_backup_enabled | bool
  block:
    - name: Create Minecraft backup group
      ansible.builtin.group:
        name: "{{ minecraft_backup_user }}"
        gid: "{{ minecraft_backup_gid }}"
        system: true

    - name: Create Minecraft backup service account
      ansible.builtin.user:
        name: "{{ minecraft_backup_user }}"
        uid: "{{ minecraft_backup_uid }}"
        group: "{{ minecraft_backup_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create Minecraft backup destination directory
      ansible.builtin.file:
        path: "{{ minecraft_backup_dir }}"
        state: directory
        owner: "{{ minecraft_backup_user }}"
        group: "{{ minecraft_backup_user }}"
        mode: "0700"
