---
# "Sign in with Authelia" via user_oidc; k3s-apps registers the matching client. See the README.
- name: Validate Authelia OIDC client secret for Nextcloud
  ansible.builtin.assert:
    that:
      - authelia_oidc_nextcloud_client_secret | trim | length >= 32
      - authelia_oidc_nextcloud_client_secret | trim != "CHANGE_ME"
    fail_msg: >-
      authelia_oidc_nextcloud_client_secret looks unset or still
      CHANGE_ME -- update the home-infra/nextcloud AWS Secrets Manager
      secret (its own JSON blob, not just this one key --
      `aws secretsmanager get-secret-value` first, merge in the real
      value, then `put-secret-value` the whole thing back) with the
      same value KandlerLi/k3s-apps' own modules/authelia hashes for its
      "nextcloud" client.

# app:install is idempotent.
- name: Install the user_oidc app
  community.docker.docker_container_exec:
    container: "{{ nextcloud_aio_nextcloud_container }}"
    user: www-data
    argv:
      - php
      - occ
      - app:install
      - user_oidc
  register: nextcloud_aio_oidc_app_install
  changed_when: >-
    'already installed' not in (nextcloud_aio_oidc_app_install.stdout | default(''))
  failed_when: >-
    nextcloud_aio_oidc_app_install.rc != 0
    and 'already installed' not in (nextcloud_aio_oidc_app_install.stdout | default(''))

# An upsert, safe on every apply; no_log keeps the client secret out of output.
- name: Register Authelia as an OIDC provider
  community.docker.docker_container_exec:
    container: "{{ nextcloud_aio_nextcloud_container }}"
    user: www-data
    argv:
      - php
      - occ
      - user_oidc:provider
      - "{{ nextcloud_aio_oidc_provider_name }}"
      - "--clientid={{ nextcloud_aio_oidc_client_id }}"
      - "--clientsecret={{ authelia_oidc_nextcloud_client_secret }}"
      - "--discoveryuri={{ nextcloud_aio_oidc_discovery_uri }}"
  no_log: true
  changed_when: true

# user_oidc's documented force-SSO: with one provider, the login page redirects to it.
- name: Force SSO -- redirect Nextcloud's own login form to Authelia
  community.docker.docker_container_exec:
    container: "{{ nextcloud_aio_nextcloud_container }}"
    user: www-data
    argv:
      - php
      - occ
      - config:app:set
      - --value=0
      - user_oidc
      - allow_multiple_user_backends
  changed_when: true
