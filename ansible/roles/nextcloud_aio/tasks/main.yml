---
- name: Read Nextcloud AIO master container state
  community.docker.docker_container_info:
    name: "{{ nextcloud_aio_container_name }}"
  register: nextcloud_aio_master_info

- name: Record current Nextcloud AIO ingress mode
  ansible.builtin.set_fact:
    nextcloud_aio_current_reverse_proxy: >-
      {{ nextcloud_aio_master_info.exists
         and 'APACHE_PORT=' ~ (nextcloud_aio_apache_port | string)
             in nextcloud_aio_master_info.container.Config.Env
         and 'APACHE_IP_BINDING=' ~ nextcloud_aio_apache_ip_binding
             in nextcloud_aio_master_info.container.Config.Env }}

- name: Prevent an implicit reverse proxy rollback
  ansible.builtin.assert:
    that:
      - >-
        not nextcloud_aio_current_reverse_proxy
        or nextcloud_aio_reverse_proxy_enabled | bool
        or nextcloud_aio_reverse_proxy_rollback | bool
    fail_msg: >-
      The live AIO master is in reverse-proxy mode, but the desired state is
      direct ingress. Persist nextcloud_aio_reverse_proxy_enabled=true after a
      successful cutover, or use the guarded rollback playbook.

- name: Validate reverse proxy transition prerequisites
  when: >-
    (nextcloud_aio_reverse_proxy_enabled | bool
     and not nextcloud_aio_current_reverse_proxy)
    or (nextcloud_aio_reverse_proxy_rollback | bool
        and nextcloud_aio_current_reverse_proxy)
  block:
    - name: Require explicit ingress cutover confirmation
      ansible.builtin.assert:
        that:
          - >-
            nextcloud_aio_ingress_cutover_confirmation
            == (
              nextcloud_aio_reverse_proxy_enabled
              | ternary(
                  "MIGRATE_NEXTCLOUD_INGRESS",
                  "ROLLBACK_NEXTCLOUD_INGRESS"
                )
            )
          - >-
            not (
              nextcloud_aio_reverse_proxy_enabled | bool
              and nextcloud_aio_reverse_proxy_rollback | bool
            )
          - >-
            not nextcloud_aio_reverse_proxy_enabled | bool
            or nextcloud_aio_apache_port | int == 11000
          # The same deliberate exception shared_ingress's own upstream
          # validation already uses for home.jkandler.de/
          # torrent.jkandler.de: 192.168.101.1 is this homeserver's own
          # address on the k3s VM's isolated libvirt NAT network, not a
          # public or LAN-wide address -- confirmed (see nfs_server's own
          # README) that network has no route from anywhere but this
          # host. Binding Apache there instead of 127.0.0.1 doesn't
          # actually leave the host's own trust boundary, it just adds
          # reachability for the one VM attached to it (needed once
          # nextcloud_tools runs there instead of on this host) alongside
          # every process already on this host. shared_ingress's own
          # nextcloud_upstream must be switched to match at the same
          # time, or it loses its own route to Apache.
          - >-
            not nextcloud_aio_reverse_proxy_enabled | bool
            or nextcloud_aio_apache_ip_binding == "127.0.0.1"
            or nextcloud_aio_apache_ip_binding == "192.168.101.1"
          - not nextcloud_aio_skip_domain_validation | bool
        fail_msg: >-
          Stop the AIO application containers through the AIO interface and
          pass the documented migration or rollback confirmation only during
          the reviewed maintenance window.

    - name: Read Nextcloud AIO Apache container state
      community.docker.docker_container_info:
        name: nextcloud-aio-apache
      register: nextcloud_aio_apache_info

    - name: Require AIO Apache to be stopped before changing ingress
      ansible.builtin.assert:
        that:
          - >-
            not nextcloud_aio_apache_info.exists
            or not nextcloud_aio_apache_info.container.State.Running
        fail_msg: >-
          nextcloud-aio-apache is still running. Stop all application
          containers through the AIO interface before the cutover.

- name: Ensure AIO configuration volume exists
  community.docker.docker_volume:
    name: "{{ nextcloud_aio_config_volume }}"
    state: present

- name: Ensure Nextcloud AIO master container is running
  community.docker.docker_container:
    name: "{{ nextcloud_aio_container_name }}"
    image: "{{ nextcloud_aio_image }}"
    state: started
    restart_policy: "{{ nextcloud_aio_restart_policy }}"
    init: true
    network_mode: bridge
    published_ports: >-
      {{ nextcloud_aio_reverse_proxy_enabled
         | ternary(nextcloud_aio_reverse_proxy_ports, nextcloud_aio_ports) }}
    comparisons:
      published_ports: strict
      volumes: strict
      env: strict
    volumes: >-
      {{
        [
          "/var/run/docker.sock:/var/run/docker.sock:ro",
          nextcloud_aio_config_volume ~ ":/mnt/docker-aio-config"
        ]
        + (
            [nextcloud_aio_mount_dir ~ ":" ~ nextcloud_aio_mount_dir]
            if nextcloud_aio_mount_dir | length > 0
            else []
          )
      }}
    env: >-
      {{ {'NEXTCLOUD_DATADIR': nextcloud_aio_data_dir}
         | combine(
             nextcloud_aio_reverse_proxy_enabled
             | ternary(
                 {
                   'APACHE_PORT': nextcloud_aio_apache_port | string,
                   'APACHE_IP_BINDING': nextcloud_aio_apache_ip_binding,
                   'SKIP_DOMAIN_VALIDATION':
                     nextcloud_aio_skip_domain_validation | string | lower
                 },
                 nextcloud_aio_reverse_proxy_rollback
                 | ternary(
                     {
                       'APACHE_PORT': '443',
                       'APACHE_IP_BINDING': '0.0.0.0',
                       'SKIP_DOMAIN_VALIDATION': 'false'
                     },
                     {}
                   )
               )
           )
         | combine(
             {'NEXTCLOUD_MOUNT': nextcloud_aio_mount_dir}
             if nextcloud_aio_mount_dir | length > 0
             else {}
           ) }}

# The occ commands below were not verified against a live AIO instance at
# write time (files_external:list's exact JSON shape and files_external:
# create's exact positional-argument acceptance can vary by Nextcloud
# version). If any task here fails, run the equivalent commands by hand
# inside the nextcloud-aio-nextcloud container to find the actual shape
# and fix this file -- do not silently skip past a failure here.
- name: Manage local external storage for the mounted downloads folder
  when: nextcloud_aio_mount_dir | length > 0
  block:
    - name: List existing external storage mounts
      community.docker.docker_container_exec:
        container: "{{ nextcloud_aio_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - files_external:list
          - --output=json
      register: nextcloud_aio_external_storage_list
      changed_when: false

    - name: Find the downloads mount, if it already exists
      ansible.builtin.set_fact:
        nextcloud_aio_downloads_mount: >-
          {{
            (nextcloud_aio_external_storage_list.stdout | from_json)
            | selectattr(
                'mount_point', 'search', nextcloud_aio_mount_point_name ~ '$'
              )
            | list
          }}

    - name: Create local external storage for the downloads folder
      community.docker.docker_container_exec:
        container: "{{ nextcloud_aio_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - files_external:create
          - "{{ nextcloud_aio_mount_point_name }}"
          - local
          - "null::null"
          - --config
          - "datadir={{ nextcloud_aio_mount_dir }}"
      when: nextcloud_aio_downloads_mount | length == 0

    - name: Re-list external storage mounts to find the mount id
      community.docker.docker_container_exec:
        container: "{{ nextcloud_aio_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - files_external:list
          - --output=json
      register: nextcloud_aio_external_storage_list_final
      changed_when: false
      when: nextcloud_aio_mount_applicable_user | length > 0

    - name: Record the downloads mount id
      ansible.builtin.set_fact:
        nextcloud_aio_downloads_mount_id: >-
          {{
            (nextcloud_aio_external_storage_list_final.stdout | from_json)
            | selectattr(
                'mount_point', 'search', nextcloud_aio_mount_point_name ~ '$'
              )
            | map(attribute='mount_id')
            | first
          }}
      when: nextcloud_aio_mount_applicable_user | length > 0

    # Always reported changed -- docker_container_exec has no
    # idempotency check at all (it's a raw command-exec wrapper), and
    # occ files_external:applicable --add-user gives no idempotent way
    # to ask "is this user already applicable" short of parsing its own
    # human-readable output. Same accepted tradeoff as the e1000e
    # ethtool tasks in the base role.
    - name: Make the downloads mount visible to the configured account
      community.docker.docker_container_exec:
        container: "{{ nextcloud_aio_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - files_external:applicable
          - "{{ nextcloud_aio_downloads_mount_id }}"
          - --add-user
          - "{{ nextcloud_aio_mount_applicable_user }}"
      when: nextcloud_aio_mount_applicable_user | length > 0

    # Nextcloud caches per-file permissions (including whether the delete
    # button shows up at all) in its own database from the last scan of
    # this mount -- it does not re-check the real filesystem live on every
    # page load. Files here are written and deleted by Deluge entirely
    # outside Nextcloud's awareness, and host-side permission changes to
    # this directory (like the deluge role's own ACL grant) don't trigger
    # a rescan on their own either. Confirmed live: after fixing the host
    # ACL so www-data could actually delete, Nextcloud's UI still showed
    # no delete option -- even from a fresh, uncached browser profile --
    # until this mount was explicitly rescanned. Run every apply, not just
    # once: it's cheap, and it's the only thing keeping this mount's cache
    # from drifting from what Deluge does to the files underneath it.
    - name: Rescan the downloads mount so Nextcloud's permission cache is current
      community.docker.docker_container_exec:
        container: "{{ nextcloud_aio_nextcloud_container }}"
        user: www-data
        argv:
          - php
          - occ
          - files:scan
          - --path=/{{ nextcloud_aio_mount_applicable_user }}/files/{{ nextcloud_aio_mount_point_name }}
      when: nextcloud_aio_mount_applicable_user | length > 0
      changed_when: false

# Automates the manual `docker network connect nextcloud-aio
# nextcloud-aio-apache` recovery step confirmed necessary on two
# independent reboots (2026-09-01, 2026-09-04) -- see the script's own
# header comment and PARKED.md's "Homeserver: make a reboot a complete
# non-event" for the full story. Doesn't fix the underlying startup
# race (still unknown, owned by AIO's own mastercontainer), just stops
# it from needing a human every time it happens.
- name: Create Nextcloud AIO Apache network-reconnect install directory
  ansible.builtin.file:
    path: "{{ nextcloud_aio_apache_network_fix_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Nextcloud AIO Apache network-reconnect script
  ansible.builtin.copy:
    src: reconnect_apache_network.sh
    dest: "{{ nextcloud_aio_apache_network_fix_install_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install Nextcloud AIO Apache network-reconnect systemd unit
  ansible.builtin.template:
    src: nextcloud-aio-apache-network-fix.service.j2
    dest: /etc/systemd/system/nextcloud-aio-apache-network-fix.service
    owner: root
    group: root
    mode: "0644"
  register: nextcloud_aio_apache_network_fix_unit

- name: Reload systemd for the Apache network-reconnect unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: nextcloud_aio_apache_network_fix_unit.changed

# Enabled so it runs on every future boot; state: restarted (not
# started) so it also actually re-executes on every apply, not just
# the first one -- a plain "started" is a no-op against a oneshot
# systemd already considers "active (exited)" from a prior run, which
# would silently stop this from ever self-healing again after its
# first success. The script itself is cheap and idempotent (exits
# immediately if Apache's already connected), so re-running it on
# every apply costs nothing and self-heals a currently-dropped Apache
# the same way a boot would, without waiting for the next reboot.
- name: Run the Apache network-reconnect check
  ansible.builtin.systemd_service:
    name: nextcloud-aio-apache-network-fix.service
    enabled: true
    state: restarted

- name: Register Authelia as an OIDC login option
  ansible.builtin.include_tasks: oidc.yml
  when: nextcloud_aio_oidc_enabled | bool
