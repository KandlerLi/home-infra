---
# Deliberately not digest-pinned, unlike every other image in this repo.
# Nextcloud's own AIO docs recommend :latest for the mastercontainer: it
# orchestrates the sub-containers it manages (Nextcloud app, database,
# etc.), which self-update through AIO's own internal mechanism, not
# through Ansible -- pinning this to an old digest risks exactly the
# compatibility mismatch digest-pinning elsewhere is meant to prevent.
nextcloud_aio_image: ghcr.io/nextcloud-releases/all-in-one:latest
nextcloud_aio_container_name: nextcloud-aio-mastercontainer

nextcloud_aio_config_volume: nextcloud_aio_mastercontainer

nextcloud_aio_data_dir: /mnt/black-hdd/nextcloud

# Bind-mounts this host directory into the Nextcloud app container at the
# same path via AIO's NEXTCLOUD_MOUNT, making it eligible for Nextcloud's
# "Local" external storage backend. Empty disables the mount entirely.
# Not covered by AIO's built-in backup -- see docs/storage.md.
nextcloud_aio_mount_dir: ""
nextcloud_aio_mount_point_name: Downloads
# Nextcloud username (your own personal account, not a service account) the
# mount is made visible to. Deliberately has no default other than empty --
# a wrong guess here would grant an unintended account visibility into the
# host downloads folder. The mount is created either way once
# nextcloud_aio_mount_dir is set; only the "make it visible" step is skipped
# until this is set.
nextcloud_aio_mount_applicable_user: ""
nextcloud_aio_nextcloud_container: >-
  {{ nextcloud_tools_nextcloud_container | default('nextcloud-aio-nextcloud') }}

nextcloud_aio_restart_policy: always

nextcloud_aio_ports:
  - "80:80"
  - "8080:8080"
  - "8443:8443"

nextcloud_aio_reverse_proxy_enabled: false
nextcloud_aio_reverse_proxy_rollback: false
nextcloud_aio_reverse_proxy_ports:
  - "8080:8080"
  - "8443:8443"
nextcloud_aio_apache_port: 11000
nextcloud_aio_apache_ip_binding: 127.0.0.1
nextcloud_aio_skip_domain_validation: false
nextcloud_aio_ingress_cutover_confirmation: ""

# See files/reconnect_apache_network.sh's own header comment and
# PARKED.md's "Homeserver: make a reboot a complete non-event" for why
# this exists -- automates a manual recovery step confirmed necessary
# on two independent reboots (2026-09-01, 2026-09-04). Same
# directory-plus-filename split as monitoring_ntfy_relay_install_dir --
# the directory needs its own explicit create task before the script
# can be copied into it.
nextcloud_aio_apache_network_fix_install_dir: /usr/local/lib/nextcloud-aio
nextcloud_aio_apache_network_fix_install_path: >-
  {{ nextcloud_aio_apache_network_fix_install_dir }}/reconnect_apache_network.sh

# Off by default, matching this role's own nextcloud_aio_mount_dir
# convention for opt-in sub-features -- see tasks/oidc.yml. Client
# secret comes from the authelia_oidc_nextcloud_client_secret SOPS
# secret directly (the community.sops.sops vars plugin injects it,
# see ansible.cfg), not a variable here -- matching every other real
# credential in this repo, never given a default.
nextcloud_aio_oidc_enabled: false
nextcloud_aio_oidc_provider_name: Authelia
nextcloud_aio_oidc_client_id: nextcloud
nextcloud_aio_oidc_discovery_uri: https://auth.jkandler.de/.well-known/openid-configuration
