---
# Not digest-pinned: AIO recommends :latest for the mastercontainer. See the README.
nextcloud_aio_image: ghcr.io/nextcloud-releases/all-in-one:latest
nextcloud_aio_container_name: nextcloud-aio-mastercontainer

nextcloud_aio_config_volume: nextcloud_aio_mastercontainer

nextcloud_aio_data_dir: /mnt/black-hdd/nextcloud

# Exposed via AIO's NEXTCLOUD_MOUNT for the Local external storage backend; empty disables it.
nextcloud_aio_mount_dir: ""
nextcloud_aio_mount_point_name: Downloads
# No default: a wrong guess would expose the host directory to the wrong account.
nextcloud_aio_mount_applicable_user: ""
nextcloud_aio_nextcloud_container: >-
  {{ nextcloud_tools_nextcloud_container | default('nextcloud-aio-nextcloud') }}

nextcloud_aio_restart_policy: always

nextcloud_aio_ports:
  - "80:80"
  - "8080:8080"
  - "8443:8443"

nextcloud_aio_reverse_proxy_enabled: false
nextcloud_aio_reverse_proxy_rollback: false
nextcloud_aio_reverse_proxy_ports:
  - "8080:8080"
  - "8443:8443"
nextcloud_aio_apache_port: 11000
nextcloud_aio_apache_ip_binding: 127.0.0.1
nextcloud_aio_skip_domain_validation: false
nextcloud_aio_ingress_cutover_confirmation: ""

# See files/reconnect_apache_network.sh.
nextcloud_aio_apache_network_fix_install_dir: /usr/local/lib/nextcloud-aio
nextcloud_aio_apache_network_fix_install_path: >-
  {{ nextcloud_aio_apache_network_fix_install_dir }}/reconnect_apache_network.sh

# Opt-in, see tasks/oidc.yml; the client secret comes from Secrets Manager.
nextcloud_aio_oidc_enabled: false
nextcloud_aio_oidc_provider_name: Authelia
nextcloud_aio_oidc_client_id: nextcloud
nextcloud_aio_oidc_discovery_uri: https://auth.jkandler.de/.well-known/openid-configuration
