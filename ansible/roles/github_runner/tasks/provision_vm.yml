---
- name: Validate GitHub runner storage configuration
  ansible.builtin.assert:
    that:
      - github_runner_vm_disk_path == "/mnt/black-hdd/github-runner/github-runner.qcow2"
      - github_runner_vm_storage_dir == (github_runner_vm_disk_path | dirname)
      - github_runner_storage_mount == "/mnt/black-hdd"
    fail_msg: >-
      The GitHub runner disk must remain at
      /mnt/black-hdd/github-runner/github-runner.qcow2.

- name: Verify runner storage is a mounted filesystem
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ github_runner_storage_mount }}"
      - --noheadings
  register: github_runner_storage_mount_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Validate runner storage mount
  ansible.builtin.assert:
    that:
      - github_runner_storage_mount_result.rc == 0
    fail_msg: >-
      {{ github_runner_storage_mount }} is not mounted. Refusing to
      create the VM disk on the host's root filesystem.

- name: List defined libvirt virtual machines
  community.libvirt.virt:
    command: list_vms
  register: github_runner_defined_vms
  changed_when: false

- name: Check GitHub runner disk
  ansible.builtin.stat:
    path: "{{ github_runner_vm_disk_path }}"
  register: github_runner_vm_disk

- name: Validate VM and disk recovery state
  ansible.builtin.assert:
    that:
      - >-
        (github_runner_vm_disk.stat.exists | bool)
        ==
        (github_runner_vm_name in github_runner_defined_vms.list_vms)
    fail_msg: >-
      The GitHub runner VM and its disk are out of sync. The role will
      not delete or overwrite either one automatically. Restore the
      missing libvirt domain or disk, or archive the orphaned resource
      after confirming it is no longer needed, then rerun Ansible.

- name: Read existing GitHub runner virtual machine definition
  community.libvirt.virt:
    name: "{{ github_runner_vm_name }}"
    command: get_xml
  register: github_runner_existing_vm_xml
  changed_when: false
  when: github_runner_vm_name in github_runner_defined_vms.list_vms

- name: Validate existing GitHub runner virtual machine definition
  ansible.builtin.assert:
    that:
      - github_runner_vm_disk_path in github_runner_existing_vm_xml.get_xml
      - >-
        github_runner_cloud_init_iso_path
        in github_runner_existing_vm_xml.get_xml
      - github_runner_network_name in github_runner_existing_vm_xml.get_xml
      - >-
        (github_runner_vm_mac | lower)
        in (github_runner_existing_vm_xml.get_xml | lower)
    fail_msg: >-
      The existing {{ github_runner_vm_name }} domain does not use the
      configured disk, network, and MAC address. Refusing to modify it
      automatically.
  when: github_runner_vm_name in github_runner_defined_vms.list_vms

- name: Allow libvirt to traverse the HDD mount
  ansible.posix.acl:
    path: "{{ github_runner_storage_mount }}"
    entity: "{{ github_runner_libvirt_user }}"
    etype: user
    permissions: x
    state: present

- name: Create dedicated GitHub runner VM storage directory
  ansible.builtin.file:
    path: "{{ github_runner_vm_storage_dir }}"
    state: directory
    owner: "{{ github_runner_libvirt_user }}"
    group: "{{ github_runner_libvirt_group }}"
    mode: "0750"

- name: Allow libvirt full access to runner VM storage
  ansible.posix.acl:
    path: "{{ github_runner_vm_storage_dir }}"
    entity: "{{ github_runner_libvirt_user }}"
    etype: user
    permissions: rwx
    state: present

- name: Create GitHub runner cloud-init build directory
  ansible.builtin.file:
    path: "{{ github_runner_cloud_init_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: List defined libvirt networks
  community.libvirt.virt_net:
    command: list_nets
  register: github_runner_defined_networks
  changed_when: false

- name: Read existing GitHub runner network definition
  community.libvirt.virt_net:
    name: "{{ github_runner_network_name }}"
    command: get_xml
  register: github_runner_existing_network_xml
  changed_when: false
  when: github_runner_network_name in github_runner_defined_networks.list_nets

- name: Validate existing GitHub runner network definition
  ansible.builtin.assert:
    that:
      - github_runner_network_bridge in github_runner_existing_network_xml.get_xml
      - github_runner_network_address in github_runner_existing_network_xml.get_xml
      - github_runner_network_netmask in github_runner_existing_network_xml.get_xml
      - github_runner_vm_ip in github_runner_existing_network_xml.get_xml
      - >-
        'mode="nat"' in github_runner_existing_network_xml.get_xml
        or "mode='nat'" in github_runner_existing_network_xml.get_xml
      - >-
        (github_runner_vm_mac | lower)
        in (github_runner_existing_network_xml.get_xml | lower)
    fail_msg: >-
      The existing {{ github_runner_network_name }} network does not
      match the configured bridge, subnet, or DHCP reservation. Refusing
      to redefine an existing network automatically.
  when: github_runner_network_name in github_runner_defined_networks.list_nets

- name: Define GitHub runner libvirt network
  community.libvirt.virt_net:
    name: "{{ github_runner_network_name }}"
    state: present
    xml: "{{ lookup('template', 'libvirt-network.xml.j2') }}"

- name: Activate and enable GitHub runner libvirt network
  community.libvirt.virt_net:
    name: "{{ github_runner_network_name }}"
    state: active
    autostart: true

- name: Check Ansible controller SSH public key
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ github_runner_admin_ssh_public_key_path }}"
  register: github_runner_admin_ssh_public_key_file

- name: Validate Ansible controller SSH public key
  ansible.builtin.assert:
    that:
      - github_runner_admin_ssh_public_key_file.stat.exists
      - github_runner_admin_ssh_public_key_file.stat.isreg
    fail_msg: >-
      The controller SSH public key does not exist at
      {{ github_runner_admin_ssh_public_key_path }}.

- name: Read Ansible controller SSH public key
  ansible.builtin.set_fact:
    github_runner_admin_ssh_public_key: >-
      {{
        lookup(
          'ansible.builtin.file',
          github_runner_admin_ssh_public_key_path
        )
      }}

- name: Capture hypervisor SSH connection
  ansible.builtin.set_fact:
    github_runner_hypervisor_ssh_host: >-
      {{ ansible_host | default(inventory_hostname) }}
    github_runner_hypervisor_ssh_user: "{{ ansible_user }}"

- name: Render GitHub runner cloud-init configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ github_runner_cloud_init_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: cloud-init-user-data.yml.j2
      dest: user-data
    - src: cloud-init-meta-data.yml.j2
      dest: meta-data
    - src: cloud-init-network-config.yml.j2
      dest: network-config
  loop_control:
    label: "{{ item.dest }}"
  register: github_runner_cloud_init_files

- name: Check GitHub runner cloud-init seed image
  ansible.builtin.stat:
    path: "{{ github_runner_cloud_init_iso_path }}"
  register: github_runner_cloud_init_iso

- name: Build persistent GitHub runner cloud-init seed image
  ansible.builtin.command:
    argv:
      - xorriso
      - -as
      - mkisofs
      - -quiet
      - -output
      - "{{ github_runner_cloud_init_iso_path }}"
      - -volid
      - cidata
      - -joliet
      - -rock
      - "{{ github_runner_cloud_init_dir }}/user-data"
      - "{{ github_runner_cloud_init_dir }}/meta-data"
      - "{{ github_runner_cloud_init_dir }}/network-config"
  when: >-
    not github_runner_cloud_init_iso.stat.exists
    or github_runner_cloud_init_files.changed

- name: Set GitHub runner cloud-init seed image permissions
  ansible.builtin.file:
    path: "{{ github_runner_cloud_init_iso_path }}"
    state: file
    owner: "{{ github_runner_libvirt_user }}"
    group: "{{ github_runner_libvirt_group }}"
    mode: "0640"
  when: >-
    not ansible_check_mode
    or github_runner_cloud_init_iso.stat.exists

- name: Download verified Debian cloud image
  ansible.builtin.get_url:
    url: "{{ github_runner_debian_image_url }}"
    dest: "{{ github_runner_debian_image_path }}"
    checksum: "{{ github_runner_debian_image_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Create GitHub runner system disk from Debian cloud image
  ansible.builtin.command:
    argv:
      - qemu-img
      - convert
      - -f
      - qcow2
      - -O
      - qcow2
      - "{{ github_runner_debian_image_path }}"
      - "{{ github_runner_vm_disk_path }}"
    creates: "{{ github_runner_vm_disk_path }}"
  register: github_runner_system_disk_create

- name: Resize new GitHub runner system disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - resize
      - "{{ github_runner_vm_disk_path }}"
      - "{{ github_runner_vm_disk_size_gb }}G"
  when: github_runner_system_disk_create.changed

- name: Set GitHub runner system disk permissions
  ansible.builtin.file:
    path: "{{ github_runner_vm_disk_path }}"
    state: file
    owner: "{{ github_runner_libvirt_user }}"
    group: "{{ github_runner_libvirt_group }}"
    mode: "0640"
  when: >-
    not ansible_check_mode
    or github_runner_vm_disk.stat.exists

- name: Define Debian GitHub runner virtual machine
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'github-runner-domain.xml.j2') }}"
  register: github_runner_vm_result
  when: github_runner_vm_name not in github_runner_defined_vms.list_vms

- name: Start and enable GitHub runner virtual machine
  community.libvirt.virt:
    name: "{{ github_runner_vm_name }}"
    state: running
    autostart: true
  when: >-
    not ansible_check_mode
    or github_runner_vm_name in github_runner_defined_vms.list_vms

- name: Remove obsolete runner SSH host key after VM creation
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ github_runner_ssh_host_key_alias }}"
  changed_when: true
  failed_when: false
  when:
    - github_runner_vm_result.changed
    - not ansible_check_mode

- name: Wait for GitHub runner SSH service from the hypervisor
  ansible.builtin.wait_for:
    host: "{{ github_runner_vm_ip }}"
    port: 22
    connect_timeout: 5
    sleep: 3
    timeout: 600
  when: not ansible_check_mode

- name: Add GitHub runner VM to dynamic inventory
  ansible.builtin.add_host:
    name: "{{ github_runner_vm_name }}"
    groups:
      - github_runner_vms
    ansible_host: "{{ github_runner_vm_ip }}"
    ansible_user: "{{ github_runner_admin_user }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: >-
      -o ProxyJump={{ github_runner_hypervisor_ssh_user }}@{{ github_runner_hypervisor_ssh_host }}
      -o HostKeyAlias={{ github_runner_ssh_host_key_alias }}
      -o StrictHostKeyChecking=accept-new
  changed_when: false
  when: >-
    not ansible_check_mode
    or github_runner_vm_name in github_runner_defined_vms.list_vms
