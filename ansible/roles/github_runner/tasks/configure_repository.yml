---
- name: Set runner identity for {{ github_runner_repository_config.repository }}
  ansible.builtin.set_fact:
    github_runner_repository: "{{ github_runner_repository_config.repository }}"
    github_runner_repository_url: >-
      https://github.com/{{ github_runner_github_owner }}/{{ github_runner_repository_config.repository }}
    github_runner_repository_install_dir: >-
      {{ github_runner_install_dir }}/{{ github_runner_repository_config.id }}
    github_runner_repository_runner_name: >-
      {{
        github_runner_repository_config.runner_name
        | default(github_runner_vm_name ~ '-' ~ github_runner_repository_config.id)
      }}
    github_runner_repository_service_user: >-
      {{ github_runner_service_user_prefix }}-{{ github_runner_repository_config.id }}
    github_runner_repository_systemd_unit: >-
      {{ github_runner_systemd_unit_prefix }}-{{ github_runner_repository_config.id }}.service

- name: Check installation directory for {{ github_runner_repository }}
  ansible.builtin.stat:
    path: "{{ github_runner_repository_install_dir }}"
  register: github_runner_installation_directory

- name: Create service user for {{ github_runner_repository }}
  ansible.builtin.user:
    name: "{{ github_runner_repository_service_user }}"
    system: true
    create_home: true
    home: "/var/lib/{{ github_runner_repository_service_user }}"
    shell: /bin/bash
  register: github_runner_service_account

- name: Select check-mode service identity for {{ github_runner_repository }}
  ansible.builtin.set_fact:
    github_runner_repository_file_owner: >-
      {{
        'root'
        if ansible_check_mode and github_runner_service_account.changed
        else github_runner_repository_service_user
      }}

- name: Create installation directory for {{ github_runner_repository }}
  ansible.builtin.file:
    path: "{{ github_runner_repository_install_dir }}"
    state: directory
    owner: root
    group: "{{ github_runner_repository_file_owner }}"
    mode: "0750"

- name: Query registered runners for {{ github_runner_repository }}
  delegate_to: localhost
  become: false
  check_mode: false
  ansible.builtin.uri:
    url: >-
      https://api.github.com/repos/{{ github_runner_github_owner }}/{{ github_runner_repository }}/actions/runners?name={{ github_runner_repository_runner_name | urlencode }}
    method: GET
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ github_runner_github_token }}"
      X-GitHub-Api-Version: "{{ github_runner_github_api_version }}"
    return_content: true
    status_code: 200
  register: github_runner_registrations
  no_log: true

- name: Select remote registration for {{ github_runner_repository }}
  ansible.builtin.set_fact:
    github_runner_remote_registrations: >-
      {{
        github_runner_registrations.json.runners
        | selectattr(
            'name',
            'equalto',
            github_runner_repository_runner_name
          )
        | list
      }}

- name: Check local registration for {{ github_runner_repository }}
  ansible.builtin.stat:
    path: "{{ github_runner_repository_install_dir }}/.runner"
  register: github_runner_configuration

- name: Read local registration for {{ github_runner_repository }}
  ansible.builtin.slurp:
    src: "{{ github_runner_repository_install_dir }}/.runner"
  register: github_runner_local_registration_file
  when: github_runner_configuration.stat.exists

- name: Parse local registration for {{ github_runner_repository }}
  ansible.builtin.set_fact:
    github_runner_local_registration: >-
      {{
        github_runner_local_registration_file.content
        | b64decode
        | regex_replace('^\ufeff', '')
        | from_json
      }}
  when: github_runner_configuration.stat.exists

- name: Validate existing registration for {{ github_runner_repository }}
  ansible.builtin.assert:
    that:
      - github_runner_remote_registrations | length == 1
      - >-
        github_runner_local_registration.agentName
        == github_runner_repository_runner_name
      - >-
        github_runner_local_registration.gitHubUrl
        | regex_replace('/$', '')
        == github_runner_repository_url
      - >-
        github_runner_local_registration.agentId | int
        == github_runner_remote_registrations[0].id | int
    fail_msg: >-
      Local and GitHub registration state for
      {{ github_runner_github_owner }}/{{ github_runner_repository }} does
      not match. Refusing to replace or delete credentials automatically.
      Inspect the local .runner file and the repository's Actions runner
      settings, then explicitly retire the stale registration.
  when: github_runner_configuration.stat.exists

- name: Refuse remote runner replacement for {{ github_runner_repository }}
  ansible.builtin.assert:
    that:
      - github_runner_remote_registrations | length == 0
    fail_msg: >-
      GitHub already has a runner named
      {{ github_runner_repository_runner_name }} for
      {{ github_runner_github_owner }}/{{ github_runner_repository }}, but
      this VM has no matching local registration. Refusing to replace a
      potentially different machine automatically.
  when: not github_runner_configuration.stat.exists

- name: Check installed package for {{ github_runner_repository }}
  ansible.builtin.stat:
    path: "{{ github_runner_repository_install_dir }}/bin/Runner.Listener"
  register: github_runner_listener

- name: Check package marker for {{ github_runner_repository }}
  ansible.builtin.stat:
    path: "{{ github_runner_repository_install_dir }}/.ansible-package"
  register: github_runner_package_marker

- name: Read package marker for {{ github_runner_repository }}
  ansible.builtin.slurp:
    src: "{{ github_runner_repository_install_dir }}/.ansible-package"
  register: github_runner_package_marker_content
  when: github_runner_package_marker.stat.exists

- name: Determine update requirement for {{ github_runner_repository }}
  ansible.builtin.set_fact:
    github_runner_update_required: >-
      {{
        not github_runner_listener.stat.exists
        or not github_runner_package_marker.stat.exists
        or (
          github_runner_package_marker_content.content
          | default('')
          | b64decode
          | trim
        ) != github_runner_download.filename
      }}

- name: Check systemd unit for {{ github_runner_repository }}
  ansible.builtin.stat:
    path: >-
      /etc/systemd/system/{{ github_runner_repository_systemd_unit }}
  register: github_runner_systemd_unit_file

- name: Check systemd unit drift for {{ github_runner_repository }}
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: >-
      /etc/systemd/system/{{ github_runner_repository_systemd_unit }}
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  diff: false
  register: github_runner_systemd_unit_preview

- name: Refuse to interrupt a busy runner for {{ github_runner_repository }}
  ansible.builtin.assert:
    that:
      - >-
        ansible_check_mode
        or not (
          github_runner_update_required
          or github_runner_systemd_unit_preview.changed
        )
        or github_runner_remote_registrations | length == 0
        or not github_runner_remote_registrations[0].busy
    fail_msg: >-
      The runner for {{ github_runner_github_owner }}/{{ github_runner_repository }}
      is busy. Wait for its job to finish before updating its application or
      systemd service.

- name: Stop runner before changing {{ github_runner_repository }}
  ansible.builtin.systemd_service:
    name: "{{ github_runner_repository_systemd_unit }}"
    state: stopped
  when:
    - >-
      github_runner_update_required
      or github_runner_systemd_unit_preview.changed
    - github_runner_systemd_unit_file.stat.exists

- name: Extract runner application for {{ github_runner_repository }}
  ansible.builtin.unarchive:
    src: "/var/tmp/{{ github_runner_download.filename }}"
    dest: "{{ github_runner_repository_install_dir }}"
    remote_src: true
    owner: root
    group: root
  when:
    - github_runner_update_required
    - not ansible_check_mode

- name: Install runner dependencies for {{ github_runner_repository }}
  ansible.builtin.command:
    argv:
      - "{{ github_runner_repository_install_dir }}/bin/installdependencies.sh"
  changed_when: true
  when:
    - github_runner_update_required
    - not ansible_check_mode

- name: Record package version for {{ github_runner_repository }}
  ansible.builtin.copy:
    content: "{{ github_runner_download.filename }}\n"
    dest: "{{ github_runner_repository_install_dir }}/.ansible-package"
    owner: root
    group: root
    mode: "0644"
  when:
    - github_runner_update_required
    - not ansible_check_mode

- name: Report pending package change for {{ github_runner_repository }}
  ansible.builtin.debug:
    msg: >-
      GitHub runner application {{ github_runner_download.filename }} would
      be installed for {{ github_runner_github_owner }}/{{ github_runner_repository }}.
  changed_when: true
  when:
    - github_runner_update_required
    - ansible_check_mode

- name: Register runner for {{ github_runner_repository }}
  when:
    - not github_runner_configuration.stat.exists
    - not ansible_check_mode
  block:
    - name: Allow initial registration for {{ github_runner_repository }}
      ansible.builtin.file:
        path: "{{ github_runner_repository_install_dir }}"
        state: directory
        owner: root
        group: "{{ github_runner_repository_service_user }}"
        mode: "0770"

    - name: Request registration token for {{ github_runner_repository }}
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ github_runner_github_owner }}/{{ github_runner_repository }}/actions/runners/registration-token
        method: POST
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ github_runner_github_token }}"
          X-GitHub-Api-Version: "{{ github_runner_github_api_version }}"
        return_content: true
        status_code: 201
      register: github_runner_registration
      no_log: true

    - name: Configure runner for {{ github_runner_repository }}
      become_user: "{{ github_runner_repository_service_user }}"
      ansible.builtin.command:
        argv:
          - ./config.sh
          - --unattended
          - --url
          - "{{ github_runner_repository_url }}"
          - --token
          - "{{ github_runner_registration.json.token }}"
          - --name
          - "{{ github_runner_repository_runner_name }}"
          - --labels
          - "{{ github_runner_labels | join(',') }}"
          - --work
          - "{{ github_runner_work_dir }}"
          - --disableupdate
        chdir: "{{ github_runner_repository_install_dir }}"
      no_log: true
  always:
    - name: Lock installation directory for {{ github_runner_repository }}
      ansible.builtin.file:
        path: "{{ github_runner_repository_install_dir }}"
        state: directory
        owner: root
        group: "{{ github_runner_repository_service_user }}"
        mode: "0750"

- name: Report pending registration for {{ github_runner_repository }}
  ansible.builtin.debug:
    msg: >-
      GitHub Actions runner {{ github_runner_repository_runner_name }} would
      be registered for
      {{ github_runner_github_owner }}/{{ github_runner_repository }}.
  changed_when: true
  when:
    - not github_runner_configuration.stat.exists
    - ansible_check_mode

- name: Create work directory for {{ github_runner_repository }}
  ansible.builtin.file:
    path: >-
      {{ github_runner_repository_install_dir }}/{{ github_runner_work_dir }}
    state: directory
    owner: "{{ github_runner_repository_file_owner }}"
    group: "{{ github_runner_repository_file_owner }}"
    mode: "0750"
  when: >-
    not ansible_check_mode
    or github_runner_installation_directory.stat.exists

- name: Create diagnostics directory for {{ github_runner_repository }}
  ansible.builtin.file:
    path: "{{ github_runner_repository_install_dir }}/_diag"
    state: directory
    owner: "{{ github_runner_repository_file_owner }}"
    group: "{{ github_runner_repository_file_owner }}"
    mode: "0750"
  when: >-
    not ansible_check_mode
    or github_runner_installation_directory.stat.exists

- name: Install systemd unit for {{ github_runner_repository }}
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: >-
      /etc/systemd/system/{{ github_runner_repository_systemd_unit }}
    owner: root
    group: root
    mode: "0644"
  register: github_runner_systemd_unit

- name: Enable runner service for {{ github_runner_repository }}
  ansible.builtin.systemd_service:
    name: "{{ github_runner_repository_systemd_unit }}"
    daemon_reload: "{{ github_runner_systemd_unit.changed }}"
    enabled: true
    state: started
  when: >-
    not ansible_check_mode
    or github_runner_systemd_unit_file.stat.exists
