- name: Ensure GitHub Runner VM storage directory exists
  ansible.builtin.file:
    path: "{{ github_runner_vm_storage_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure GitHub Runner VM disk exists
  ansible.builtin.command:
    cmd: >-
      qemu-img create
      -f qcow2
      "{{ github_runner_vm_disk_path }}"
      "{{ github_runner_vm_disk_size_gb }}G"
    creates: "{{ github_runner_vm_disk_path }}"

- name: Ensure libvirt default network is enabled and running
  community.libvirt.virt_net:
    name: "{{ github_runner_vm_network }}"
    state: active
    autostart: true

- name: Define GitHub Runner virtual machine
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'github-runner.xml.j2') }}"
    autostart: false

- name: Download Debian installation ISO
  ansible.builtin.get_url:
    url: "{{ github_runner_vm_iso_url }}"
    dest: "{{ github_runner_vm_iso_path }}"
    mode: "0644"