---
- name: Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - cloud-init
      - status
      - --wait
  changed_when: false

- name: Install GitHub runner operating system packages
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - curl
      - git
      - gzip
      - tar
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Create GitHub runner installation root
  ansible.builtin.file:
    path: "{{ github_runner_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate GitHub configuration
  ansible.builtin.assert:
    that:
      - github_runner_github_owner != "CHANGE_ME"
      - github_runner_github_owner | length > 0
      - github_runner_github_repository is not defined
      - github_runner_github_repositories is sequence
      - github_runner_github_repositories is not string
      - github_runner_github_repositories | length > 0
      - >-
        github_runner_github_token
        | default('')
        | length >= 50
      - >-
        github_runner_github_token
        | default('')
        is match('^github_pat_[A-Za-z0-9_]+$')
    fail_msg: >-
      GitHub owner, a non-empty repository configuration list, and a valid
      fine-grained personal access token must be configured before runners
      can be registered. The token must have access to every configured
      repository with Administration: write.

- name: Validate each GitHub runner repository
  ansible.builtin.include_tasks: validate_repository.yml
  loop: "{{ github_runner_github_repositories }}"
  loop_control:
    loop_var: github_runner_repository_config
    label: >-
      {{
        github_runner_repository_config.id
        | default('invalid repository entry')
      }}

- name: Validate unique GitHub runner repository identifiers
  ansible.builtin.assert:
    that:
      - >-
        github_runner_github_repositories
        | map(attribute='id')
        | unique
        | list
        | length == github_runner_github_repositories | length
      - >-
        github_runner_github_repositories
        | map(attribute='repository')
        | map('lower')
        | unique
        | list
        | length == github_runner_github_repositories | length
    fail_msg: Repository identifiers and repository names must be unique.

- name: Query available GitHub runner applications
  delegate_to: localhost
  become: false
  check_mode: false
  ansible.builtin.uri:
    url: >-
      https://api.github.com/repos/{{ github_runner_github_owner }}/{{ (github_runner_github_repositories | first).repository }}/actions/runners/downloads
    method: GET
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ github_runner_github_token }}"
      X-GitHub-Api-Version: "{{ github_runner_github_api_version }}"
    return_content: true
    status_code: 200
  register: github_runner_downloads
  no_log: true

- name: Select Linux x64 GitHub runner application
  ansible.builtin.set_fact:
    github_runner_download: >-
      {{
        github_runner_downloads.json
        | selectattr('os', 'equalto', 'linux')
        | selectattr('architecture', 'equalto', 'x64')
        | first
      }}

- name: Validate GitHub runner download
  ansible.builtin.assert:
    that:
      - github_runner_download is defined
      - github_runner_download.download_url is defined
      - github_runner_download.filename is defined
      - github_runner_download.sha256_checksum is defined
      - >-
        github_runner_download.sha256_checksum
        is match('^[a-fA-F0-9]{64}$')
    fail_msg: GitHub did not return a Linux x64 runner application.

- name: Download GitHub runner application
  ansible.builtin.get_url:
    url: "{{ github_runner_download.download_url }}"
    dest: "/var/tmp/{{ github_runner_download.filename }}"
    checksum: "sha256:{{ github_runner_download.sha256_checksum }}"
    mode: "0644"

- name: Configure GitHub runner service for each repository
  ansible.builtin.include_tasks: configure_repository.yml
  loop: "{{ github_runner_github_repositories }}"
  loop_control:
    loop_var: github_runner_repository_config
    label: >-
      {{
        github_runner_github_owner
        ~ '/'
        ~ github_runner_repository_config.repository
      }}
