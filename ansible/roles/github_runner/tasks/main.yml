---
- name: Validate GitHub runner role mode
  ansible.builtin.assert:
    that:
      - github_runner_role_mode in ["provision_vm", "configure_guest"]
    fail_msg: >-
      github_runner_role_mode must be either provision_vm
      or configure_guest.

- name: Run selected GitHub runner tasks
  ansible.builtin.include_tasks: "{{ github_runner_role_mode }}.yml"
