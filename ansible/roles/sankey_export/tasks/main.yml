---
- name: Configure the Finanzfluss Sankey exporter
  when: sankey_export_enabled | bool
  block:
    - name: Check existing Nextcloud app password file
      ansible.builtin.stat:
        path: "{{ sankey_export_app_password_path }}"
      register: sankey_export_app_password_file

    - name: Validate Sankey export configuration
      ansible.builtin.assert:
        that:
          - sankey_export_endpoint_host == "127.0.0.1"
          - sankey_export_endpoint_port | int == 11000
          - sankey_export_http_host == "nextcloud.jkandler.de"
          - sankey_export_username is match('^[A-Za-z0-9_.@-]{1,64}$')
          - >-
            sankey_export_app_password_file.stat.exists
            or (
              sankey_export_app_password | trim | length >= 16
              and sankey_export_app_password | trim != "CHANGE_ME"
            )
          - sankey_export_remote_dir | length >= 1
          - not sankey_export_remote_dir.startswith('/')
          - "'..' not in sankey_export_remote_dir.split('/')"
          - sankey_export_workbook_name | length >= 1
        fail_msg: >-
          Bootstrap the dedicated Nextcloud account and app password (via
          sankey-export.yml), keep the WebDAV upstream on the fixed
          loopback AIO endpoint, and select one relative remote folder.
      no_log: true

    - name: Create Sankey export client group
      ansible.builtin.group:
        name: "{{ sankey_export_service_group }}"
        system: true
        state: present

    - name: Create Sankey export service account
      ansible.builtin.user:
        name: "{{ sankey_export_service_user }}"
        group: "{{ sankey_export_service_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create Sankey export directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ sankey_export_install_dir }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ sankey_export_config_dir }}"
          owner: root
          group: "{{ sankey_export_service_group }}"
          mode: "0750"
        - path: "{{ sankey_export_state_dir }}"
          owner: "{{ sankey_export_service_user }}"
          group: "{{ sankey_export_service_group }}"
          mode: "0750"
      loop_control:
        label: "{{ item.path }}"

    - name: Install Sankey export app password file
      ansible.builtin.copy:
        content: "{{ sankey_export_app_password | trim }}\n"
        dest: "{{ sankey_export_app_password_path }}"
        owner: "{{ sankey_export_service_user }}"
        group: root
        mode: "0400"
      no_log: true
      when: sankey_export_app_password | trim | length >= 16

    - name: Enforce Sankey export app password file permissions
      ansible.builtin.file:
        path: "{{ sankey_export_app_password_path }}"
        state: file
        owner: "{{ sankey_export_service_user }}"
        group: root
        mode: "0400"

    - name: Install the Sankey export script
      ansible.builtin.copy:
        src: finanzfluss_export.py
        dest: "{{ sankey_export_install_dir }}/finanzfluss_export.py"
        owner: root
        group: root
        mode: "0755"
      register: sankey_export_script

    - name: Install the pinned requirements file
      ansible.builtin.copy:
        src: requirements.txt
        dest: "{{ sankey_export_install_dir }}/requirements.txt"
        owner: root
        group: root
        mode: "0644"
      register: sankey_export_requirements

    - name: Create the Sankey export virtual environment
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ sankey_export_install_dir }}/.venv"
        creates: "{{ sankey_export_install_dir }}/.venv/bin/python"

    - name: Install pinned Python dependencies
      ansible.builtin.pip:
        requirements: "{{ sankey_export_install_dir }}/requirements.txt"
        virtualenv: "{{ sankey_export_install_dir }}/.venv"
      register: sankey_export_pip

    - name: Install system dependencies for headless Chromium
      ansible.builtin.command:
        argv:
          - "{{ sankey_export_install_dir }}/.venv/bin/python"
          - -m
          - playwright
          - install-deps
          - chromium
      changed_when: false

    - name: Install Chromium for Playwright
      ansible.builtin.command:
        argv:
          - "{{ sankey_export_install_dir }}/.venv/bin/python"
          - -m
          - playwright
          - install
          - chromium
      become_user: "{{ sankey_export_service_user }}"
      environment:
        PLAYWRIGHT_BROWSERS_PATH: "{{ sankey_export_state_dir }}/playwright"
      changed_when: false

    - name: Install Sankey export systemd service unit
      ansible.builtin.template:
        src: sankey-export.service.j2
        dest: /etc/systemd/system/sankey-export.service
        owner: root
        group: root
        mode: "0644"
      register: sankey_export_service_unit

    - name: Install Sankey export systemd timer unit
      ansible.builtin.template:
        src: sankey-export.timer.j2
        dest: /etc/systemd/system/sankey-export.timer
        owner: root
        group: root
        mode: "0644"
      register: sankey_export_timer_unit

    - name: Reload systemd for the Sankey export units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        sankey_export_service_unit.changed
        or sankey_export_timer_unit.changed

    - name: Ensure the Sankey export timer is enabled and running
      ansible.builtin.systemd_service:
        name: sankey-export.timer
        enabled: true
        state: started
