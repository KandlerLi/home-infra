---
# Stands up the bare VM only; k3s comes in configure_guest.

- name: Validate k3s node storage configuration
  ansible.builtin.assert:
    that:
      - >-
        k3s_node_vm_disk_path
        == (k3s_node_vm_storage_dir ~ '/' ~ k3s_node_vm_name ~ '.qcow2')
      - k3s_node_vm_storage_dir == (k3s_node_vm_disk_path | dirname)
      - k3s_node_storage_mount == "/mnt/black-hdd"
    fail_msg: >-
      The k3s node disk must remain at
      {{ k3s_node_vm_storage_dir }}/{{ k3s_node_vm_name }}.qcow2.

- name: Verify k3s node storage is a mounted filesystem
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ k3s_node_storage_mount }}"
      - --noheadings
  register: k3s_node_storage_mount_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Validate k3s node storage mount
  ansible.builtin.assert:
    that:
      - k3s_node_storage_mount_result.rc == 0
    fail_msg: >-
      {{ k3s_node_storage_mount }} is not mounted. Refusing to create the
      VM disk on the host's root filesystem.

- name: List defined libvirt virtual machines
  community.libvirt.virt:
    command: list_vms
  register: k3s_node_defined_vms
  changed_when: false

- name: Check k3s node disk
  ansible.builtin.stat:
    path: "{{ k3s_node_vm_disk_path }}"
    # Only .exists is read; skip hashing the multi-GB disk.
    get_checksum: false
  register: k3s_node_vm_disk

- name: Validate VM and disk recovery state
  ansible.builtin.assert:
    that:
      - >-
        (k3s_node_vm_disk.stat.exists | bool)
        ==
        (k3s_node_vm_name in k3s_node_defined_vms.list_vms)
    fail_msg: >-
      The k3s node VM and its disk are out of sync. The role will not
      delete or overwrite either one automatically. Restore the missing
      libvirt domain or disk, or archive the orphaned resource after
      confirming it is no longer needed, then rerun Ansible.

- name: Read existing k3s node virtual machine definition
  community.libvirt.virt:
    name: "{{ k3s_node_vm_name }}"
    command: get_xml
  register: k3s_node_existing_vm_xml
  changed_when: false
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Validate existing k3s node virtual machine definition
  ansible.builtin.assert:
    that:
      - k3s_node_vm_disk_path in k3s_node_existing_vm_xml.get_xml
      - k3s_node_cloud_init_iso_path in k3s_node_existing_vm_xml.get_xml
      - k3s_node_network_name in k3s_node_existing_vm_xml.get_xml
      - >-
        (k3s_node_vm_mac | lower)
        in (k3s_node_existing_vm_xml.get_xml | lower)
    fail_msg: >-
      The existing {{ k3s_node_vm_name }} domain does not use the
      configured disk, network, and MAC address. Refusing to modify it
      automatically.
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

# Static vCPUs have no hotplug: see history.md ("k3s learning cluster").
- name: Extract the current vCPU count from the existing domain definition
  ansible.builtin.set_fact:
    k3s_node_existing_vm_vcpus: >-
      {{ (k3s_node_existing_vm_xml.get_xml
      | regex_search('<vcpu[^>]*>[0-9]+</vcpu>'))
      | regex_replace('^<vcpu[^>]*>', '')
      | regex_replace('</vcpu>$', '') }}
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

# libvirt reports KiB; a misparse would restart the nodes on every run, so assert it.
- name: Verify the existing domain reports its memory in KiB
  ansible.builtin.assert:
    that:
      - "\"<memory unit='KiB'>\" in k3s_node_existing_vm_xml.get_xml"
    fail_msg: >-
      {{ k3s_node_vm_name }}'s domain XML does not report <memory
      unit='KiB'>, so the memory comparison below cannot be trusted.
      Refusing to shut the VM down on a value that might be misread.
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Extract the current memory allocation from the existing domain definition
  ansible.builtin.set_fact:
    k3s_node_existing_vm_memory_mb: >-
      {{ ((k3s_node_existing_vm_xml.get_xml
      | regex_search('<memory unit=.KiB.>[0-9]+</memory>'))
      | regex_replace('^<memory[^>]*>', '')
      | regex_replace('</memory>$', '') | int) // 1024 }}
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

# No online disk resize either; -U because the VM holds the image open.
- name: Read the existing k3s node disk's virtual size
  ansible.builtin.command:
    argv:
      - qemu-img
      - info
      - -U
      - --output=json
      - "{{ k3s_node_vm_disk_path }}"
  register: k3s_node_existing_vm_disk_info
  changed_when: false
  check_mode: false
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Extract the current disk size from qemu-img
  ansible.builtin.set_fact:
    k3s_node_existing_vm_disk_gb: >-
      {{ (k3s_node_existing_vm_disk_info.stdout | from_json)['virtual-size']
      // (1024 * 1024 * 1024) }}
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

# A shrink would truncate the guest filesystem, so it is refused.
- name: Refuse to shrink the existing k3s node disk
  ansible.builtin.assert:
    that:
      - k3s_node_existing_vm_disk_gb | int <= k3s_node_vm_disk_size_gb | int
    fail_msg: >-
      {{ k3s_node_vm_name }}'s disk is {{ k3s_node_existing_vm_disk_gb }} GiB
      but k3s_node_vm_disk_size_gb is {{ k3s_node_vm_disk_size_gb }}. The role
      only ever grows a disk; shrinking would destroy guest data.
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Work out whether the existing k3s node disk needs to grow
  ansible.builtin.set_fact:
    k3s_node_vm_disk_grow_pending: >-
      {{ k3s_node_existing_vm_disk_gb | int < k3s_node_vm_disk_size_gb | int }}
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Work out whether the existing k3s node VM needs a resize
  ansible.builtin.set_fact:
    k3s_node_vm_resize_pending: >-
      {{ k3s_node_existing_vm_vcpus | int != k3s_node_vm_vcpus | int
      or k3s_node_existing_vm_memory_mb | int != k3s_node_vm_memory_mb | int
      or k3s_node_vm_disk_grow_pending | bool }}
  when: k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Gracefully shut down the k3s node VM to apply a changed vCPU, memory or disk allocation
  community.libvirt.virt:
    name: "{{ k3s_node_vm_name }}"
    state: shutdown
  when: >-
    k3s_node_vm_name in k3s_node_defined_vms.list_vms
    and k3s_node_vm_resize_pending | bool

# Skipped under --check: a simulated shutdown never completes.
- name: Wait for the k3s node VM to actually stop
  community.libvirt.virt:
    command: status
    name: "{{ k3s_node_vm_name }}"
  register: k3s_node_vm_shutdown_status
  until: k3s_node_vm_shutdown_status.status == "shutdown"
  retries: 90
  delay: 10
  when: >-
    not ansible_check_mode
    and k3s_node_vm_name in k3s_node_defined_vms.list_vms
    and k3s_node_vm_resize_pending | bool

# Only once the domain is really stopped; the guest grows into it on boot.
- name: Grow the k3s node system disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - resize
      - "{{ k3s_node_vm_disk_path }}"
      - "{{ k3s_node_vm_disk_size_gb }}G"
  when: >-
    not ansible_check_mode
    and k3s_node_vm_name in k3s_node_defined_vms.list_vms
    and k3s_node_vm_disk_grow_pending | bool

- name: Redefine the k3s node VM with its updated vCPU, memory and disk allocation
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'k3s-node-domain.xml.j2') }}"
  when: >-
    k3s_node_vm_name in k3s_node_defined_vms.list_vms
    and k3s_node_vm_resize_pending | bool

- name: Allow libvirt to traverse the HDD mount
  ansible.posix.acl:
    path: "{{ k3s_node_storage_mount }}"
    entity: "{{ k3s_node_libvirt_user }}"
    etype: user
    permissions: x
    state: present

- name: Create dedicated k3s node VM storage directory
  ansible.builtin.file:
    path: "{{ k3s_node_vm_storage_dir }}"
    state: directory
    owner: "{{ k3s_node_libvirt_user }}"
    group: "{{ k3s_node_libvirt_group }}"
    mode: "0750"

- name: Create k3s node cloud-init build directory
  ansible.builtin.file:
    path: "{{ k3s_node_cloud_init_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: List defined libvirt networks
  community.libvirt.virt_net:
    command: list_nets
  register: k3s_node_defined_networks
  changed_when: false

- name: Read existing k3s network definition
  community.libvirt.virt_net:
    name: "{{ k3s_node_network_name }}"
    command: get_xml
  register: k3s_node_existing_network_xml
  changed_when: false
  when: k3s_node_network_name in k3s_node_defined_networks.list_nets

- name: Validate existing k3s network definition
  ansible.builtin.assert:
    that:
      - k3s_node_network_bridge in k3s_node_existing_network_xml.get_xml
      - k3s_node_network_address in k3s_node_existing_network_xml.get_xml
      - k3s_node_network_netmask in k3s_node_existing_network_xml.get_xml
      - >-
        'mode="nat"' in k3s_node_existing_network_xml.get_xml
        or "mode='nat'" in k3s_node_existing_network_xml.get_xml
    fail_msg: >-
      The existing {{ k3s_node_network_name }} network does not match
      the configured bridge, subnet, or NAT mode. Refusing to modify it
      automatically.
  # A joining node has no reservation yet, so only network-wide facts are checked.
  when: k3s_node_network_name in k3s_node_defined_networks.list_nets

- name: Define k3s libvirt network
  community.libvirt.virt_net:
    name: "{{ k3s_node_network_name }}"
    state: present
    xml: "{{ lookup('template', 'libvirt-network.xml.j2') }}"
  # Only on first creation; a running network is never redefined wholesale.
  when: k3s_node_network_name not in k3s_node_defined_networks.list_nets

- name: Activate and enable k3s libvirt network
  community.libvirt.virt_net:
    name: "{{ k3s_node_network_name }}"
    state: active
    autostart: true

- name: Read k3s libvirt network autostart state
  ansible.builtin.command:
    argv:
      - virsh
      - net-info
      - "{{ k3s_node_network_name }}"
  register: k3s_node_network_info
  changed_when: false

# virt_net's autostart doesn't stick: see history.md.
- name: Work around community.libvirt.virt_net's autostart bug
  ansible.builtin.command:
    argv:
      - virsh
      - net-autostart
      - "{{ k3s_node_network_name }}"
  when: k3s_node_network_info.stdout is search('Autostart:\s+no')

- name: Check whether this node's DHCP reservation already exists
  ansible.builtin.set_fact:
    k3s_node_reservation_present: >-
      {{ (k3s_node_vm_mac | lower) in (k3s_node_existing_network_xml.get_xml | lower) }}
  when: k3s_node_network_name in k3s_node_defined_networks.list_nets

# net-update --live --config adds the reservation without restarting the network.
- name: Add this node's DHCP reservation to the live network
  ansible.builtin.command:
    argv:
      - virsh
      - net-update
      - "{{ k3s_node_network_name }}"
      - add
      - ip-dhcp-host
      - >-
        <host mac='{{ k3s_node_vm_mac }}' name='{{ k3s_node_vm_name }}' ip='{{ k3s_node_vm_ip }}'/>
      - --live
      - --config
  changed_when: true
  when: >-
    k3s_node_network_name in k3s_node_defined_networks.list_nets
    and not (k3s_node_reservation_present | default(true))

- name: Check Ansible controller SSH public key
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ k3s_node_admin_ssh_public_key_path }}"
  register: k3s_node_admin_ssh_public_key_file

- name: Validate Ansible controller SSH public key
  ansible.builtin.assert:
    that:
      - k3s_node_admin_ssh_public_key_file.stat.exists
      - k3s_node_admin_ssh_public_key_file.stat.isreg
    fail_msg: >-
      The controller SSH public key does not exist at
      {{ k3s_node_admin_ssh_public_key_path }}.

- name: Read Ansible controller SSH public key
  ansible.builtin.set_fact:
    k3s_node_admin_ssh_public_key: >-
      {{
        lookup(
          'ansible.builtin.file',
          k3s_node_admin_ssh_public_key_path
        )
      }}

- name: Capture hypervisor SSH connection
  ansible.builtin.set_fact:
    k3s_node_hypervisor_ssh_host: >-
      {{ ansible_host | default(inventory_hostname) }}
    k3s_node_hypervisor_ssh_user: "{{ ansible_user }}"

- name: Render k3s node cloud-init configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ k3s_node_cloud_init_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: cloud-init-user-data.yml.j2
      dest: user-data
    - src: cloud-init-meta-data.yml.j2
      dest: meta-data
    - src: cloud-init-network-config.yml.j2
      dest: network-config
  loop_control:
    label: "{{ item.dest }}"
  register: k3s_node_cloud_init_files

- name: Check k3s node cloud-init seed image
  ansible.builtin.stat:
    path: "{{ k3s_node_cloud_init_iso_path }}"
  register: k3s_node_cloud_init_iso

- name: Build persistent k3s node cloud-init seed image
  ansible.builtin.command:
    argv:
      - xorriso
      - -as
      - mkisofs
      - -quiet
      - -output
      - "{{ k3s_node_cloud_init_iso_path }}"
      - -volid
      - cidata
      - -joliet
      - -rock
      - "{{ k3s_node_cloud_init_dir }}/user-data"
      - "{{ k3s_node_cloud_init_dir }}/meta-data"
      - "{{ k3s_node_cloud_init_dir }}/network-config"
  when: >-
    not k3s_node_cloud_init_iso.stat.exists
    or k3s_node_cloud_init_files.changed

- name: Set k3s node cloud-init seed image permissions
  ansible.builtin.file:
    path: "{{ k3s_node_cloud_init_iso_path }}"
    state: file
    owner: "{{ k3s_node_libvirt_user }}"
    group: "{{ k3s_node_libvirt_group }}"
    mode: "0640"
  when: >-
    not ansible_check_mode
    or k3s_node_cloud_init_iso.stat.exists

- name: Download verified Debian cloud image
  ansible.builtin.get_url:
    url: "{{ k3s_node_debian_image_url }}"
    dest: "{{ k3s_node_debian_image_path }}"
    checksum: "{{ k3s_node_debian_image_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Create k3s node system disk from Debian cloud image
  ansible.builtin.command:
    argv:
      - qemu-img
      - convert
      - -f
      - qcow2
      - -O
      - qcow2
      - "{{ k3s_node_debian_image_path }}"
      - "{{ k3s_node_vm_disk_path }}"
    creates: "{{ k3s_node_vm_disk_path }}"
  register: k3s_node_system_disk_create

- name: Resize new k3s node system disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - resize
      - "{{ k3s_node_vm_disk_path }}"
      - "{{ k3s_node_vm_disk_size_gb }}G"
  when: k3s_node_system_disk_create.changed

- name: Set k3s node system disk permissions
  ansible.builtin.file:
    path: "{{ k3s_node_vm_disk_path }}"
    state: file
    owner: "{{ k3s_node_libvirt_user }}"
    group: "{{ k3s_node_libvirt_group }}"
    mode: "0640"
  when: >-
    not ansible_check_mode
    or k3s_node_vm_disk.stat.exists

- name: Define Debian k3s node virtual machine
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'k3s-node-domain.xml.j2') }}"
  register: k3s_node_vm_result
  when: k3s_node_vm_name not in k3s_node_defined_vms.list_vms

- name: Start and enable k3s node virtual machine
  community.libvirt.virt:
    name: "{{ k3s_node_vm_name }}"
    state: running
    autostart: true
  when: >-
    not ansible_check_mode
    or k3s_node_vm_name in k3s_node_defined_vms.list_vms

- name: Remove obsolete k3s node SSH host key after VM creation
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ k3s_node_ssh_host_key_alias }}"
  changed_when: true
  failed_when: false
  when:
    - k3s_node_vm_result.changed
    - not ansible_check_mode

- name: Wait for k3s node SSH service from the hypervisor
  ansible.builtin.wait_for:
    host: "{{ k3s_node_vm_ip }}"
    port: 22
    connect_timeout: 5
    sleep: 3
    timeout: 600
  when: not ansible_check_mode

- name: Add k3s node to dynamic inventory
  ansible.builtin.add_host:
    name: "{{ k3s_node_vm_name }}"
    groups:
      - "{{ k3s_node_inventory_group }}"
    ansible_host: "{{ k3s_node_vm_ip }}"
    ansible_user: "{{ k3s_node_admin_user }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: >-
      -o ProxyJump={{ k3s_node_hypervisor_ssh_user }}@{{ k3s_node_hypervisor_ssh_host }}
      -o HostKeyAlias={{ k3s_node_ssh_host_key_alias }}
      -o StrictHostKeyChecking=accept-new
  changed_when: false
  when: >-
    not ansible_check_mode
    or k3s_node_vm_name in k3s_node_defined_vms.list_vms
