---
- name: Validate k3s node role mode
  ansible.builtin.assert:
    that:
      - k3s_node_role_mode in ["provision_vm", "configure_guest"]
    fail_msg: >-
      k3s_node_role_mode must be either provision_vm or configure_guest.

- name: Run selected k3s node tasks
  ansible.builtin.include_tasks: "{{ k3s_node_role_mode }}.yml"
