---
# Installs k3s itself on the bare VM provision_vm.yml already created.
# Deliberately not the get.k3s.io install script piped through a shell:
# the binary is downloaded and checksum-verified the same way the
# Debian cloud image is (provision_vm.yml, same get_url + remote-
# checksum-file idiom), and the systemd unit is hand-templated from
# k3s's own upstream unit rather than generated by the installer, so
# nothing here runs unverified.

- name: Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - cloud-init
      - status
      - --wait
  changed_when: false

- name: Create k3s config directory
  ansible.builtin.file:
    path: "{{ k3s_node_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install k3s server config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_node_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_config_file

- name: Download checksum-verified k3s binary
  ansible.builtin.get_url:
    url: "{{ k3s_node_release_base_url }}/k3s"
    dest: "{{ k3s_node_binary_path }}"
    checksum: "sha256:{{ k3s_node_release_base_url }}/sha256sum-amd64.txt"
    owner: root
    group: root
    mode: "0755"
  register: k3s_node_binary

- name: Symlink kubectl to the k3s binary
  ansible.builtin.file:
    src: "{{ k3s_node_binary_path }}"
    dest: "{{ k3s_node_kubectl_symlink }}"
    state: link
    force: true

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_unit_file

- name: Reload systemd for the k3s unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: k3s_node_unit_file.changed

- name: Restart k3s when its binary or config changed
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when: >-
    k3s_node_binary.changed
    or k3s_node_config_file.changed
    or k3s_node_unit_file.changed

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Wait for the k3s node to report Ready
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_kubectl_symlink }}"
      - get
      - nodes
      - --no-headers
  environment:
    KUBECONFIG: "{{ k3s_node_kubeconfig_path }}"
  register: k3s_node_status
  changed_when: false
  until: "'Ready' in k3s_node_status.stdout"
  retries: 60
  delay: 10
