---
# Installs k3s from a checksum-verified binary, not the piped install script.

- name: Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - cloud-init
      - status
      - --wait
  changed_when: false

# The guest's partition and filesystem don't grow on their own after the host grows the disk.
- name: Grow the root partition to fill the disk
  ansible.builtin.command:
    argv:
      - growpart
      - "{{ k3s_node_root_disk }}"
      - "{{ k3s_node_root_partition }}"
  register: k3s_node_growpart
  # growpart exits 1 with NOCHANGE when there is nothing to grow.
  changed_when: "'CHANGED' in k3s_node_growpart.stdout"
  failed_when: k3s_node_growpart.rc not in [0, 1] or (k3s_node_growpart.rc == 1 and 'NOCHANGE' not in k3s_node_growpart.stdout)

- name: Grow the root filesystem to fill its partition
  ansible.builtin.command:
    argv:
      - resize2fs
      - "{{ k3s_node_root_disk }}{{ k3s_node_root_partition }}"
  register: k3s_node_resize2fs
  changed_when: "'Nothing to do' not in k3s_node_resize2fs.stderr and 'Nothing to do' not in k3s_node_resize2fs.stdout"

# Go's resolver bypasses systemd-resolved's stub, so it points at the real nameservers.
- name: Create systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable systemd-resolved's stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/disable-stub-listener.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_resolved_stub_config

- name: Point /etc/resolv.conf at systemd-resolved's real-nameserver file
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/resolv.conf
    state: link
    force: true
  register: k3s_node_resolv_conf_link

# Live listener via ss, not a TCP connect: Blocky's hostPort DNAT answers any :53 connect on node-1 (see history.md).
- name: Check whether systemd-resolved's stub listener is still active
  ansible.builtin.command:
    argv:
      - ss
      - -Hltn
      - "sport = :53"
  register: k3s_node_resolved_stub_probe
  changed_when: false
  check_mode: false

- name: Restart systemd-resolved when its config changed or its stub listener is still active
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: >-
    k3s_node_resolved_stub_config.changed
    or k3s_node_resolv_conf_link.changed
    or '127.0.0.53' in k3s_node_resolved_stub_probe.stdout

- name: Validate k3s agent join configuration
  ansible.builtin.assert:
    that:
      - k3s_node_join_server_url | length > 0
      - k3s_node_join_token | length > 0
      - k3s_node_agent_node_taint | length > 0
      - k3s_node_agent_node_label | length > 0
    fail_msg: >-
      k3s_node_join_mode is "agent" but one of k3s_node_join_server_url
      / k3s_node_join_token / k3s_node_agent_node_taint /
      k3s_node_agent_node_label is empty -- see
      ansible/playbooks/k3s.yml's own agent-node plays for where these
      are meant to come from.
  when: k3s_node_join_mode == "agent"

- name: Select the systemd unit name for this join mode
  ansible.builtin.set_fact:
    k3s_node_systemd_unit_name: "{{ 'k3s-agent' if k3s_node_join_mode == 'agent' else 'k3s' }}"

- name: Create k3s config directory
  ansible.builtin.file:
    path: "{{ k3s_node_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install k3s server config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_node_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_config_file
  when: k3s_node_join_mode == "server"

# Agent mode joins via K3S_URL/K3S_TOKEN; 0600 because the token is a secret.
- name: Install k3s agent environment file
  ansible.builtin.template:
    src: k3s-agent.env.j2
    dest: "{{ k3s_node_agent_env_path }}"
    owner: root
    group: root
    mode: "0600"
  register: k3s_node_agent_env_file
  when: k3s_node_join_mode == "agent"

- name: Download checksum-verified k3s binary
  ansible.builtin.get_url:
    url: "{{ k3s_node_release_base_url }}/k3s"
    dest: "{{ k3s_node_binary_path }}"
    checksum: "sha256:{{ k3s_node_release_base_url }}/sha256sum-amd64.txt"
    owner: root
    group: root
    mode: "0755"
  register: k3s_node_binary

- name: Symlink kubectl to the k3s binary
  ansible.builtin.file:
    src: "{{ k3s_node_binary_path }}"
    dest: "{{ k3s_node_kubectl_symlink }}"
    state: link
    force: true

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: "{{ 'k3s-agent.service.j2' if k3s_node_join_mode == 'agent' else 'k3s.service.j2' }}"
    dest: "/etc/systemd/system/{{ k3s_node_systemd_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_unit_file

- name: Reload systemd for the k3s unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: k3s_node_unit_file.changed

# k3s starts kubelet with --config-dir here and only rewrites its own 00-k3s-defaults.conf.
- name: Create kubelet config drop-in directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Enable kubelet graceful node shutdown
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-graceful-node-shutdown.conf
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      shutdownGracePeriod: {{ k3s_node_shutdown_grace_period }}
      shutdownGracePeriodCriticalPods: {{ k3s_node_shutdown_grace_period_critical_pods }}
    owner: root
    group: root
    mode: "0600"
  register: k3s_node_kubelet_shutdown_dropin

- name: Create logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Drop-ins apply sorted by file name across /etc and /usr/lib: "zz-" beats unattended-upgrades' 30 s file.
- name: Let kubelet's shutdown inhibitor hold the VM shutdown long enough
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/zz-kubelet-graceful-shutdown.conf
    content: |
      [Login]
      InhibitDelayMaxSec={{ k3s_node_logind_inhibit_delay_max_sec }}
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_logind_dropin

# Superseded by the zz- name above, which sorts after unattended-upgrades' file. Delete once it has run.
- name: Remove the logind drop-in that sorted before unattended-upgrades' cap
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/kubelet-graceful-shutdown.conf
    state: absent

# Live value, not the file: on 2026-10-26 the cap stayed at 30 s and kubelet gave up.
- name: Read logind's live InhibitDelayMaxSec
  ansible.builtin.command:
    argv:
      - busctl
      - get-property
      - org.freedesktop.login1
      - /org/freedesktop/login1
      - org.freedesktop.login1.Manager
      - InhibitDelayMaxUSec
  register: k3s_node_logind_inhibit_live
  changed_when: false
  check_mode: false

# Output is "t <microseconds>"; sessions survive a logind restart on systemd 257.
- name: Restart logind when its live inhibitor cap is below the configured one
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted
  register: k3s_node_logind_restart
  when: >-
    (k3s_node_logind_inhibit_live.stdout.split()[1] | int)
    < (k3s_node_logind_inhibit_delay_max_sec | int) * 1000000

- name: Restart k3s when its binary, config, or unit changed
  ansible.builtin.systemd_service:
    name: "{{ k3s_node_systemd_unit_name }}"
    state: restarted
  when: >-
    k3s_node_binary.changed
    or k3s_node_config_file.changed | default(false)
    or k3s_node_agent_env_file.changed | default(false)
    or k3s_node_unit_file.changed
    or k3s_node_kubelet_shutdown_dropin.changed
    or k3s_node_logind_restart is changed

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ k3s_node_systemd_unit_name }}"
    enabled: true
    state: started

# Terraform, checksum-verified; what it manages lives in k3s-apps.
- name: Install unzip for extracting the Terraform release
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Create Terraform download cache directory
  ansible.builtin.file:
    path: "{{ k3s_node_terraform_zip_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download checksum-verified Terraform release
  ansible.builtin.get_url:
    url: "{{ k3s_node_terraform_zip_url }}"
    dest: "{{ k3s_node_terraform_zip_path }}"
    checksum: "sha256:{{ k3s_node_terraform_checksum_url }}"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_terraform_zip

- name: Check installed Terraform binary
  ansible.builtin.stat:
    path: "{{ k3s_node_terraform_binary_path }}"
  register: k3s_node_terraform_binary

- name: Extract Terraform binary
  ansible.builtin.unarchive:
    src: "{{ k3s_node_terraform_zip_path }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: k3s_node_terraform_zip.changed or not k3s_node_terraform_binary.stat.exists

# kubelet needs the host's mount.nfs for NFS PersistentVolumes.
- name: Install NFS client packages
  ansible.builtin.apt:
    name: nfs-common
    state: present

# Server mode only: agents have no local kubeconfig; k3s.yml checks them from the server.
- name: Wait for the k3s node to report Ready
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_kubectl_symlink }}"
      - get
      - nodes
      - --no-headers
  environment:
    KUBECONFIG: "{{ k3s_node_kubeconfig_path }}"
  register: k3s_node_status
  changed_when: false
  # Read-only, so it runs under --check too.
  check_mode: false
  until: "'Ready' in k3s_node_status.stdout"
  retries: 60
  delay: 10
  when: k3s_node_join_mode == "server"

- name: Wait for the k3s agent service to become active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ k3s_node_systemd_unit_name }}"
  register: k3s_node_agent_active
  changed_when: false
  check_mode: false
  failed_when: false
  until: k3s_node_agent_active.stdout == "active"
  retries: 60
  delay: 10
  when: k3s_node_join_mode == "agent"
