---
# Installs k3s itself on the bare VM provision_vm.yml already created.
# Deliberately not the get.k3s.io install script piped through a shell:
# the binary is downloaded and checksum-verified the same way the
# Debian cloud image is (provision_vm.yml, same get_url + remote-
# checksum-file idiom), and the systemd unit is hand-templated from
# k3s's own upstream unit rather than generated by the installer, so
# nothing here runs unverified.

- name: Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - cloud-init
      - status
      - --wait
  changed_when: false

# Debian's default systemd-resolved setup points /etc/resolv.conf at
# its own loopback stub (127.0.0.53). glibc's NSS resolver (what
# ordinary shell tools -- dig, getent, an HTTP client -- go through)
# talks to systemd-resolved's smarter D-Bus/Varlink interface
# regardless, so it never sees a problem -- but Go binaries
# (containerd included) use Go's own pure-Go resolver, which fires a
# raw UDP query straight at whatever's in /etc/resolv.conf, bypassing
# that smarter path entirely. Confirmed live (2026-09-01): with a
# real, working network underneath (verified via a full TLS handshake
# reaching ghcr.io/registry-1.docker.io directly), containerd's own
# image pulls still failed over and over with "lookup ghcr.io: Try
# again" -- stub-listener flakiness that a full k3s/containerd restart
# didn't clear, because the stub itself was the problem, not any
# cached process state. Disabling the stub listener and pointing
# /etc/resolv.conf at systemd-resolved's own always-maintained
# real-nameserver file instead (the standard, documented fix for this
# exact class of bug) fixes it for every resolver on the node, not
# just containerd's.
- name: Create systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable systemd-resolved's stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/disable-stub-listener.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_resolved_stub_config

- name: Point /etc/resolv.conf at systemd-resolved's real-nameserver file
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/resolv.conf
    state: link
    force: true
  register: k3s_node_resolv_conf_link

- name: Restart systemd-resolved when its stub listener config changed
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: >-
    k3s_node_resolved_stub_config.changed
    or k3s_node_resolv_conf_link.changed

- name: Validate k3s agent join configuration
  ansible.builtin.assert:
    that:
      - k3s_node_join_server_url | length > 0
      - k3s_node_join_token | length > 0
      - k3s_node_agent_node_taint | length > 0
      - k3s_node_agent_node_label | length > 0
    fail_msg: >-
      k3s_node_join_mode is "agent" but one of k3s_node_join_server_url
      / k3s_node_join_token / k3s_node_agent_node_taint /
      k3s_node_agent_node_label is empty -- see
      ansible/playbooks/k3s.yml's own agent-node plays for where these
      are meant to come from.
  when: k3s_node_join_mode == "agent"

- name: Select the systemd unit name for this join mode
  ansible.builtin.set_fact:
    k3s_node_systemd_unit_name: "{{ 'k3s-agent' if k3s_node_join_mode == 'agent' else 'k3s' }}"

- name: Create k3s config directory
  ansible.builtin.file:
    path: "{{ k3s_node_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install k3s server config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_node_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_config_file
  when: k3s_node_join_mode == "server"

# Agent mode has no server config file -- it joins an already-running
# server instead, over K3S_URL/K3S_TOKEN in this env file. Mode 0600:
# unlike k3s-node-1's own world-readable kubeconfig (single-user
# learning node, no real privilege boundary crossed -- see that file's
# own comment), this holds the actual cluster-join secret.
- name: Install k3s agent environment file
  ansible.builtin.template:
    src: k3s-agent.env.j2
    dest: "{{ k3s_node_agent_env_path }}"
    owner: root
    group: root
    mode: "0600"
  register: k3s_node_agent_env_file
  when: k3s_node_join_mode == "agent"

- name: Download checksum-verified k3s binary
  ansible.builtin.get_url:
    url: "{{ k3s_node_release_base_url }}/k3s"
    dest: "{{ k3s_node_binary_path }}"
    checksum: "sha256:{{ k3s_node_release_base_url }}/sha256sum-amd64.txt"
    owner: root
    group: root
    mode: "0755"
  register: k3s_node_binary

- name: Symlink kubectl to the k3s binary
  ansible.builtin.file:
    src: "{{ k3s_node_binary_path }}"
    dest: "{{ k3s_node_kubectl_symlink }}"
    state: link
    force: true

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: "{{ 'k3s-agent.service.j2' if k3s_node_join_mode == 'agent' else 'k3s.service.j2' }}"
    dest: "/etc/systemd/system/{{ k3s_node_systemd_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_unit_file

- name: Reload systemd for the k3s unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: k3s_node_unit_file.changed

- name: Restart k3s when its binary, config, or unit changed
  ansible.builtin.systemd_service:
    name: "{{ k3s_node_systemd_unit_name }}"
    state: restarted
  when: >-
    k3s_node_binary.changed
    or k3s_node_config_file.changed | default(false)
    or k3s_node_agent_env_file.changed | default(false)
    or k3s_node_unit_file.changed

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ k3s_node_systemd_unit_name }}"
    enabled: true
    state: started

# Terraform itself, checksum-verified the same way as everything else
# in this task file. What it manages (the workloads running inside the
# cluster) lives in its own separate git repo, not here -- this only
# makes the tool available on the node that will run "terraform apply"
# against it.
- name: Install unzip for extracting the Terraform release
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Create Terraform download cache directory
  ansible.builtin.file:
    path: "{{ k3s_node_terraform_zip_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download checksum-verified Terraform release
  ansible.builtin.get_url:
    url: "{{ k3s_node_terraform_zip_url }}"
    dest: "{{ k3s_node_terraform_zip_path }}"
    checksum: "sha256:{{ k3s_node_terraform_checksum_url }}"
    owner: root
    group: root
    mode: "0644"
  register: k3s_node_terraform_zip

- name: Check installed Terraform binary
  ansible.builtin.stat:
    path: "{{ k3s_node_terraform_binary_path }}"
  register: k3s_node_terraform_binary

- name: Extract Terraform binary
  ansible.builtin.unarchive:
    src: "{{ k3s_node_terraform_zip_path }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: k3s_node_terraform_zip.changed or not k3s_node_terraform_binary.stat.exists

# Required for k3s's built-in NFS volume support to work at all -- the
# kubelet shells out to the host's own mount.nfs helper (from
# nfs-common) when a Pod mounts an NFS-backed PersistentVolume; without
# it, that mount silently fails. Needed for the Deluge migration
# (home-infra's nfs_server role exports its directories here).
- name: Install NFS client packages
  ansible.builtin.apt:
    name: nfs-common
    state: present

# Server mode only -- an agent never gets its own kubeconfig (only a
# server generates one), so there's nothing local to poll here. Its
# equivalent Ready confirmation happens from the *server's* own side --
# see ansible/playbooks/k3s.yml's own agent-node play and this
# project's plan/README for the live "kubectl get nodes" check run
# against k3s-node-1 instead.
- name: Wait for the k3s node to report Ready
  ansible.builtin.command:
    argv:
      - "{{ k3s_node_kubectl_symlink }}"
      - get
      - nodes
      - --no-headers
  environment:
    KUBECONFIG: "{{ k3s_node_kubeconfig_path }}"
  register: k3s_node_status
  changed_when: false
  until: "'Ready' in k3s_node_status.stdout"
  retries: 60
  delay: 10
  when: k3s_node_join_mode == "server"

- name: Wait for the k3s agent service to become active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ k3s_node_systemd_unit_name }}"
  register: k3s_node_agent_active
  changed_when: false
  failed_when: false
  until: k3s_node_agent_active.stdout == "active"
  retries: 60
  delay: 10
  when: k3s_node_join_mode == "agent"
