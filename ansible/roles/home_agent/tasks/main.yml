---
# Only home_tools_service is left on the host; home_agent runs in k3s. See the README.

- name: Validate home agent configuration
  ansible.builtin.assert:
    that:
      - home_agent_tools_filesystems is sequence
      - home_agent_tools_filesystems is not string
      - home_agent_tools_filesystems | length > 0
      - >-
        home_agent_tools_socket_path | dirname
        == home_agent_tools_socket_dir
      # Only empty or the homeserver's k3s-network address are allowed.
      - >-
        home_agent_tools_tcp_bind_address | length == 0
        or home_agent_tools_tcp_bind_address == "192.168.101.1"
      - home_agent_tools_tcp_port | int >= 1024
      - home_agent_tools_tcp_port | int <= 65535
    fail_msg: >-
      Keep home_agent_tools_tcp_bind_address empty or pinned to the k3s
      VM's isolated network address.
  no_log: true

- name: Check Docker group
  ansible.builtin.getent:
    database: group
    key: docker

- name: Create home tools client group
  ansible.builtin.group:
    name: "{{ home_agent_tools_client_group }}"
    system: true
    state: present

- name: Create home tools service account
  ansible.builtin.user:
    name: "{{ home_agent_tools_service_user }}"
    group: "{{ home_agent_tools_client_group }}"
    groups:
      - docker
    append: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create home tools installation directory
  ansible.builtin.file:
    path: "{{ home_agent_tools_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy and wait for the home tools socket service
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/deploy_socket_service.yml"
  vars:
    socket_service_name: home tools
    socket_service_src: "{{ role_path }}/files/home_tools_service.py"
    socket_service_dest: "{{ home_agent_tools_install_dir }}/home_tools_service.py"
    socket_service_unit_template: "{{ role_path }}/templates/home-tools.service.j2"
    socket_service_unit_name: home-tools.service
    socket_service_socket_path: "{{ home_agent_tools_socket_path }}"
    socket_service_handler: Restart home tools
