---
home_agent_tools_service_user: home-tools
home_agent_tools_client_group: home-tools-client
home_agent_tools_install_dir: /usr/local/lib/home-tools
home_agent_tools_socket_dir: /run/home-tools
home_agent_tools_socket_path: /run/home-tools/home-tools.sock
home_agent_tools_docker_socket_path: /var/run/docker.sock
home_agent_tools_filesystems:
  - /
  - /mnt/black-hdd

# Optional TCP listener for the k3s-native home_agent, same read-only handler as the Unix socket.
home_agent_tools_tcp_bind_address: ""
home_agent_tools_tcp_port: 8095
