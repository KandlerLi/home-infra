---
home_agent_tools_service_user: home-tools
home_agent_tools_client_group: home-tools-client
home_agent_tools_install_dir: /usr/local/lib/home-tools
home_agent_tools_socket_dir: /run/home-tools
home_agent_tools_socket_path: /run/home-tools/home-tools.sock
home_agent_tools_docker_socket_path: /var/run/docker.sock
home_agent_tools_filesystems:
  - /
  - /mnt/black-hdd

# Off by default (Unix socket only, unreachable off this host). When set,
# home_tools_service also listens on this address/port with the exact
# same fixed, read-only, argument-free handler as the Unix socket --
# exists so home_agent can still reach this service once it runs in the
# k3s VM instead of on this host. 192.168.101.1 (this homeserver's own
# address on the k3s VM's isolated network) is the only value the role's
# own validation allows -- see nextcloud_aio_apache_ip_binding's matching
# comment for the full reasoning.
home_agent_tools_tcp_bind_address: ""
home_agent_tools_tcp_port: 8095
