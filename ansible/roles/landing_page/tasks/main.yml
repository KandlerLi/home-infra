---
- name: Configure landing page
  when: landing_page_enabled | bool
  block:
    - name: Validate landing page configuration
      ansible.builtin.assert:
        that:
          - landing_page_bind_address == "127.0.0.1"
          - landing_page_port | int >= 1024
          - landing_page_port | int <= 65535
          - landing_page_links is sequence
          - landing_page_links is not string
          - landing_page_links | length > 0
          - landing_page_links | selectattr('name', 'defined') | list | length == landing_page_links | length
          - landing_page_links | selectattr('url', 'defined') | list | length == landing_page_links | length
        fail_msg: >-
          Keep landing_page_bind_address on loopback and give every entry
          in landing_page_links a name and a url.

    - name: Create landing page content directory
      ansible.builtin.file:
        path: "{{ landing_page_content_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install landing page markup
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ landing_page_content_dir }}/index.html"
        owner: root
        group: root
        mode: "0644"
      register: landing_page_index_file

    - name: Install landing page stylesheet
      ansible.builtin.copy:
        src: style.css
        dest: "{{ landing_page_content_dir }}/style.css"
        owner: root
        group: root
        mode: "0644"
      register: landing_page_style_file

    - name: Pull pinned landing page image
      community.docker.docker_image:
        name: "{{ landing_page_image }}"
        source: pull
        state: present
      register: landing_page_image_pull

    - name: Ensure landing page container is running
      community.docker.docker_container:
        name: "{{ landing_page_container_name }}"
        image: "{{ landing_page_image }}"
        state: started
        recreate: >-
          {{
            landing_page_image_pull.changed
            or landing_page_index_file.changed
            or landing_page_style_file.changed
          }}
        restart_policy: "{{ landing_page_restart_policy }}"
        read_only: true
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        memory: "{{ landing_page_memory_limit }}"
        cpus: "{{ landing_page_cpu_limit }}"
        pids_limit: "{{ landing_page_pids_limit }}"
        published_ports:
          - "{{ landing_page_bind_address }}:{{ landing_page_port }}:8080"
        volumes:
          - "{{ landing_page_content_dir }}:/usr/share/nginx/html:ro"
        tmpfs:
          - /tmp:rw,noexec,nosuid,nodev,size=8m
          - /var/cache/nginx:rw,noexec,nosuid,nodev,size=8m
          - /var/run:rw,noexec,nosuid,nodev,size=1m
        healthcheck:
          test:
            - CMD
            - wget
            - -q
            - -O
            - /dev/null
            - http://127.0.0.1:8080/
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 10s
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"

    - name: Verify landing page is ready
      ansible.builtin.uri:
        url: "http://{{ landing_page_bind_address }}:{{ landing_page_port }}/"
        method: GET
        return_content: false
        status_code: 200
      register: landing_page_health
      retries: 10
      delay: 2
      until: landing_page_health.status == 200
      when: not ansible_check_mode

# Cleanly tears down the container this role itself created when
# flipped off, rather than abandoning it as an orphan that no longer
# appears anywhere in this role's own tasks -- e.g. once
# home.jkandler.de is cut over to serve from elsewhere (see
# shared_ingress_home_upstream) and this Docker-based copy is no longer
# needed as a fallback.
- name: Tear down landing page when disabled
  when: not (landing_page_enabled | bool)
  block:
    - name: Stop and remove landing page container
      community.docker.docker_container:
        name: "{{ landing_page_container_name }}"
        state: absent
