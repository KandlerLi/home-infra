---
landing_page_enabled: false

landing_page_container_name: landing-page
# nginx-unprivileged, not plain nginx: it listens on 8080 and runs as a
# non-root user by default, so this container can run read_only with
# cap_drop: ALL like every other role here, instead of needing the
# NET_BIND_SERVICE capability shared_ingress needs for port 80/443.
landing_page_image_name: nginxinc/nginx-unprivileged
landing_page_image_tag: 1.27-alpine
landing_page_image_digest: >-
  sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
landing_page_image: >-
  {{ landing_page_image_name }}:{{ landing_page_image_tag }}@{{ landing_page_image_digest }}
landing_page_restart_policy: unless-stopped

landing_page_bind_address: 127.0.0.1
landing_page_port: 8095
landing_page_content_dir: /etc/landing-page/html
landing_page_memory_limit: 32M
landing_page_cpu_limit: 0.1
landing_page_pids_limit: 16

landing_page_title: Home

# Pure HTML/CSS links out to the other services behind shared_ingress
# (the actual per-service Basic Auth login happens on the target site,
# same shared_ingress_auth_username/password_hash credential covers this
# page too). Each icon is a small inline SVG (generic glyphs, not the
# services' own logos, to avoid trademark/asset-licensing questions) so
# the page stays a single self-contained file with no external requests
# or JavaScript.
landing_page_links:
  - name: Nextcloud
    url: https://nextcloud.jkandler.de/
    description: Files, calendar, contacts
    icon: >-
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18a4 4 0 0 1-.5-7.97A5 5 0 0 1 16 8.05 4.5 4.5 0 0 1
      17.5 18H7Z"/></svg>
  - name: Home Agent
    url: https://ai.jkandler.de/
    description: Chat assistant and tools
    icon: >-
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h16v11H8l-4 4V5Z"/>
      <circle cx="8.5" cy="10.5" r="0.75" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="10.5" r="0.75" fill="currentColor" stroke="none"/>
      <circle cx="15.5" cy="10.5" r="0.75" fill="currentColor" stroke="none"/>
      </svg>
  - name: Deluge
    url: https://torrent.jkandler.de/
    description: Torrent client
    icon: >-
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v10m0 0-4-4m4 4 4-4"/>
      <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
  - name: Grafana
    url: https://grafana.jkandler.de/
    description: Dashboards and alerts
    icon: >-
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 19V10M12 19V5M19 19v-6"/></svg>
