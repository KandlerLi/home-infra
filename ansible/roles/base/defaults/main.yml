---
admin_user: julian

# The onboard NIC's own interface name and PCI address -- see
# docs/home-infra-docs/docs/runbooks/homeserver-e1000e-nic-watchdog-hang.md.
# Literals, not discovered dynamically: this role only ever targets
# this one known physical host's one known NIC.
base_e1000e_interface: enp0s25
base_e1000e_pci_address: "0000:00:19.0"
base_e1000e_watchdog_recovery_install_dir: /usr/local/lib/e1000e-watchdog-recovery

# Hardware watchdog timeout -- see
# docs/home-infra-docs/docs/runbooks/homeserver-silent-freeze.md. 30s
# balances real recovery speed against false positives from ordinary
# load spikes.
base_watchdog_sec: 30s