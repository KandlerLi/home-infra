---
- name: Check effective user
  ansible.builtin.command:
    cmd: id -un
  register: effective_user
  changed_when: false
  check_mode: false

- name: Verify root privileges
  ansible.builtin.assert:
    that:
      - effective_user.stdout == "root"
    fail_msg: "Ansible does not have root privileges."
    success_msg: "Ansible is running with root privileges."

# The interactive shell setup, formerly a hand-made Homebrew install.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - htop
      - tree
      - unzip
      - vim
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
    state: present
    update_cache: true
    cache_valid_time: 86400

# Intel 82579LM PCIe ASPM bug: see the homeserver-e1000e-nic-watchdog-hang runbook.
- name: Disable PCIe ASPM in the kernel command line (e1000e watchdog-hang fix)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    backrefs: true
    regexp: '^(GRUB_CMDLINE_LINUX=")((?:(?!pcie_aspm=off).)*)"$'
    line: '\1\2 pcie_aspm=off"'
  register: grub_cmdline

- name: Regenerate the GRUB configuration
  ansible.builtin.command:
    cmd: update-grub
  when: grub_cmdline.changed

- name: Flag that a reboot is required to load the new kernel parameter
  ansible.builtin.debug:
    msg: >-
      pcie_aspm=off was just added to /etc/default/grub and
      /boot/grub/grub.cfg has been regenerated, but this is not loaded
      until the next reboot. Not rebooting automatically -- schedule
      that separately.
  when: grub_cmdline.changed

# ASPM off alone wasn't enough: offloading and EEE are the other usual contributors. See the runbook.
- name: Install ethtool
  ansible.builtin.apt:
    name: ethtool
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Disable TSO/GSO/GRO offloading on the onboard NIC (e1000e watchdog-hang fix)
  ansible.builtin.command:
    cmd: >-
      ethtool -K {{ base_e1000e_interface }}
      tso off gso off gro off
  # ethtool can't tell whether anything would change.
  changed_when: true

# Tolerates NICs without EEE support, fails on anything else.
- name: Disable Energy Efficient Ethernet on the onboard NIC (e1000e watchdog-hang fix)
  ansible.builtin.command:
    cmd: "ethtool --set-eee {{ base_e1000e_interface }} eee off"
  register: base_eee_result
  changed_when: base_eee_result.rc == 0
  failed_when: >-
    base_eee_result.rc != 0
    and 'Operation not supported' not in base_eee_result.stderr

# ethtool changes live state only; an ifupdown post-up hook reapplies it.
- name: Persist the NIC offload/EEE settings via an ifupdown post-up hook
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    insertafter: '^iface {{ base_e1000e_interface }} inet dhcp$'
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- e1000e watchdog-hang fix"
    # Flush-left is fine: ifupdown ignores the indentation.
    content: |
      post-up /sbin/ethtool -K {{ base_e1000e_interface }} tso off gso off gro off
      post-up /sbin/ethtool --set-eee {{ base_e1000e_interface }} eee off || true

# A safety net: rebinds the NIC on a NETDEV WATCHDOG event. See the runbook.
- name: Create e1000e watchdog recovery install directory
  ansible.builtin.file:
    path: "{{ base_e1000e_watchdog_recovery_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the e1000e watchdog recovery script
  ansible.builtin.template:
    src: e1000e-watchdog-recovery.sh.j2
    dest: "{{ base_e1000e_watchdog_recovery_install_dir }}/e1000e-watchdog-recovery.sh"
    owner: root
    group: root
    mode: "0755"
  register: base_e1000e_watchdog_recovery_script

- name: Install the e1000e watchdog recovery systemd unit
  ansible.builtin.template:
    src: e1000e-watchdog-recovery.service.j2
    dest: /etc/systemd/system/e1000e-watchdog-recovery.service
    owner: root
    group: root
    mode: "0644"
  register: base_e1000e_watchdog_recovery_unit

- name: Reload systemd for the e1000e watchdog recovery unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: base_e1000e_watchdog_recovery_unit.changed

- name: Ensure the e1000e watchdog recovery service is enabled and running
  ansible.builtin.systemd_service:
    name: e1000e-watchdog-recovery.service
    enabled: true
    state: >-
      {{ 'restarted' if (base_e1000e_watchdog_recovery_script.changed
         or base_e1000e_watchdog_recovery_unit.changed) else 'started' }}

# For total silent freezes: see the homeserver-silent-freeze runbook.
- name: Enable the hardware watchdog via systemd
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?RuntimeWatchdogSec='
    line: "RuntimeWatchdogSec={{ base_watchdog_sec }}"
  register: base_watchdog_config

- name: Reexec systemd to apply the watchdog setting immediately
  ansible.builtin.command:
    cmd: systemctl daemon-reexec
  when: base_watchdog_config.changed

# Pins enp0s25's IPv6 address generation to EUI-64 for a stable address.
- name: Persist deterministic IPv6 address generation via sysctl
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-ipv6-stable-address.conf
    reload: true
  loop:
    - name: "net.ipv6.conf.{{ base_e1000e_interface }}.addr_gen_mode"
      value: "0"
    - name: "net.ipv6.conf.{{ base_e1000e_interface }}.use_tempaddr"
      value: "0"
  register: base_ipv6_sysctl

# Doesn't bounce enp0s25: this run uses it for SSH.
- name: Flag that the IPv6 address won't update until the interface is recycled
  ansible.builtin.debug:
    msg: >-
      IPv6 address generation is now pinned to EUI-64, but enp0s25's
      current address won't change until it re-processes a Router
      Advertisement -- bounce the interface or reboot. Then confirm
      with `ip -6 addr show {{ base_e1000e_interface }}` and re-point
      the FRITZ!Box's DNSv6-Server at the new address (see
      the private task list's "Homeserver has no stable IPv6 address").
  when: base_ipv6_sysctl.changed

- name: Ensure www-data group exists
  ansible.builtin.group:
    name: www-data
    state: present

- name: Add administrator to www-data group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups:
      - www-data
    append: true

- name: Set the administrator's login shell to zsh
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /usr/bin/zsh

# Pinned to a commit; updates are deliberate SHA bumps.
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ admin_user }}/.oh-my-zsh"
    version: 146461f7c6d95f4ba1220559d66eb113418b40a8
    depth: 1

# The version Homebrew had installed, so the prompt looks the same.
- name: Install Powerlevel10k theme
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "/home/{{ admin_user }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: v1.20.0
    depth: 1

- name: Reclaim ownership of the Oh My Zsh installation
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.oh-my-zsh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    recurse: true
