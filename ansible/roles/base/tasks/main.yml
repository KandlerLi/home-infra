---
- name: Check effective user
  ansible.builtin.command:
    cmd: id -un
  register: effective_user
  changed_when: false
  check_mode: false

- name: Verify root privileges
  ansible.builtin.assert:
    that:
      - effective_user.stdout == "root"
    fail_msg: "Ansible does not have root privileges."
    success_msg: "Ansible is running with root privileges."

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - htop
      - tree
      - unzip
      - vim
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Ensure www-data group exists
  ansible.builtin.group:
    name: www-data
    state: present

- name: Add administrator to www-data group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups:
      - www-data
    append: true