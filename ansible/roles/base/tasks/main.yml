---
- name: Check effective user
  ansible.builtin.command:
    cmd: id -un
  register: effective_user
  changed_when: false
  check_mode: false

- name: Verify root privileges
  ansible.builtin.assert:
    that:
      - effective_user.stdout == "root"
    fail_msg: "Ansible does not have root privileges."
    success_msg: "Ansible is running with root privileges."

# The zsh/zsh-autosuggestions/zsh-syntax-highlighting group was
# Homebrew-installed by hand before, entirely outside this repo --
# migrated here so the interactive shell setup isn't an untracked install
# any more (zsh-syntax-highlighting was already apt-installed and unused
# by Ansible).
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - htop
      - tree
      - unzip
      - vim
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
    state: present
    update_cache: true
    cache_valid_time: 86400

# The homeserver's onboard NIC (Intel 82579LM, driver e1000e) hit a
# well-documented PCIe ASPM (Active State Power Management) bug that
# causes it to periodically hang and reset -- "NETDEV WATCHDOG ...
# transmit queue timed out" in a loop, network fully dead during each
# cycle -- root-caused after a real ~14min production outage on
# 2026-09-01 (see PARKED.md's own writeup for the full kernel log).
# Disabling ASPM globally via this kernel boot parameter is the
# standard, most broadly effective fix for this exact chipset/bug
# combination. Only `base` (applied to the `home_servers` group, i.e.
# only the physical homeserver, never the k3s VMs) needs this -- no
# other host in this repo has this NIC.
#
# Takes effect only after a reboot -- this task and the `update-grub`
# regeneration below just get the new parameter written and staged;
# rebooting to actually load it is a separate, deliberate step.
- name: Disable PCIe ASPM in the kernel command line (e1000e watchdog-hang fix)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    backrefs: true
    regexp: '^(GRUB_CMDLINE_LINUX=")((?:(?!pcie_aspm=off).)*)"$'
    line: '\1\2 pcie_aspm=off"'
  register: grub_cmdline

- name: Regenerate the GRUB configuration
  ansible.builtin.command:
    cmd: update-grub
  when: grub_cmdline.changed

- name: Flag that a reboot is required to load the new kernel parameter
  ansible.builtin.debug:
    msg: >-
      pcie_aspm=off was just added to /etc/default/grub and
      /boot/grub/grub.cfg has been regenerated, but this is not loaded
      until the next reboot. Not rebooting automatically -- schedule
      that separately.
  when: grub_cmdline.changed

# 2026-09-06: pcie_aspm=off alone was not enough -- the exact same
# NETDEV WATCHDOG/"Detected Hardware Unit Hang" bug recurred with
# pcie_aspm=off confirmed active in /proc/cmdline the whole time, this
# time with the driver's own internal reset stuck retrying and failing
# continuously for almost 8 hours before a manual reboot, rather than
# self-recovering within minutes the way the first incident did (see
# PARKED.md for the full writeup). TSO/GSO/GRO offloading and Energy
# Efficient Ethernet are the other two contributors most commonly cited
# alongside ASPM for this exact 82579LM/e1000e watchdog-hang bug --
# takes effect immediately on the live interface, no reboot needed,
# unlike the kernel parameter above.
- name: Install ethtool
  ansible.builtin.apt:
    name: ethtool
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Disable TSO/GSO/GRO offloading on the onboard NIC (e1000e watchdog-hang fix)
  ansible.builtin.command:
    cmd: >-
      ethtool -K {{ base_e1000e_interface }}
      tso off gso off gro off
  # Always reported changed -- ethtool has no way to ask "would this
  # change anything", and re-running an already-off setting is a
  # harmless no-op. Same accepted tradeoff as k3s_ingress_forward's own
  # "Force-persist once" task.
  changed_when: true

# Not every e1000e/kernel combination supports EEE at all -- tolerate
# "Operation not supported" specifically rather than failing the whole
# play, but still fail loudly on anything else (a typo'd interface
# name, for instance).
- name: Disable Energy Efficient Ethernet on the onboard NIC (e1000e watchdog-hang fix)
  ansible.builtin.command:
    cmd: "ethtool --set-eee {{ base_e1000e_interface }} eee off"
  register: base_eee_result
  changed_when: base_eee_result.rc == 0
  failed_when: >-
    base_eee_result.rc != 0
    and 'Operation not supported' not in base_eee_result.stderr

# Persists the two settings above across reboots and any hotplug
# re-up of this interface -- ethtool itself only ever changes the
# live, in-kernel state, never anything on disk. ifupdown (this host
# uses /etc/network/interfaces, not systemd-networkd) runs post-up
# hooks every time it brings an interface up, which covers both boot
# and a real cable reconnect the same way.
- name: Persist the NIC offload/EEE settings via an ifupdown post-up hook
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    insertafter: '^iface {{ base_e1000e_interface }} inet dhcp$'
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- e1000e watchdog-hang fix"
    # Flush-left, not tab-indented -- ifupdown parses each stanza
    # continuation line on its own merits regardless of indentation;
    # only YAML's own block-scalar indentation rules matter here.
    content: |
      post-up /sbin/ethtool -K {{ base_e1000e_interface }} tso off gso off gro off
      post-up /sbin/ethtool --set-eee {{ base_e1000e_interface }} eee off || true

# A safety net on top of the two fixes above, not a replacement for
# them: forces a full PCI-level unbind/rebind of the NIC the moment the
# kernel logs a NETDEV WATCHDOG event, rather than trusting the
# driver's own internal reset to actually recover -- 2026-09-06 showed
# live that it can get stuck failing that reset for hours. See the
# script's own comment for the full reasoning.
- name: Create e1000e watchdog recovery install directory
  ansible.builtin.file:
    path: "{{ base_e1000e_watchdog_recovery_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the e1000e watchdog recovery script
  ansible.builtin.template:
    src: e1000e-watchdog-recovery.sh.j2
    dest: "{{ base_e1000e_watchdog_recovery_install_dir }}/e1000e-watchdog-recovery.sh"
    owner: root
    group: root
    mode: "0755"
  register: base_e1000e_watchdog_recovery_script

- name: Install the e1000e watchdog recovery systemd unit
  ansible.builtin.template:
    src: e1000e-watchdog-recovery.service.j2
    dest: /etc/systemd/system/e1000e-watchdog-recovery.service
    owner: root
    group: root
    mode: "0644"
  register: base_e1000e_watchdog_recovery_unit

- name: Reload systemd for the e1000e watchdog recovery unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: base_e1000e_watchdog_recovery_unit.changed

- name: Ensure the e1000e watchdog recovery service is enabled and running
  ansible.builtin.systemd_service:
    name: e1000e-watchdog-recovery.service
    enabled: true
    state: >-
      {{ 'restarted' if (base_e1000e_watchdog_recovery_script.changed
         or base_e1000e_watchdog_recovery_unit.changed) else 'started' }}

# Real production outage 2026-09-11/12 (~22:58-07:51 CEST, ~8h53m):
# the homeserver stayed powered on (fans running, lights on) but was
# fully unresponsive -- no SSH, no services -- and needed a manual
# physical reboot. Unlike the two e1000e watchdog-hang incidents above,
# root-caused via `journalctl -k -b -1`: zero kernel-level log entries
# of any kind (no NETDEV WATCHDOG, no panic, no OOM, no hardware
# error) in the entire window the box was actually dead, and no
# graceful-shutdown sequence logged either -- a harder, more total
# freeze than the e1000e bug's own signature, where the kernel stayed
# alive enough to log "Detected Hardware Unit Hang" continuously.
# e1000e-watchdog-recovery.service (above) is powerless against this:
# it only reacts to that one specific kernel message, which never
# appeared. Root cause of *this* freeze is still unknown.
#
# Confirmed live this hardware has a working watchdog timer device
# (/dev/watchdog, /dev/watchdog0/1) that systemd wasn't using at all
# (RuntimeWatchdogUSec=0). Enabling it is a root-cause-agnostic safety
# net, not a fix for a specific bug: if the kernel ever stops
# scheduling entirely (exactly what this outage looks like) and can't
# pet the watchdog, the hardware forces a real reset on its own, no
# software involved -- turns an undetected multi-hour outage requiring
# physical intervention into an automatic reboot within seconds.
# daemon-reexec (not daemon-reload, which only reloads unit files) is
# what actually gets PID1 to pick up a changed system.conf immediately
# rather than waiting for the next boot.
- name: Enable the hardware watchdog via systemd
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?RuntimeWatchdogSec='
    line: "RuntimeWatchdogSec={{ base_watchdog_sec }}"
  register: base_watchdog_config

- name: Reexec systemd to apply the watchdog setting immediately
  ansible.builtin.command:
    cmd: systemctl daemon-reexec
  when: base_watchdog_config.changed

- name: Ensure www-data group exists
  ansible.builtin.group:
    name: www-data
    state: present

- name: Add administrator to www-data group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups:
      - www-data
    append: true

- name: Set the administrator's login shell to zsh
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /usr/bin/zsh

# Pinned to today's HEAD, not a moving branch -- a future update is a
# deliberate SHA bump here, the same way Terraform/base-image versions
# are pinned elsewhere in this repo.
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ admin_user }}/.oh-my-zsh"
    version: 146461f7c6d95f4ba1220559d66eb113418b40a8
    depth: 1

# Pinned to v1.20.0 -- the exact version already in use via Homebrew, so
# migrating off brew doesn't change the prompt's look.
- name: Install Powerlevel10k theme
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "/home/{{ admin_user }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: v1.20.0
    depth: 1

- name: Reclaim ownership of the Oh My Zsh installation
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.oh-my-zsh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    recurse: true
