---
- name: Ensure black HDD mount point exists
  ansible.builtin.file:
    path: "{{ black_hdd_mount_point }}"
    state: directory
    owner: "{{ black_hdd_owner }}"
    group: "{{ black_hdd_group }}"
    mode: "{{ black_hdd_mode }}"

- name: Mount black HDD
  ansible.posix.mount:
    path: "{{ black_hdd_mount_point }}"
    src: "UUID={{ black_hdd_device_uuid }}"
    fstype: "{{ black_hdd_filesystem }}"
    opts: "{{ black_hdd_mount_options }}"
    dump: "0"
    passno: "2"
    state: mounted

- name: Ensure red HDD mount point exists
  ansible.builtin.file:
    path: "{{ red_hdd_mount_point }}"
    state: directory
    owner: "{{ red_hdd_owner }}"
    group: "{{ red_hdd_group }}"
    mode: "{{ red_hdd_mode }}"

- name: Mount red HDD
  ansible.posix.mount:
    path: "{{ red_hdd_mount_point }}"
    src: "UUID={{ red_hdd_device_uuid }}"
    fstype: "{{ red_hdd_filesystem }}"
    opts: "{{ red_hdd_mount_options }}"
    dump: "0"
    passno: "2"
    state: mounted

- name: Create drop-in directories for the services using the HDDs
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ storage_hdd_dependent_services }}"

# With nofail, a service not tied to the mount would write into the empty mount point on the SSD.
- name: Make the services using the HDDs wait for both mounts
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/requires-hdd-mounts.conf"
    content: |
      # Managed by Ansible (home-infra, storage role).
      [Unit]
      RequiresMountsFor={{ black_hdd_mount_point }} {{ red_hdd_mount_point }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ storage_hdd_dependent_services }}"
  register: storage_hdd_dropins

# Reload only: the dependency counts from the next start, and restarting Docker would interrupt Nextcloud.
- name: Reload systemd for the HDD drop-ins
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: storage_hdd_dropins is changed
