---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Enable the daily package list update and unattended upgrade
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Limit unattended upgrades to security updates, without reboots
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Ensure apt-daily-upgrade drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# needrestart honours NEEDRESTART_MODE; manual apt runs keep its interactive default.
- name: Make needrestart only list pending service restarts during unattended upgrades
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.service.d/needrestart-list-only.conf
    content: |
      # Managed by Ansible (home-infra, unattended_upgrades role).
      [Service]
      Environment=NEEDRESTART_MODE=l
    owner: root
    group: root
    mode: "0644"
  register: unattended_upgrades_dropin

- name: Enable the apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: "{{ unattended_upgrades_dropin is changed }}"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
