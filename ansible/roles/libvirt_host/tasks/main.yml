---
- name: Install KVM and libvirt packages
  ansible.builtin.apt:
    name: "{{ libvirt_host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Ensure libvirt is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ libvirt_host_service }}"
    enabled: true
    state: started

- name: Check whether KVM is available
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm_device

- name: Fail when KVM is unavailable
  ansible.builtin.assert:
    that:
      - kvm_device.stat.exists
    fail_msg: >-
      /dev/kvm does not exist. Hardware virtualization may be disabled
      in the BIOS/UEFI or unsupported by the CPU.

# getent fails the task on its own if the key isn't found (same idiom
# deluge's role uses to look up its own service account) -- no need for
# a raw `getent` shell-out plus a separate assert on the return code.
- name: Verify libvirt QEMU runtime user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ libvirt_host_qemu_user }}"

- name: Verify libvirt QEMU runtime group exists
  ansible.builtin.getent:
    database: group
    key: "{{ libvirt_host_qemu_group }}"

- name: Create cloud image cache directory
  ansible.builtin.file:
    path: "{{ libvirt_host_image_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
