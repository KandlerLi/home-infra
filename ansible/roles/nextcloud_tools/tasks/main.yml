---
- name: Configure restricted Nextcloud tools
  when: nextcloud_tools_enabled | bool
  block:
    - name: Check existing Nextcloud app password file
      ansible.builtin.stat:
        path: "{{ nextcloud_tools_app_password_path }}"
      register: nextcloud_tools_app_password_file

    - name: Validate Nextcloud tools configuration
      ansible.builtin.assert:
        that:
          - nextcloud_tools_endpoint_host == "127.0.0.1"
          - nextcloud_tools_endpoint_port | int == 11000
          - nextcloud_tools_http_host == "nextcloud.jkandler.de"
          - nextcloud_tools_username is match('^[A-Za-z0-9_.@-]{1,64}$')
          - >-
            nextcloud_tools_app_password_file.stat.exists
            or (
              nextcloud_tools_app_password | trim | length >= 16
              and nextcloud_tools_app_password | trim != "CHANGE_ME"
            )
          - nextcloud_tools_allowed_root | length >= 1
          - not nextcloud_tools_allowed_root.startswith('/')
          - "'..' not in nextcloud_tools_allowed_root.split('/')"
          - >-
            '\\' not in nextcloud_tools_allowed_root
          - >-
            '"' not in nextcloud_tools_allowed_root
          - nextcloud_tools_max_read_bytes | int >= 1024
          - nextcloud_tools_max_read_bytes | int <= 1048576
          - nextcloud_tools_max_results | int >= 1
          - nextcloud_tools_max_results | int <= 100
          - nextcloud_tools_max_scan_entries | int >= nextcloud_tools_max_results | int
          - nextcloud_tools_max_scan_entries | int <= 2000
          - nextcloud_tools_max_scan_depth | int >= 1
          - nextcloud_tools_max_scan_depth | int <= 8
        fail_msg: >-
          Bootstrap the dedicated Nextcloud account and app password, keep the
          WebDAV upstream on the fixed loopback AIO endpoint, and select one
          relative allowed root folder.
      no_log: true

    - name: Create Nextcloud tools client group
      ansible.builtin.group:
        name: "{{ nextcloud_tools_client_group }}"
        system: true
        state: present

    - name: Create Nextcloud tools service account
      ansible.builtin.user:
        name: "{{ nextcloud_tools_service_user }}"
        group: "{{ nextcloud_tools_client_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create Nextcloud tools directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ nextcloud_tools_install_dir }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ nextcloud_tools_config_dir }}"
          owner: root
          group: "{{ nextcloud_tools_client_group }}"
          mode: "0750"
      loop_control:
        label: "{{ item.path }}"

    - name: Install restricted Nextcloud tools service
      ansible.builtin.copy:
        src: nextcloud_tools_service.py
        dest: "{{ nextcloud_tools_install_dir }}/nextcloud_tools_service.py"
        owner: root
        group: root
        mode: "0755"
      notify: Restart nextcloud tools

    - name: Install Nextcloud app password file
      ansible.builtin.copy:
        content: "{{ nextcloud_tools_app_password | trim }}\n"
        dest: "{{ nextcloud_tools_app_password_path }}"
        owner: "{{ nextcloud_tools_service_user }}"
        group: root
        mode: "0400"
      no_log: true
      notify: Restart nextcloud tools
      when: nextcloud_tools_app_password | trim | length >= 16

    - name: Enforce Nextcloud app password file permissions
      ansible.builtin.file:
        path: "{{ nextcloud_tools_app_password_path }}"
        state: file
        owner: "{{ nextcloud_tools_service_user }}"
        group: root
        mode: "0400"
      notify: Restart nextcloud tools

    - name: Install Nextcloud tools systemd unit
      ansible.builtin.template:
        src: nextcloud-tools.service.j2
        dest: /etc/systemd/system/nextcloud-tools.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart nextcloud tools

    - name: Apply Nextcloud tools service changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure Nextcloud tools is enabled and running
      ansible.builtin.systemd_service:
        name: nextcloud-tools.service
        enabled: true
        state: started

    - name: Wait for restricted Nextcloud tools socket
      ansible.builtin.wait_for:
        path: "{{ nextcloud_tools_socket_path }}"
        state: present
        timeout: 10
