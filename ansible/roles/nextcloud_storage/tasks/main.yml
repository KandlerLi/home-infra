---
- name: Configure Nextcloud-on-k3s storage
  when: nextcloud_storage_enabled | bool
  block:
    # www-data (33) is Debian's fixed uid/gid, the same one the k3s Pod runs as and that owns the live data directory.
    - name: Create Nextcloud test data directory
      ansible.builtin.file:
        path: "{{ nextcloud_storage_test_data_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0750"
