---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy Docker repository configuration
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Configure Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris:
      - "{{ docker_apt_repository }}"
    suites:
      - "{{ docker_apt_distribution }}"
    components:
      - "{{ docker_apt_channel }}"
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

# Empty by default -- every network docker network create makes still
# just gets Docker's own default MTU. Set docker_daemon_config to override
# it (see github-runner.yml, where the runner VM's guest networking sits
# behind an extra libvirt NAT hop on top of the host's own network and
# reset TLS connections downloading a Terraform provider from inside a
# job container, confirmed live -- a classic symptom of an MTU mismatch
# on a nested/virtualized network path).
- name: Install Docker daemon configuration
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  register: docker_daemon_config_file
  when: docker_daemon_config | length > 0

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ docker_service_name }}"
    enabled: true
    state: >-
      {{
        'restarted'
        if docker_daemon_config_file.changed | default(false)
        else 'started'
      }}