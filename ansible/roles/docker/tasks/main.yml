---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy Docker repository configuration
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Configure Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris:
      - "{{ docker_apt_repository }}"
    suites:
      - "{{ docker_apt_distribution }}"
    components:
      - "{{ docker_apt_channel }}"
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

# Empty by default; set docker_daemon_config when a real override is needed again.
- name: Install Docker daemon configuration
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  register: docker_daemon_config_file
  when: docker_daemon_config | length > 0

- name: Remove Docker daemon configuration override
  ansible.builtin.file:
    path: /etc/docker/daemon.json
    state: absent
  register: docker_daemon_config_removed
  when: docker_daemon_config | length == 0

- name: Create Docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Containers started at boot keep the upstream DNS Docker saw, so wait for dhcpcd's nameserver.
- name: Make Docker wait for a nameserver in resolv.conf
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStartPre=-/usr/bin/timeout {{ docker_resolv_conf_wait_seconds }} /bin/sh -c 'until grep -q "^nameserver" /etc/resolv.conf; do sleep 1; done'
    dest: /etc/systemd/system/docker.service.d/wait-for-nameserver.conf
    owner: root
    group: root
    mode: "0644"
  register: docker_wait_for_nameserver_dropin

# Only affects the next start; restarting Docker here would stop every container.
- name: Reload systemd after Docker drop-in change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: docker_wait_for_nameserver_dropin.changed

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ docker_service_name }}"
    enabled: true
    state: >-
      {{
        'restarted'
        if (docker_daemon_config_file.changed | default(false)
            or docker_daemon_config_removed.changed | default(false))
        else 'started'
      }}