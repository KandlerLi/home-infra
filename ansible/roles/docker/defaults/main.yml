---
docker_apt_repository: "https://download.docker.com/linux/debian"
docker_apt_distribution: "trixie"
docker_apt_channel: "stable"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_service_name: docker

# Docker starts anyway after this, so a missing DHCP lease never blocks it for good.
docker_resolv_conf_wait_seconds: 120

# Empty keeps Docker's own defaults.
docker_daemon_config: {}