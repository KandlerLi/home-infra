---
docker_apt_repository: "https://download.docker.com/linux/debian"
docker_apt_distribution: "trixie"
docker_apt_channel: "stable"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_service_name: docker

# See tasks/main.yml -- empty means Docker's own defaults, untouched.
docker_daemon_config: {}