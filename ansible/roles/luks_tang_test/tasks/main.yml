---
- name: Install cryptsetup and Clevis
  ansible.builtin.apt:
    name:
      - cryptsetup
      # Debian 13 split it out of systemd: crypttab's generator and remote-cryptsetup.target.
      - systemd-cryptsetup
      - clevis
      - clevis-luks
      - clevis-systemd
    state: present
    update_cache: true
    cache_valid_time: 86400

# clevis-luks-askpass answers the boot-time prompt of _netdev crypttab entries through Tang.
- name: Enable Clevis's boot-time unlock and the remote cryptsetup target
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - clevis-luks-askpass.path
    - remote-cryptsetup.target

# Only ever an image file this role owns: never point this role at a disk.
- name: Create the test image
  ansible.builtin.command:
    argv:
      - fallocate
      - -l
      - "{{ luks_tang_test_size }}"
      - "{{ luks_tang_test_image }}"
    creates: "{{ luks_tang_test_image }}"

- name: Restrict the test image to root
  ansible.builtin.file:
    path: "{{ luks_tang_test_image }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode

- name: Install the loop device unit for the test image
  ansible.builtin.template:
    src: luks-tang-test-loop.service.j2
    dest: "/etc/systemd/system/{{ luks_tang_test_loop_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: luks_tang_test_loop_unit_file

- name: Create the drop-in directory for the test volume's unlock unit
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ luks_tang_test_cryptsetup_unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The crypttab generator ignores dependency options, so the loop unit is tied in here; also orders shutdown.
- name: Make the test volume's unlock attach the loop device first
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ luks_tang_test_cryptsetup_unit }}.d/loop.conf"
    content: |
      # Managed by Ansible (home-infra, luks_tang_test role).
      [Unit]
      Requires={{ luks_tang_test_loop_unit }}
      After={{ luks_tang_test_loop_unit }}
    owner: root
    group: root
    mode: "0644"
  register: luks_tang_test_dropin

# noauto while inactive: the volume stays closed at boot (see README, "Paused").
- name: Unlock the test volume at boot through Tang
  ansible.builtin.lineinfile:
    path: /etc/crypttab
    regexp: "^{{ luks_tang_test_name }}\\s"
    line: >-
      {{ luks_tang_test_name }} {{ luks_tang_test_loop_device }} none
      luks,_netdev,nofail{{ '' if luks_tang_test_active | bool else ',noauto' }}
    create: true
    owner: root
    group: root
    mode: "0644"
  register: luks_tang_test_crypttab

- name: Ensure the test mount point exists
  ansible.builtin.file:
    path: "{{ luks_tang_test_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Record the test volume's mount in fstab
  ansible.posix.mount:
    path: "{{ luks_tang_test_mount_point }}"
    src: "/dev/mapper/{{ luks_tang_test_name }}"
    fstype: ext4
    opts: "_netdev,nofail{{ '' if luks_tang_test_active | bool else ',noauto' }}"
    dump: "0"
    passno: "0"
    state: present

- name: Close the test volume while the test is paused
  when: not luks_tang_test_active | bool
  block:
    - name: Unmount the test volume
      ansible.posix.mount:
        path: "{{ luks_tang_test_mount_point }}"
        state: unmounted

    # In this order: the volume first, then the loop device under it.
    - name: Close the test volume and detach its loop device
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - "{{ luks_tang_test_cryptsetup_unit }}"
        - "{{ luks_tang_test_loop_unit }}"

- name: Regenerate systemd units from crypttab
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: luks_tang_test_crypttab is changed or luks_tang_test_dropin is changed

- name: Open and mount the test volume
  when: luks_tang_test_active | bool
  block:
    - name: Attach the test image to its loop device
      ansible.builtin.systemd_service:
        name: "{{ luks_tang_test_loop_unit }}"
        state: started
        daemon_reload: "{{ luks_tang_test_loop_unit_file is changed }}"
      when: not ansible_check_mode

    - name: Check whether the test volume is already LUKS
      ansible.builtin.command:
        argv:
          - cryptsetup
          - isLuks
          - "{{ luks_tang_test_loop_device }}"
      register: luks_tang_test_is_luks
      changed_when: false
      failed_when: false

    - name: List the test volume's Clevis bindings
      ansible.builtin.command:
        argv:
          - clevis
          - luks
          - list
          - -d
          - "{{ luks_tang_test_loop_device }}"
      register: luks_tang_test_bindings
      changed_when: false
      failed_when: false
      when: luks_tang_test_is_luks.rc == 0

    - name: Decide whether the recovery passphrase is needed
      ansible.builtin.set_fact:
        luks_tang_test_needs_format: "{{ luks_tang_test_is_luks.rc != 0 }}"
        luks_tang_test_needs_bind: >-
          {{ luks_tang_test_is_luks.rc != 0
             or 'tang' not in (luks_tang_test_bindings.stdout | default('')) }}

    - name: Check that the recovery passphrase was passed in
      ansible.builtin.assert:
        that:
          - luks_tang_test_passphrase | length >= 20
        fail_msg: >-
          Formatting or binding needs the recovery passphrase in
          LUKS_TANG_TEST_PASSPHRASE (from pass, see the role README).
        quiet: true
      when: luks_tang_test_needs_format | bool or luks_tang_test_needs_bind | bool

    - name: Format the test volume with LUKS2
      ansible.builtin.command:
        argv:
          - cryptsetup
          - luksFormat
          - --type
          - luks2
          - --batch-mode
          - --key-file
          - "-"
          - "{{ luks_tang_test_loop_device }}"
        stdin: "{{ luks_tang_test_passphrase }}"
        stdin_add_newline: false
      no_log: true
      changed_when: true
      when: luks_tang_test_needs_format | bool

    - name: Bind the test volume to Tang
      ansible.builtin.command:
        argv:
          - clevis
          - luks
          - bind
          - -y
          - -k
          - "-"
          - -d
          - "{{ luks_tang_test_loop_device }}"
          - tang
          - "{{ {'url': luks_tang_test_tang_url, 'thp': luks_tang_test_tang_thp} | to_json }}"
        stdin: "{{ luks_tang_test_passphrase }}"
        stdin_add_newline: false
      no_log: true
      changed_when: true
      when: luks_tang_test_needs_bind | bool

    - name: Check whether the test volume is open
      ansible.builtin.stat:
        path: "/dev/mapper/{{ luks_tang_test_name }}"
      register: luks_tang_test_mapper

    # Same path as at boot: systemd asks, clevis-luks-askpass answers through Tang.
    - name: Unlock the test volume through its systemd unit
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - "{{ luks_tang_test_cryptsetup_unit }}"
      timeout: 120
      changed_when: true
      when: not luks_tang_test_mapper.stat.exists and not ansible_check_mode

    - name: Check for a filesystem on the test volume
      ansible.builtin.command:
        argv:
          - blkid
          - -o
          - value
          - -s
          - TYPE
          - "/dev/mapper/{{ luks_tang_test_name }}"
      register: luks_tang_test_fs
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Create the filesystem on the test volume
      ansible.builtin.command:
        argv:
          - mkfs.ext4
          - -q
          - -L
          - "{{ luks_tang_test_name }}"
          - "/dev/mapper/{{ luks_tang_test_name }}"
      changed_when: true
      when: not ansible_check_mode and luks_tang_test_fs.stdout == ""

    - name: Mount the test volume
      ansible.posix.mount:
        path: "{{ luks_tang_test_mount_point }}"
        src: "/dev/mapper/{{ luks_tang_test_name }}"
        fstype: ext4
        opts: "_netdev,nofail"
        dump: "0"
        passno: "0"
        state: mounted

    # After a reboot, this file being readable proves the boot-time unlock.
    - name: Write a marker file to the test volume
      ansible.builtin.copy:
        dest: "{{ luks_tang_test_mount_point }}/marker.txt"
        content: "written by luks_tang_test\n"
        owner: root
        group: root
        mode: "0600"
