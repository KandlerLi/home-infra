- name: Validate wireguard peers
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.public_key | default('') | length == 44
      - item.address | default('') is match('^[0-9.]+/32$')
    fail_msg: >-
      Every wireguard_peers entry needs a name, a 44-character base64
      public key and a single /32 address from {{ wireguard_subnet }}.
  loop: "{{ wireguard_peers }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Install WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true

- name: Create the WireGuard config directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

# Generated once on the host and never leaves it. A rebuilt host gets a
# new key, so every client's [Peer] PublicKey has to be updated then --
# accepted over plumbing another secret through Secrets Manager.
- name: Generate the server private key
  ansible.builtin.shell:
    cmd: umask 077 && wg genkey > /etc/wireguard/{{ wireguard_interface }}.key
    creates: /etc/wireguard/{{ wireguard_interface }}.key

- name: Read the server private key
  ansible.builtin.slurp:
    src: /etc/wireguard/{{ wireguard_interface }}.key
  register: wireguard_private_key_file
  no_log: true

- name: Install the WireGuard interface config
  ansible.builtin.template:
    src: wg.conf.j2
    dest: /etc/wireguard/{{ wireguard_interface }}.conf
    owner: root
    group: root
    mode: "0600"
  vars:
    wireguard_private_key: "{{ wireguard_private_key_file.content | b64decode | trim }}"
  register: wireguard_config
  no_log: true

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/60-wireguard.conf
    state: present
    reload: true
  when: wireguard_enabled | bool

- name: Preseed iptables-persistent to skip its install-time prompts
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "iptables-persistent/autosave_{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - v4
    - v6

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

# Inserted at the top of FORWARD, ahead of Docker's policy DROP and
# libvirt's LIBVIRT_FWI reject -- the same placement k3s_ingress_forward
# uses to reach 192.168.101.10.
- name: Allow VPN clients to forward into the LAN and k3s network
  ansible.builtin.iptables:
    state: "{{ 'present' if (wireguard_enabled | bool) else 'absent' }}"
    action: insert
    rule_num: 1
    chain: FORWARD
    in_interface: "{{ wireguard_interface }}"
    source: "{{ wireguard_subnet }}"
    jump: ACCEPT
    comment: "wireguard: forward from {{ wireguard_interface }}"
  register: wireguard_forward_in

- name: Allow return traffic back to VPN clients
  ansible.builtin.iptables:
    state: "{{ 'present' if (wireguard_enabled | bool) else 'absent' }}"
    action: insert
    rule_num: 1
    chain: FORWARD
    out_interface: "{{ wireguard_interface }}"
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    comment: "wireguard: return traffic to {{ wireguard_interface }}"
  register: wireguard_forward_out

# Masquerading means neither the FRITZ!Box nor the k3s VM needs a
# return route for the VPN subnet.
- name: Masquerade VPN client traffic leaving the homeserver
  ansible.builtin.iptables:
    state: "{{ 'present' if (wireguard_enabled | bool) else 'absent' }}"
    table: nat
    chain: POSTROUTING
    source: "{{ wireguard_subnet }}"
    out_interface: "!{{ wireguard_interface }}"
    jump: MASQUERADE
    comment: "wireguard: masquerade {{ wireguard_subnet }}"
  register: wireguard_masquerade

- name: Persist iptables rules across reboots
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: >-
    wireguard_forward_in is changed
    or wireguard_forward_out is changed
    or wireguard_masquerade is changed

- name: Ensure the WireGuard interface is in its desired state
  ansible.builtin.systemd_service:
    name: wg-quick@{{ wireguard_interface }}.service
    enabled: "{{ wireguard_enabled | bool }}"
    state: "{{ 'started' if (wireguard_enabled | bool) else 'stopped' }}"
  register: wireguard_service

# Reload, not restart: wg-quick@'s ExecReload runs `wg syncconf`, which
# applies peer changes without dropping live tunnels -- including the
# one this playbook may itself be running over. Changing Address or
# ListenPort still needs a manual restart of the unit.
- name: Apply changed peers to the running interface
  ansible.builtin.systemd_service:
    name: wg-quick@{{ wireguard_interface }}.service
    state: reloaded
  when:
    - wireguard_enabled | bool
    - wireguard_config is changed
    - wireguard_service is not changed

- name: Derive the server public key
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ wireguard_private_key_file.content | b64decode | trim }}"
  register: wireguard_public_key
  changed_when: false
  when: wireguard_enabled | bool

- name: Show the server public key for client configs
  ansible.builtin.debug:
    msg: "WireGuard server public key: {{ wireguard_public_key.stdout }}"
  when: wireguard_enabled | bool
