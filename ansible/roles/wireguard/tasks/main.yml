# Removes everything the first version of this role set up (ADR 0024,
# superseded by ADR 0025). Each iptables task repeats that version's
# exact rule, comment included, since -C/-D only match an exact rule.

- name: Stop and disable the WireGuard interface
  ansible.builtin.systemd_service:
    name: wg-quick@{{ wireguard_interface }}.service
    enabled: false
    state: stopped
  failed_when: false

- name: Remove the VPN forward rule
  ansible.builtin.iptables:
    state: absent
    chain: FORWARD
    in_interface: "{{ wireguard_interface }}"
    source: "{{ wireguard_subnet }}"
    jump: ACCEPT
    comment: "wireguard: forward from {{ wireguard_interface }}"
  register: wireguard_forward_in

- name: Remove the VPN return-traffic rule
  ansible.builtin.iptables:
    state: absent
    chain: FORWARD
    out_interface: "{{ wireguard_interface }}"
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    comment: "wireguard: return traffic to {{ wireguard_interface }}"
  register: wireguard_forward_out

- name: Remove the VPN masquerade rule
  ansible.builtin.iptables:
    state: absent
    table: nat
    chain: POSTROUTING
    source: "{{ wireguard_subnet }}"
    out_interface: "!{{ wireguard_interface }}"
    jump: MASQUERADE
    comment: "wireguard: masquerade {{ wireguard_subnet }}"
  register: wireguard_masquerade

- name: Persist iptables rules across reboots
  ansible.builtin.command:
    argv:
      - netfilter-persistent
      - save
  changed_when: true
  when: >-
    wireguard_forward_in is changed
    or wireguard_forward_out is changed
    or wireguard_masquerade is changed

# Only the file goes: the runtime ip_forward=1 stays, since Docker and
# libvirt already need and set it themselves.
- name: Remove the WireGuard sysctl file
  ansible.builtin.file:
    path: /etc/sysctl.d/60-wireguard.conf
    state: absent

- name: Remove the WireGuard config and server key
  ansible.builtin.file:
    path: /etc/wireguard
    state: absent

- name: Remove WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: absent
    purge: true
