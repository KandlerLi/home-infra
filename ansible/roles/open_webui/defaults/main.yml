---
open_webui_enabled: false

open_webui_container_name: open-webui
open_webui_image_name: ghcr.io/open-webui/open-webui
open_webui_image_tag: v0.11.0-slim
open_webui_image_digest: >-
  sha256:88da9f0e08b8ada8e40bc6d6291494e2c6775a62d24b67b0cefb74ffee4ce621
open_webui_image: >-
  {{ open_webui_image_name }}:{{ open_webui_image_tag }}@{{ open_webui_image_digest }}

open_webui_bind_address: 127.0.0.1
open_webui_port: 8091
open_webui_public_url: https://ai.jkandler.de
open_webui_data_dir: /var/lib/open-webui
open_webui_restart_policy: unless-stopped
open_webui_memory_limit: 1G
open_webui_cpu_limit: 1.0
open_webui_pids_limit: 256

open_webui_container_user: open-webui-container
open_webui_frontend_network_name: home-agent-frontend
open_webui_provider_base_url: http://home-agent:8000/v1
open_webui_provider_model: home-agent
open_webui_provider_placeholder_key: home-agent-internal
