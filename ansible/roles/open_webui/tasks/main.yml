---
# Host prerequisites for Open WebUI: a dedicated service account and
# its real data directory. This role used to also run Open WebUI
# itself as a Docker container; that's retired now (cut over to
# ai.jkandler.de together with home_agent on 2026-08-30, see
# infra/k3s-apps' modules/open_webui/), but this prerequisite stays --
# the k3s-native copy reads the exact same real data (accounts, chat
# history) over a new NFS export of open_webui_data_dir (see
# nfs_server's exports in group_vars) as this exact service account
# (its uid is hardcoded in k3s-apps' Deployment), so a homeserver
# rebuild still needs Ansible to recreate it identically rather than
# leaving that as undocumented manual state.

- name: Create Open WebUI container account
  ansible.builtin.user:
    name: "{{ open_webui_container_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Read Open WebUI container account
  ansible.builtin.getent:
    database: passwd
    key: "{{ open_webui_container_user }}"

- name: Record Open WebUI runtime identity
  ansible.builtin.set_fact:
    open_webui_container_uid: >-
      {{ ansible_facts.getent_passwd[open_webui_container_user][1] }}

# infra/k3s-apps' Deployment hardcodes run_as_user=995 (and, notably,
# run_as_group=0/root -- not this account's own default group, matching
# how this role has always started the container: "995:0", not
# "995:988") rather than looking the uid up dynamically -- confirmed
# live to match this account when it was created. If a homeserver
# rebuild ever assigned a different uid here, the k3s Pod would
# silently mount the NFS export as the wrong uid instead of failing
# loudly -- catch that drift here instead.
- name: Validate the Open WebUI service account matches what k3s-apps hardcodes
  ansible.builtin.assert:
    that:
      - open_webui_container_uid == "995"
    fail_msg: >-
      open-webui-container's uid drifted from 995, which infra/k3s-apps'
      Deployment hardcodes as run_as_user. Either recreate the account
      with the expected uid, or update k3s-apps' open_webui module and
      re-apply it to match the new value.

- name: Create Open WebUI state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ open_webui_container_user }}"
    group: root
    mode: "0750"
  loop:
    - "{{ open_webui_data_dir }}"
    - "{{ open_webui_data_dir }}/home"
