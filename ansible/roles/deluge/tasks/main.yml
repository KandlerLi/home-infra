---
# Host prerequisites for the k3s-native Deluge: service account, directories and ACLs. See the README.

- name: Create Deluge service group
  ansible.builtin.group:
    name: "{{ deluge_service_group }}"
    system: true
    state: present

- name: Create Deluge service account
  ansible.builtin.user:
    name: "{{ deluge_service_user }}"
    group: "{{ deluge_service_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  register: deluge_service_account

- name: Read Deluge service account
  ansible.builtin.getent:
    database: passwd
    key: "{{ deluge_service_user }}"

- name: Read Deluge service group
  ansible.builtin.getent:
    database: group
    key: "{{ deluge_service_group }}"

- name: Record Deluge runtime identity
  ansible.builtin.set_fact:
    deluge_uid: "{{ ansible_facts.getent_passwd[deluge_service_user][1] }}"
    deluge_gid: "{{ ansible_facts.getent_group[deluge_service_group][1] }}"

# k3s-apps hardcodes PUID 993/PGID 986, so a mismatch must fail here.
- name: Validate the Deluge service account matches what k3s-apps hardcodes
  ansible.builtin.assert:
    that:
      - deluge_uid == "993"
      - deluge_gid == "986"
    fail_msg: >-
      deluge's uid/gid drifted from 993/986, which KandlerLi/k3s-apps'
      Deployment hardcodes as PUID/PGID. Either recreate the account
      with the expected uid/gid, or update k3s-apps' deluge.tf and
      re-apply it to match the new values.

- name: Validate Deluge directories are distinct
  ansible.builtin.assert:
    that:
      - deluge_downloads_dir != deluge_config_dir
    fail_msg: >-
      Keep the downloads and config directories distinct (only
      downloads should ever be exposed to Nextcloud via
      NEXTCLOUD_MOUNT).

- name: Create Deluge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ deluge_service_user }}"
    group: "{{ deluge_service_group }}"
    mode: "{{ item.mode }}"
  loop:
    # downloads is 0755: Nextcloud reads it as www-data, outside the deluge group.
    - path: "{{ deluge_downloads_dir }}"
      mode: "0755"
    - path: "{{ deluge_config_dir }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

# Write access for Nextcloud's www-data, so it can delete files.
- name: Grant Nextcloud's process future write access to new downloads
  ansible.posix.acl:
    path: "{{ deluge_downloads_dir }}"
    entity: "{{ deluge_downloads_nextcloud_user }}"
    etype: user
    permissions: rwx
    default: true
    state: present

# Always changed: a recursive ACL re-applies every run.
- name: Grant Nextcloud's process write access to existing downloads
  ansible.posix.acl:
    path: "{{ deluge_downloads_dir }}"
    entity: "{{ deluge_downloads_nextcloud_user }}"
    etype: user
    permissions: rwx
    recursive: true
    state: present
