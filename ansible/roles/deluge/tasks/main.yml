---
# Host prerequisites for Deluge: a dedicated service account and the
# NFS-exported directories/ACL it needs. This role used to also run
# Deluge itself as a Docker container; that's retired now (see
# infra/k3s-apps, Terraform-managed) but these prerequisites stay --
# the k3s-native copy reads these same two directories over NFS (see
# nfs_server's exports in group_vars) as this exact service account
# (its uid/gid are hardcoded as PUID/PGID in k3s-apps' Deployment), so
# a homeserver rebuild still needs Ansible to recreate them identically
# rather than leaving that as undocumented manual state.

- name: Create Deluge service group
  ansible.builtin.group:
    name: "{{ deluge_service_group }}"
    system: true
    state: present

- name: Create Deluge service account
  ansible.builtin.user:
    name: "{{ deluge_service_user }}"
    group: "{{ deluge_service_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  register: deluge_service_account

- name: Read Deluge service account
  ansible.builtin.getent:
    database: passwd
    key: "{{ deluge_service_user }}"

- name: Read Deluge service group
  ansible.builtin.getent:
    database: group
    key: "{{ deluge_service_group }}"

- name: Record Deluge runtime identity
  ansible.builtin.set_fact:
    deluge_uid: "{{ ansible_facts.getent_passwd[deluge_service_user][1] }}"
    deluge_gid: "{{ ansible_facts.getent_group[deluge_service_group][1] }}"

# infra/k3s-apps' Deployment hardcodes PUID=993/PGID=986 rather than
# looking these up dynamically -- confirmed live to match this account
# when it was created. If a homeserver rebuild ever assigned different
# uid/gid numbers here (e.g. some other system account taking 993
# first), the k3s Deployment would silently write into these
# directories as the wrong uid instead of failing loudly -- catch that
# drift here instead.
- name: Validate the Deluge service account matches what k3s-apps hardcodes
  ansible.builtin.assert:
    that:
      - deluge_uid == "993"
      - deluge_gid == "986"
    fail_msg: >-
      deluge's uid/gid drifted from 993/986, which infra/k3s-apps'
      Deployment hardcodes as PUID/PGID. Either recreate the account
      with the expected uid/gid, or update k3s-apps' deluge.tf and
      re-apply it to match the new values.

- name: Validate Deluge directories are distinct
  ansible.builtin.assert:
    that:
      - deluge_downloads_dir != deluge_config_dir
    fail_msg: >-
      Keep the downloads and config directories distinct (only
      downloads should ever be exposed to Nextcloud via
      NEXTCLOUD_MOUNT).

- name: Create Deluge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ deluge_service_user }}"
    group: "{{ deluge_service_group }}"
    mode: "{{ item.mode }}"
  loop:
    # downloads is 0755, not 0750: Nextcloud's external storage mount
    # reads this directory as its own container's runtime uid
    # (www-data, confirmed live to not be in the deluge group), so
    # "other" needs read+execute to traverse and list it -- this is
    # the one directory the deluge role's own comment above says is
    # meant to be exposed to Nextcloud. Deluge's own default umask
    # already makes the per-torrent subfolders/files it creates
    # world-readable, so this top-level directory was the only thing
    # actually blocking visibility. config stays 0750 (private
    # session state/password hash, never meant to be shared).
    #
    # 0755's "other" bits are read+execute only, not write -- Unix
    # delete/rename needs write on the *containing* directory, so
    # Nextcloud could list and open files but never delete them. Not
    # widened to 0757: that would let any process on the host write
    # here, not just www-data specifically. The ACL tasks below grant
    # write access to exactly that one account instead.
    - path: "{{ deluge_downloads_dir }}"
      mode: "0755"
    - path: "{{ deluge_config_dir }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

# Grants www-data (Nextcloud AIO's own process, see
# deluge_downloads_nextcloud_user above) write access to the downloads
# directory and everything already inside it, so Nextcloud can delete
# files it can already see. "default: true" makes this the default ACL
# too, so any new per-torrent subfolder Deluge creates going forward
# inherits it automatically (Linux propagates a directory's default ACL
# into both the access and default ACL of anything created inside it) --
# the recursive pass below only needs to cover what already exists.
- name: Grant Nextcloud's process future write access to new downloads
  ansible.posix.acl:
    path: "{{ deluge_downloads_dir }}"
    entity: "{{ deluge_downloads_nextcloud_user }}"
    etype: user
    permissions: rwx
    default: true
    state: present

- name: Grant Nextcloud's process write access to existing downloads
  ansible.posix.acl:
    path: "{{ deluge_downloads_dir }}"
    entity: "{{ deluge_downloads_nextcloud_user }}"
    etype: user
    permissions: rwx
    recursive: true
    state: present
