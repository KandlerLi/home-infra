---
monitoring_enabled: false

monitoring_bind_address: 127.0.0.1
monitoring_restart_policy: unless-stopped
monitoring_config_dir: /etc/monitoring
monitoring_data_dir: /var/lib/monitoring

# node_exporter. Every container runs network_mode: host (ADR 0017), so scrapes use 127.0.0.1.
monitoring_node_exporter_container_name: node-exporter
monitoring_node_exporter_image_name: prom/node-exporter
monitoring_node_exporter_image_tag: v1.12.1
monitoring_node_exporter_image_digest: >-
  sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
monitoring_node_exporter_image: >-
  {{ monitoring_node_exporter_image_name }}:{{ monitoring_node_exporter_image_tag }}@{{ monitoring_node_exporter_image_digest }}
monitoring_node_exporter_port: 9100
monitoring_node_exporter_memory_limit: 128M
monitoring_node_exporter_cpu_limit: 0.5
monitoring_node_exporter_pids_limit: 64

# cAdvisor runs as root in its container: it reads /var/lib/docker and the cgroup tree.
monitoring_cadvisor_container_name: cadvisor
monitoring_cadvisor_image_name: ghcr.io/google/cadvisor
monitoring_cadvisor_image_tag: v0.61.0
monitoring_cadvisor_image_digest: >-
  sha256:448ca9b1ce0d3f2eb7563938030908a4b81ddfe959a3fe5e62f691fd4b2cb417
monitoring_cadvisor_image: >-
  {{ monitoring_cadvisor_image_name }}:{{ monitoring_cadvisor_image_tag }}@{{ monitoring_cadvisor_image_digest }}
# Not 8080: that is Nextcloud AIO's admin interface.
monitoring_cadvisor_port: 8081
monitoring_cadvisor_memory_limit: 256M
monitoring_cadvisor_cpu_limit: 0.5
monitoring_cadvisor_pids_limit: 128

# blackbox_exporter covers reachability and certificate expiry in one tool.
monitoring_blackbox_exporter_container_name: blackbox-exporter
monitoring_blackbox_exporter_image_name: prom/blackbox-exporter
monitoring_blackbox_exporter_image_tag: v0.29.1
monitoring_blackbox_exporter_image_digest: >-
  sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
monitoring_blackbox_exporter_image: >-
  {{ monitoring_blackbox_exporter_image_name }}:{{ monitoring_blackbox_exporter_image_tag }}@{{ monitoring_blackbox_exporter_image_digest }}
monitoring_blackbox_exporter_port: 9115
monitoring_blackbox_exporter_memory_limit: 64M
monitoring_blackbox_exporter_cpu_limit: 0.25
monitoring_blackbox_exporter_pids_limit: 32

# Probed for reachability and, for https://, certificate expiry. See ADR 0019.
monitoring_probe_targets:
  - https://nextcloud.jkandler.de/
  - https://www.jkandler.de/
  - http://jkandler.de/
  # Paperless-ngx (ADR 0023): public login page.
  - https://docs.jkandler.de/accounts/login/
  # Authelia's own health endpoint: every forward_auth route and OIDC login depends on it.
  - https://auth.jkandler.de/api/health

# Behind Authelia forward-auth, so probed with http_2xx_or_401. See ADR 0019.
monitoring_probe_targets_authenticated:
  - https://argo.jkandler.de/

# Stalwart's mail ports, each with the blackbox module that speaks its protocol up to a verified TLS handshake.
# Clients use stalwart.jkandler.de (its certificate's only name); port 25 is probed via the MX host jkandler.de.
monitoring_probe_targets_tcp:
  - target: jkandler.de:25
    module: smtp_starttls
  - target: stalwart.jkandler.de:465
    module: smtps
  - target: stalwart.jkandler.de:993
    module: imaps

monitoring_prometheus_container_name: prometheus
monitoring_prometheus_image_name: prom/prometheus
monitoring_prometheus_image_tag: v3.16.0
monitoring_prometheus_image_digest: >-
  sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
monitoring_prometheus_image: >-
  {{ monitoring_prometheus_image_name }}:{{ monitoring_prometheus_image_tag }}@{{ monitoring_prometheus_image_digest }}
monitoring_prometheus_port: 9090
monitoring_prometheus_memory_limit: 512M
monitoring_prometheus_cpu_limit: 1.0
monitoring_prometheus_pids_limit: 128
monitoring_prometheus_scrape_interval: 30s
# Root disk, not the busy HDD; retention bounded by time and size.
monitoring_prometheus_retention_time: 30d
monitoring_prometheus_retention_size: 2GB
monitoring_prometheus_container_user: monitoring-prometheus

# Additional listener for the k3s-native Grafana; only 192.168.101.1 passes validation.
monitoring_prometheus_k3s_bind_address: ""

# Log aggregation: Loki stores, Alloy ships this host's journal; k3s-apps' Alloy pushes pod logs.
monitoring_loki_enabled: false
monitoring_loki_container_name: loki
monitoring_loki_image_name: grafana/loki
monitoring_loki_image_tag: 3.7.10
monitoring_loki_image_digest: >-
  sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
monitoring_loki_image: >-
  {{ monitoring_loki_image_name }}:{{ monitoring_loki_image_tag }}@{{ monitoring_loki_image_digest }}
# Loki has one HTTP listener: 192.168.101.1 when k3s pushes to it, else loopback.
monitoring_loki_bind_address: 127.0.0.1
monitoring_loki_port: 3100
monitoring_loki_grpc_port: 9095
monitoring_loki_memory_limit: 512M
monitoring_loki_cpu_limit: 1.0
monitoring_loki_pids_limit: 256
# Root disk like Prometheus: readable even when an HDD is the thing that failed. Time-based only.
monitoring_loki_retention_period: 720h
monitoring_loki_container_user: monitoring-loki

monitoring_alloy_container_name: alloy
monitoring_alloy_image_name: grafana/alloy
monitoring_alloy_image_tag: v1.22.0
monitoring_alloy_image_digest: >-
  sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
monitoring_alloy_image: >-
  {{ monitoring_alloy_image_name }}:{{ monitoring_alloy_image_tag }}@{{ monitoring_alloy_image_digest }}
monitoring_alloy_port: 12345
monitoring_alloy_memory_limit: 256M
monitoring_alloy_cpu_limit: 0.5
monitoring_alloy_pids_limit: 128
monitoring_alloy_container_user: monitoring-alloy
# How far back Alloy reads on its very first start; afterwards it resumes from its saved position.
monitoring_alloy_journal_max_age: 168h

# A clean switch: listing both Alertmanagers would double-fire every notification.
monitoring_alertmanager_upstream: 127.0.0.1:9093

# Dual-channel alerting (ntfy and email), so one broken channel never means silence. See ADR 0019.

# The topic name is the only secret on public ntfy.sh; set via Secrets Manager.
monitoring_ntfy_url: https://ntfy.sh
monitoring_ntfy_topic: ""

# Translates Alertmanager webhooks into ntfy's format, which neither side does itself. See ADR 0019.
monitoring_ntfy_relay_port: 9096
monitoring_ntfy_relay_service_user: monitoring-ntfy-relay
monitoring_ntfy_relay_install_dir: /usr/local/lib/monitoring/ntfy-relay

# Additional listener for the k3s-native Alertmanager; only 192.168.101.1 passes validation.
monitoring_ntfy_relay_k3s_bind_address: ""

# GitHub's view of the self-hosted runners; needs a read-only PAT from Secrets Manager.
monitoring_github_runner_exporter_enabled: false
monitoring_github_runner_exporter_token: ""
monitoring_github_runner_exporter_owner: KandlerLi
# Generated into group_vars by scripts/sync_github_runner_repositories.py.
monitoring_github_runner_exporter_repositories: []
monitoring_github_runner_exporter_port: 9097
# 8 repos x 2 calls per poll stays far below the API's 5000 requests per hour.
monitoring_github_runner_exporter_poll_seconds: 60
monitoring_github_runner_exporter_service_user: monitoring-github-runner-exporter
monitoring_github_runner_exporter_install_dir: /usr/local/lib/monitoring/github-runner-exporter

# Credentials from ses-relay's Terraform outputs, stored in Secrets Manager.
monitoring_ses_smtp_host: email-smtp.eu-central-1.amazonaws.com
monitoring_ses_smtp_port: 587
monitoring_ses_smtp_username: ""
monitoring_ses_smtp_password: ""
monitoring_ses_from_address: alerts@jkandler.de
monitoring_alert_email: julian.kandler@outlook.com

# Alert thresholds, per ADR 0017's four scope areas.
monitoring_alert_disk_full_percent: 85
monitoring_alert_cert_expiry_days: 14

# Blocky is k3s-native and always on.
monitoring_blocky_enabled: true
monitoring_blocky_http_port: 4000
# A clean switch, like monitoring_alertmanager_upstream.
monitoring_blocky_upstream: "127.0.0.1:{{ monitoring_blocky_http_port }}"

# Blocky's log writer never reconnects; this exporter lets alert_rules catch a silent gap.
monitoring_blocky_postgres_exporter_port: 9187
monitoring_blocky_postgres_exporter_upstream: "192.168.101.10:{{ monitoring_blocky_postgres_exporter_port }}"

# Per-k3s-node visibility; off until k3s-apps' node_exporter module runs.
monitoring_k3s_node_health_enabled: false
# node-exporter uses host networking, so each node's own IP:9100 is the target.
monitoring_k3s_node_exporter_targets:
  - address: 192.168.101.10:9100
    node: k3s-node-1
  - address: 192.168.101.11:9100
    node: k3s-node-2
monitoring_k3s_kube_state_metrics_upstream: 192.168.101.10:8080

# Per-Pod CPU/memory from each kubelet's cAdvisor; the token comes from Secrets Manager.
monitoring_k3s_kubelet_metrics_enabled: false
monitoring_k3s_kubelet_token: ""
monitoring_k3s_kubelet_targets:
  - address: 192.168.101.10:10250
    node: k3s-node-1
  - address: 192.168.101.11:10250
    node: k3s-node-2
# Token and k3s server CA, mounted read-only into Prometheus.
monitoring_k3s_kubelet_dir: "{{ monitoring_data_dir }}/prometheus-k3s"

# Backup freshness: each marker file is only written on success. See backup-freshness.sh.j2.
monitoring_backup_markers:
  # The nextcloud_storage role's restic unit touches it after backup, forget and check.
  - name: nextcloud-restic
    path: /var/lib/nextcloud-restic/last-success
  # The newest world tarball from k3s-apps' Minecraft backup sidecar (minecraft_backup role).
  - name: minecraft-backup
    path: /mnt/red-hdd/minecraft-backup/*.tar.gz
monitoring_backup_k3s_cronjobs:
  - authelia-backup
  - nextcloud-backup
  - paperless-export
  - stalwart-backup
  - vaultwarden-backup
monitoring_backup_max_age_hours: 26
monitoring_backup_textfile_dir: "{{ monitoring_data_dir }}/node-exporter-textfile"
monitoring_backup_freshness_script: /usr/local/lib/monitoring/backup-freshness.sh

# Shared Docker logging bounds.
monitoring_docker_log_options:
  max-size: 10m
  max-file: "3"
