---
monitoring_enabled: false

monitoring_bind_address: 127.0.0.1
monitoring_restart_policy: unless-stopped
monitoring_config_dir: /etc/monitoring
monitoring_data_dir: /var/lib/monitoring

# node_exporter: host health. Needs accurate host filesystem/network
# stats, which only network_mode: host can give it -- the same precedent
# shared_ingress already established, and every container in this role
# uses it uniformly (see tasks/main.yml) so Prometheus's own scrape
# configs can address everything as a plain 127.0.0.1:<port>, with no
# published_ports mapping to configure anywhere in this role.
monitoring_node_exporter_container_name: node-exporter
monitoring_node_exporter_image_name: prom/node-exporter
monitoring_node_exporter_image_tag: v1.12.1
monitoring_node_exporter_image_digest: >-
  sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
monitoring_node_exporter_image: >-
  {{ monitoring_node_exporter_image_name }}:{{ monitoring_node_exporter_image_tag }}@{{ monitoring_node_exporter_image_digest }}
monitoring_node_exporter_port: 9100
monitoring_node_exporter_memory_limit: 128M
monitoring_node_exporter_cpu_limit: 0.5
monitoring_node_exporter_pids_limit: 64

# cAdvisor: container health. Needs read-only access to the Docker socket
# and host cgroup/container filesystems to report per-container metrics --
# the same category of exception nextcloud_aio's own master container
# already has (also a read-only docker.sock mount), not a new one. Runs
# as its image's own default (root inside the container), unlike every
# other role's dedicated unprivileged account: a restricted uid can't read
# /var/lib/docker or the cgroup hierarchy this needs either.
monitoring_cadvisor_container_name: cadvisor
monitoring_cadvisor_image_name: ghcr.io/google/cadvisor
monitoring_cadvisor_image_tag: v0.60.5
monitoring_cadvisor_image_digest: >-
  sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
monitoring_cadvisor_image: >-
  {{ monitoring_cadvisor_image_name }}:{{ monitoring_cadvisor_image_tag }}@{{ monitoring_cadvisor_image_digest }}
# NOT 8080 -- that's Nextcloud AIO's own mastercontainer admin
# interface port (nextcloud_aio's own listener, unrelated to Ansible).
# Confirmed live: cAdvisor's network_mode: host listener silently won
# that port (started later than the mastercontainer, or restarted more
# recently), leaving nothing listening on 0.0.0.0:8080 for AIO's own
# interface at all -- found only when the user needed https://<homeserver>:8080
# again and it was unreachable. cAdvisor itself has no fixed
# "conventional" port to preserve here, unlike e.g. Prometheus/Grafana's
# well-known defaults, so there's no reason to fight AIO for 8080.
monitoring_cadvisor_port: 8081
monitoring_cadvisor_memory_limit: 256M
monitoring_cadvisor_cpu_limit: 0.5
monitoring_cadvisor_pids_limit: 128

# blackbox_exporter: service reachability AND cert/DNS expiry in one tool
# -- its HTTPS probe module reports probe_ssl_earliest_cert_expiry for
# free, so no separate certificate-expiry exporter is needed.
monitoring_blackbox_exporter_container_name: blackbox-exporter
monitoring_blackbox_exporter_image_name: prom/blackbox-exporter
monitoring_blackbox_exporter_image_tag: v0.28.0
monitoring_blackbox_exporter_image_digest: >-
  sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
monitoring_blackbox_exporter_image: >-
  {{ monitoring_blackbox_exporter_image_name }}:{{ monitoring_blackbox_exporter_image_tag }}@{{ monitoring_blackbox_exporter_image_digest }}
monitoring_blackbox_exporter_port: 9115
monitoring_blackbox_exporter_memory_limit: 64M
monitoring_blackbox_exporter_cpu_limit: 0.25
monitoring_blackbox_exporter_pids_limit: 32

# Every URL blackbox_exporter probes with its HTTPS/HTTP module for both
# reachability and (for the https:// ones) certificate expiry.
#
# http://127.0.0.1:8082/ping (shared_ingress's own Traefik loopback
# ping endpoint) used to be included here too, so a Traefik outage
# showed up the same way any other service outage would -- removed
# 2026-09-01, confirmed live as a real, actively-firing false alarm:
# shared_ingress was deleted that same day (Traefik moved to k3s,
# infra/k3s-apps' own modules/ingress/), so nothing has listened on
# this host's own loopback:8082 since, and this target had been
# silently alerting on a service that was never coming back the whole
# time. The public probes below already cover Traefik's own health
# indirectly (they all route through it), so no direct replacement
# was added.
monitoring_probe_targets:
  - https://nextcloud.jkandler.de/
  - https://www.jkandler.de/
  - http://jkandler.de/

# ai.jkandler.de and torrent.jkandler.de sit behind Authelia forward-auth
# since 2026-09-08 (infra/k3s-apps' modules/ingress/configmap.tf) -- the
# Traefik Basic Auth this comment used to describe was retired 2026-09-11
# along with shared_ingress_auth_password(_hash) entirely, once every
# chain had held stable on forward-auth for days (see BACKLOG.md's own
# tracked item on the storage bug that motivated keeping it around as a
# fallback). blackbox has no Authelia session to send, so it still can't
# get an authenticated 2xx here. Probed with the http_2xx_or_401 module
# instead: 401 still proves DNS/TLS/Traefik/the upstream are all up and
# correctly gating access, so real outages (timeouts, 5xx, connection
# refused) still alert -- it just can't distinguish "healthy behind auth"
# from "up but broken behind auth" the way an unauthenticated 2xx check
# can. CAUTION, found live 2026-09-11: Authelia forward-auth actually
# returns 302 (redirect to auth.jkandler.de), not 401, to an
# unauthenticated plain GET -- confirmed via curl against both targets
# below. http_2xx_or_401's valid_status_codes ([200, 401] in
# blackbox.yml.j2) does not include 302, so these two probes likely read
# as failing continuously since the 2026-09-08 cutover. Not yet fixed --
# flagged in PARKED.md rather than silently changed here, since the
# right fix (add 302, or switch approach) is a real decision, not a
# typo.
monitoring_probe_targets_authenticated:
  - https://ai.jkandler.de/healthz
  - https://torrent.jkandler.de/

monitoring_prometheus_container_name: prometheus
monitoring_prometheus_image_name: prom/prometheus
monitoring_prometheus_image_tag: v3.14.0
monitoring_prometheus_image_digest: >-
  sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
monitoring_prometheus_image: >-
  {{ monitoring_prometheus_image_name }}:{{ monitoring_prometheus_image_tag }}@{{ monitoring_prometheus_image_digest }}
monitoring_prometheus_port: 9090
monitoring_prometheus_memory_limit: 512M
monitoring_prometheus_cpu_limit: 1.0
monitoring_prometheus_pids_limit: 128
monitoring_prometheus_scrape_interval: 30s
# Retention is capped by both time and size: the root disk this lives on
# (not the HDD -- small footprint, and the HDD is spinning disk already
# busy with Nextcloud/Deluge I/O) only had 23 GiB free at last check.
monitoring_prometheus_retention_time: 30d
monitoring_prometheus_retention_size: 2GB
monitoring_prometheus_container_user: monitoring-prometheus

# Off by default (loopback only). When set, Prometheus additionally
# listens on this address (Prometheus's own --web.listen-address flag
# can be repeated, confirmed via `prometheus --help`) -- lets the
# k3s-native Grafana (infra/k3s-apps, modules/grafana) reach this as
# its own datasource. 192.168.101.1 (this homeserver's own address on
# the k3s VM's isolated network) is the only value the role's own
# validation allows.
monitoring_prometheus_k3s_bind_address: ""

# Grafana itself is no longer deployed by this role -- it runs as a
# k3s-native copy instead (infra/k3s-apps, modules/grafana). Nothing
# here configures it, so there are no monitoring_grafana_* defaults left:
# monitoring_grafana_admin_user went away 2026-09-10 alongside
# monitoring_grafana_admin_password (which was removed from the
# home-infra/grafana secret entirely -- Grafana's native login is
# disabled at the protocol level, Authelia OIDC only, so it could not be
# typed into anything and had no reason to sit in `pass`).

# Alertmanager itself is no longer deployed by this role -- it runs as
# a k3s-native copy instead (infra/k3s-apps, modules/alertmanager),
# reached by Prometheus over monitoring_alertmanager_upstream below.
# Phase 2 of moving the monitoring stack into k3s: unlike
# monitoring_prometheus_k3s_bind_address/monitoring_ntfy_relay_k3s_bind_address
# above, this is a clean switch, not an addition -- Prometheus's own
# alerting.alertmanagers target list notifies *every* address in it for
# the same firing alert (unlike a scrape target list), so listing both
# the homeserver's own Alertmanager and the k3s-native one
# simultaneously would double-fire every real notification.
# 192.168.101.10:9093 is infra/k3s-apps' own modules/alertmanager
# LoadBalancer Service address (same port number, so no other value is
# needed here) -- confirmed independently first (a real synthetic alert
# reaching both ntfy and SES through the k3s copy) before ever pointing
# Prometheus at it.
monitoring_alertmanager_upstream: 127.0.0.1:9093

# Alerting: deliberately dual-channel (ntfy push + email), both wired to
# every alert rule so one channel being misconfigured doesn't mean
# silence. Prometheus evaluates alert_rules.yml (its own native alerting)
# and forwards firing alerts to Alertmanager, which owns notification
# routing/delivery -- Grafana's built-in alerting was considered instead
# (one fewer container) but dropped: it needs each rule's query/threshold
# expressed in Grafana's own multi-step provisioning schema rather than
# plain PromQL, which is real added risk to get exactly right without a
# live Grafana to verify against, for a resource cost (a single small Go
# binary) that isn't actually worth avoiding.

# ntfy.sh is a public, unauthenticated-by-default service: anyone who
# knows the topic name can read (and post to) it, so the topic itself is
# the only thing standing between "just me" and "anyone who guesses it".
# Set through SOPS to a long random string before the first deploy.
monitoring_ntfy_url: https://ntfy.sh
monitoring_ntfy_topic: ""

# Alertmanager's webhook_configs can't template its POST body, and ntfy
# doesn't understand Alertmanager's payload shape -- posting straight to
# ntfy.sh showed the raw JSON as the notification text (confirmed live).
# This small stdlib-only Python service (no Docker container, matching
# nextcloud_tools/sankey_export's precedent for small standalone logic
# rather than pulling in a new base image) sits between the two:
# Alertmanager posts here, it reformats, then republishes to ntfy's own
# JSON API. Stays on this host even though Alertmanager itself has
# moved into k3s -- reached over the k3s listener below instead.
monitoring_ntfy_relay_port: 9096
monitoring_ntfy_relay_service_user: monitoring-ntfy-relay
monitoring_ntfy_relay_install_dir: /usr/local/lib/monitoring/ntfy-relay

# Off by default (loopback only); set live in inventory now that
# Alertmanager has fully moved into k3s (infra/k3s-apps, modules/
# alertmanager) -- the relay then listens on this address additionally
# (a second server instance in its own thread -- see ntfy_relay.py's
# own comment on LISTEN_HOST_K3S) so the k3s-native Alertmanager can
# reach it, alongside the loopback listener every other consumer on
# this host still uses. 192.168.101.1 (this homeserver's own address on
# the k3s VM's isolated network) is the only value this role's own
# validation allows.
monitoring_ntfy_relay_k3s_bind_address: ""

# SES SMTP credentials come from aws/ses-relay's Terraform outputs, not
# generated here -- see that repo's README for the exact values to copy
# into SOPS. eu-central-1 matches this workspace's other AWS roots'
# default region.
monitoring_ses_smtp_host: email-smtp.eu-central-1.amazonaws.com
monitoring_ses_smtp_port: 587
monitoring_ses_smtp_username: ""
monitoring_ses_smtp_password: ""
monitoring_ses_from_address: alerts@jkandler.de
monitoring_alert_email: julian.kandler@outlook.com

# Alert thresholds, per ADR 0017's four scope areas.
monitoring_alert_disk_full_percent: 85
monitoring_alert_cert_expiry_days: 14

# Blocky is fully k3s-native now (infra/k3s-apps, modules/blocky/) --
# the home-infra blocky role these were originally a default()-guarded
# cross-role reference into is gone entirely, deleted once the cutover
# was confirmed live (2026-08-31/09-01). No role in this repo owns
# Blocky's own existence any more, so monitoring_blocky_enabled is a
# plain, unconditional true rather than a reference to a variable that
# no longer has anywhere to come from. monitoring_blocky_postgres_port/
# _database/_user/_password (a matching default()-guarded set) were
# already dead before this cleanup -- Grafana's own blocky-postgresql
# datasource is provisioned by infra/k3s-apps' own modules/grafana
# (templates/datasources.yaml.tftpl) now, not by anything reading
# these -- removed rather than carried forward unused.
monitoring_blocky_enabled: true
monitoring_blocky_http_port: 4000
# A clean switch, not an addition -- same reasoning and shape as
# monitoring_alertmanager_upstream above (a scrape target list doesn't
# double-count the way alerting.alertmanagers would, but scraping both
# the homeserver's own Blocky and infra/k3s-apps' own one at once would
# still be actively misleading: two independent, identically-labeled
# series for what's really one logical service). Stays pointed at the
# homeserver's own address until infra/k3s-apps' own modules/blocky is
# confirmed handling real production DNS traffic, not just verified
# reachable internally -- switching this before that would make
# monitoring blind to the instance actually serving the LAN.
monitoring_blocky_upstream: "127.0.0.1:{{ monitoring_blocky_http_port }}"
