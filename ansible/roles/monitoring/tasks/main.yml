---
- name: Configure monitoring
  when: monitoring_enabled | bool
  block:
    - name: Validate monitoring configuration
      ansible.builtin.assert:
        that:
          - monitoring_bind_address == "127.0.0.1"
          - monitoring_ntfy_topic | trim | length >= 20
          - monitoring_ntfy_topic | trim != "CHANGE_ME"
          - monitoring_ses_smtp_username | trim | length > 0
          - monitoring_ses_smtp_username | trim != "CHANGE_ME"
          - monitoring_ses_smtp_password | trim | length > 0
          - monitoring_ses_smtp_password | trim != "CHANGE_ME"
          - monitoring_probe_targets | length > 0
          - monitoring_ntfy_relay_port | int > 1024
          # Additive, not a switch -- Prometheus supports repeating
          # --web.listen-address, so this only ever adds a second one,
          # never replaces the loopback default every scrape target
          # here still needs. 192.168.101.1 is this homeserver's own
          # address on the k3s VM's isolated network, never 0.0.0.0
          # (Prometheus's API has no auth of its own).
          - >-
            monitoring_prometheus_k3s_bind_address | length == 0
            or monitoring_prometheus_k3s_bind_address == "192.168.101.1"
          # Same additive reasoning, for the ntfy relay's own second
          # listener -- see ntfy_relay.py's own LISTEN_HOST_K3S comment.
          - >-
            monitoring_ntfy_relay_k3s_bind_address | length == 0
            or monitoring_ntfy_relay_k3s_bind_address == "192.168.101.1"
          # A clean switch, not an addition -- see this variable's own
          # comment in defaults/main.yml for why listing both
          # Alertmanagers at once would be actively harmful here.
          - >-
            monitoring_alertmanager_upstream == "127.0.0.1:9093"
            or monitoring_alertmanager_upstream == "192.168.101.10:9093"
          # Same clean-switch reasoning as monitoring_alertmanager_upstream
          # above -- see this variable's own comment in defaults/main.yml.
          - >-
            monitoring_blocky_upstream == "127.0.0.1:" ~ monitoring_blocky_http_port
            or monitoring_blocky_upstream == "192.168.101.10:" ~ monitoring_blocky_http_port
        fail_msg: >-
          Configure monitoring_ntfy_topic and the SES SMTP credentials
          (from aws/ses-relay's outputs) through SOPS before the first
          deploy, keep monitoring_prometheus_k3s_bind_address and
          monitoring_ntfy_relay_k3s_bind_address empty or pinned to the
          k3s VM's isolated network address, and keep
          monitoring_alertmanager_upstream and monitoring_blocky_upstream
          each pointed at either the homeserver's own instance or
          infra/k3s-apps' one, never both.
      no_log: true

    - name: Create monitoring service accounts
      ansible.builtin.user:
        name: "{{ item }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      loop:
        - "{{ monitoring_prometheus_container_user }}"

    # getent does NOT accumulate looped keys into
    # ansible_facts.getent_passwd -- each iteration replaces it. Do not
    # re-loop this; see ADR 0019's own Update section.
    - name: Read Prometheus service account
      ansible.builtin.getent:
        database: passwd
        key: "{{ monitoring_prometheus_container_user }}"

    - name: Record Prometheus runtime identity
      ansible.builtin.set_fact:
        monitoring_prometheus_uid: >-
          {{ ansible_facts.getent_passwd[monitoring_prometheus_container_user][1] }}

    # Not a container, so no UID needs recording -- systemd's User=/Group=
    # take a plain username directly, unlike docker_container's user:
    # parameter.
    - name: Create ntfy relay service account
      ansible.builtin.user:
        name: "{{ monitoring_ntfy_relay_service_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    # A dedicated task, ahead of the shared loop below -- see ADR 0019's
    # own Update section for the EACCES this avoids.
    - name: Create monitoring data root directory
      ansible.builtin.file:
        path: "{{ monitoring_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create monitoring directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0750"
      loop:
        - path: "{{ monitoring_config_dir }}/blackbox"
          owner: root
        - path: "{{ monitoring_data_dir }}/prometheus"
          owner: "{{ monitoring_prometheus_container_user }}"
        - path: "{{ monitoring_data_dir }}/ntfy-relay"
          owner: "{{ monitoring_ntfy_relay_service_user }}"
      loop_control:
        label: "{{ item.path }}"

    # A dedicated task, not the loop above: that loop's shared 0750 mode
    # is fine for directories only their own owner needs to enter, but
    # this one is root-owned and must be readable by the relay's own
    # (different) service account to execute the script inside it --
    # same reasoning as nextcloud_tools_install_dir's 0755.
    - name: Create ntfy relay install directory
      ansible.builtin.file:
        path: "{{ monitoring_ntfy_relay_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Grafana and Alertmanager now run as k3s-native copies (infra/
    # k3s-apps) instead of Docker containers on this host -- actively
    # removed here, not just stopped, so an unrelated site.yml run can
    # never silently resurrect them. See docs/home-infra-ai-context's
    # current-state.md ("k3s learning cluster") for the full cutover
    # history.
    - name: Remove retired local Grafana/Alertmanager state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ monitoring_config_dir }}/grafana"
        - "{{ monitoring_data_dir }}/grafana"
        - "{{ monitoring_data_dir }}/secrets"
        - "{{ monitoring_config_dir }}/alertmanager.yml"
        - "{{ monitoring_data_dir }}/alertmanager"

    - name: Install ntfy topic file for the relay
      ansible.builtin.copy:
        content: "{{ monitoring_ntfy_topic }}"
        dest: "{{ monitoring_data_dir }}/ntfy-relay/ntfy_topic"
        owner: "{{ monitoring_ntfy_relay_service_user }}"
        group: "{{ monitoring_ntfy_relay_service_user }}"
        mode: "0400"
      no_log: true

    - name: Install ntfy relay script
      ansible.builtin.copy:
        src: ntfy_relay.py
        dest: "{{ monitoring_ntfy_relay_install_dir }}/ntfy_relay.py"
        owner: root
        group: root
        mode: "0644"
      register: monitoring_ntfy_relay_script

    - name: Install ntfy relay systemd unit
      ansible.builtin.template:
        src: ntfy-relay.service.j2
        dest: /etc/systemd/system/ntfy-relay.service
        owner: root
        group: root
        mode: "0644"
      register: monitoring_ntfy_relay_unit

    - name: Reload systemd for the ntfy relay unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: monitoring_ntfy_relay_unit.changed

    - name: Ensure ntfy relay is enabled and running
      ansible.builtin.systemd_service:
        name: ntfy-relay.service
        enabled: true
        state: >-
          {{ 'restarted' if (monitoring_ntfy_relay_script.changed
             or monitoring_ntfy_relay_unit.changed) else 'started' }}

    - name: Verify ntfy relay is ready on host loopback
      ansible.builtin.uri:
        url: "http://{{ monitoring_bind_address }}:{{ monitoring_ntfy_relay_port }}/healthz"
        method: GET
        status_code: 200
      register: monitoring_ntfy_relay_health
      retries: 10
      delay: 2
      until: monitoring_ntfy_relay_health.status == 200
      when: not ansible_check_mode

    - name: Install Prometheus scrape configuration
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_config_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      register: monitoring_prometheus_config

    - name: Install Prometheus alert rules
      ansible.builtin.template:
        src: alert_rules.yml.j2
        dest: "{{ monitoring_config_dir }}/alert_rules.yml"
        owner: root
        group: root
        mode: "0644"
      register: monitoring_alert_rules_config

    - name: Install blackbox_exporter configuration
      ansible.builtin.template:
        src: blackbox.yml.j2
        dest: "{{ monitoring_config_dir }}/blackbox/blackbox.yml"
        owner: root
        group: root
        mode: "0644"
      register: monitoring_blackbox_config

    # Pulling by digest alone, not the shared name:tag@digest -- see ADR
    # 0019's own Update section for the "changed" every run this avoids.
    - name: Pull pinned monitoring images
      community.docker.docker_image:
        name: "{{ item.name }}@{{ item.digest }}"
        source: pull
        state: present
      loop:
        - name: "{{ monitoring_node_exporter_image_name }}"
          digest: "{{ monitoring_node_exporter_image_digest }}"
        - name: "{{ monitoring_cadvisor_image_name }}"
          digest: "{{ monitoring_cadvisor_image_digest }}"
        - name: "{{ monitoring_blackbox_exporter_image_name }}"
          digest: "{{ monitoring_blackbox_exporter_image_digest }}"
        - name: "{{ monitoring_prometheus_image_name }}"
          digest: "{{ monitoring_prometheus_image_digest }}"
      loop_control:
        label: "{{ item.name }}@{{ item.digest }}"

    - name: Ensure node_exporter container is running
      community.docker.docker_container:
        name: "{{ monitoring_node_exporter_container_name }}"
        image: "{{ monitoring_node_exporter_image }}"
        state: started
        restart_policy: "{{ monitoring_restart_policy }}"
        network_mode: host
        pid_mode: host
        read_only: true
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        memory: "{{ monitoring_node_exporter_memory_limit }}"
        cpus: "{{ monitoring_node_exporter_cpu_limit }}"
        pids_limit: "{{ monitoring_node_exporter_pids_limit }}"
        volumes:
          - /:/host:ro,rslave
          - /proc:/host/proc:ro
          - /sys:/host/sys:ro
        command:
          - --path.rootfs=/host
          - --path.procfs=/host/proc
          - --path.sysfs=/host/sys
          - --web.listen-address={{ monitoring_bind_address }}:{{ monitoring_node_exporter_port }}
          - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
        log_driver: json-file
        log_options: "{{ monitoring_docker_log_options }}"

    # Runs as the image's own default (root inside the container), not
    # a dedicated unprivileged account -- a restricted uid can't read
    # /var/lib/docker or the cgroup hierarchy this needs.
    # --docker_only=true keeps it scoped to container metrics.
    - name: Ensure cAdvisor container is running
      community.docker.docker_container:
        name: "{{ monitoring_cadvisor_container_name }}"
        image: "{{ monitoring_cadvisor_image }}"
        state: started
        restart_policy: "{{ monitoring_restart_policy }}"
        network_mode: host
        privileged: false
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        memory: "{{ monitoring_cadvisor_memory_limit }}"
        cpus: "{{ monitoring_cadvisor_cpu_limit }}"
        pids_limit: "{{ monitoring_cadvisor_pids_limit }}"
        volumes:
          - /:/rootfs:ro
          - /var/run:/var/run:ro
          - /sys:/sys:ro
          - /var/lib/docker:/var/lib/docker:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
        command:
          - --docker_only=true
          - --listen_ip={{ monitoring_bind_address }}
          - --port={{ monitoring_cadvisor_port }}
          - --disable_metrics=percpu,sched,tcp,udp,resctrl,cpu_topology,advtcp,hugetlb,referenced_memory
        # Overrides the image's own baked-in HEALTHCHECK (probes
        # "localhost", ambiguous under network_mode: host) -- see ADR
        # 0019 for the IPv6-first wget failure this avoids.
        healthcheck:
          test:
            - CMD
            - wget
            - --spider
            - --quiet
            - http://{{ monitoring_bind_address }}:{{ monitoring_cadvisor_port }}/healthz
          interval: 30s
          timeout: 5s
          retries: 5
        log_driver: json-file
        log_options: "{{ monitoring_docker_log_options }}"

    - name: Ensure blackbox_exporter container is running
      community.docker.docker_container:
        name: "{{ monitoring_blackbox_exporter_container_name }}"
        image: "{{ monitoring_blackbox_exporter_image }}"
        state: started
        recreate: "{{ monitoring_blackbox_config.changed }}"
        restart_policy: "{{ monitoring_restart_policy }}"
        network_mode: host
        read_only: true
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        memory: "{{ monitoring_blackbox_exporter_memory_limit }}"
        cpus: "{{ monitoring_blackbox_exporter_cpu_limit }}"
        pids_limit: "{{ monitoring_blackbox_exporter_pids_limit }}"
        volumes:
          - "{{ monitoring_config_dir }}/blackbox/blackbox.yml:/config/blackbox.yml:ro"
        command:
          - --config.file=/config/blackbox.yml
          - --web.listen-address={{ monitoring_bind_address }}:{{ monitoring_blackbox_exporter_port }}
        log_driver: json-file
        log_options: "{{ monitoring_docker_log_options }}"

    - name: Ensure Prometheus container is running
      community.docker.docker_container:
        name: "{{ monitoring_prometheus_container_name }}"
        image: "{{ monitoring_prometheus_image }}"
        state: started
        recreate: >-
          {{ monitoring_prometheus_config.changed
             or monitoring_alert_rules_config.changed }}
        restart_policy: "{{ monitoring_restart_policy }}"
        network_mode: host
        user: "{{ monitoring_prometheus_uid }}:0"
        read_only: true
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        memory: "{{ monitoring_prometheus_memory_limit }}"
        cpus: "{{ monitoring_prometheus_cpu_limit }}"
        pids_limit: "{{ monitoring_prometheus_pids_limit }}"
        volumes:
          - "{{ monitoring_config_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          - "{{ monitoring_config_dir }}/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro"
          - "{{ monitoring_data_dir }}/prometheus:/prometheus"
        tmpfs:
          - /tmp:rw,noexec,nosuid,nodev,size=32m
        comparisons:
          volumes: strict
        command: >-
          {{
            [
              '--config.file=/etc/prometheus/prometheus.yml',
              '--storage.tsdb.path=/prometheus',
              '--storage.tsdb.retention.time=' + monitoring_prometheus_retention_time,
              '--storage.tsdb.retention.size=' + monitoring_prometheus_retention_size,
              '--web.listen-address=' + monitoring_bind_address + ':' + monitoring_prometheus_port | string
            ]
            + (
              [
                '--web.listen-address=' + monitoring_prometheus_k3s_bind_address
                + ':' + monitoring_prometheus_port | string
              ]
              if monitoring_prometheus_k3s_bind_address | length > 0
              else []
            )
          }}
        healthcheck:
          test:
            - CMD
            - wget
            - --spider
            - --quiet
            - http://127.0.0.1:9090/-/ready
          interval: 30s
          timeout: 5s
          retries: 5
          start_period: 30s
        log_driver: json-file
        log_options: "{{ monitoring_docker_log_options }}"

    - name: Verify Prometheus is ready on host loopback
      ansible.builtin.uri:
        url: "http://{{ monitoring_bind_address }}:{{ monitoring_prometheus_port }}/-/ready"
        method: GET
        status_code: 200
      register: monitoring_prometheus_ready
      retries: 60
      delay: 2
      until: monitoring_prometheus_ready.status == 200
      when: not ansible_check_mode
