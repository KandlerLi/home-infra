---
# Generate a new Nextcloud app password token via `occ`, extract it from
# the command output, and validate its shape before it's trusted. Used
# by sankey-export.yml, with its `nextcloud_tools_*` variable names
# shadowed for that account -- this repo's own nextcloud-tools.yml/
# rotate-nextcloud-tools-token.yml playbooks (the original callers this
# file's variable naming comes from) are gone now, since the account
# they bootstrapped belonged to home-infra's own nextcloud_tools role,
# retired once home_agent's Docker container (its only client) was
# retired too. infra/k3s-apps' own dedicated Nextcloud app password
# (independent of either) was generated by hand instead, see that
# repo's modules/home_agent/secret.tf.
#
# Sets `nextcloud_tools_generated_app_password`. Callers that only want this
# to run conditionally put `when:` on the `include_tasks` task itself --
# when skipped, `default()` on the consuming side falls back correctly,
# since none of these tasks run at all.

- name: Generate Nextcloud app password
  community.docker.docker_container_exec:
    container: "{{ nextcloud_tools_nextcloud_container }}"
    user: www-data
    argv:
      - php
      - occ
      - user:auth-tokens:add
      - --no-interaction
      - "--name={{ nextcloud_tools_token_name }}"
      - "{{ nextcloud_tools_username }}"
  register: nextcloud_tools_generated_token
  no_log: true

- name: Record generated Nextcloud app password for this apply
  ansible.builtin.set_fact:
    nextcloud_tools_generated_app_password: >-
      {{
        nextcloud_tools_generated_token.stdout_lines
        | last
        | trim
        | default('')
      }}
  no_log: true

- name: Validate generated Nextcloud app password
  ansible.builtin.assert:
    that:
      - nextcloud_tools_generated_app_password | length >= 16
      - >-
        nextcloud_tools_generated_app_password
        is match('^[A-Za-z0-9]{64,128}$')
    fail_msg: Nextcloud did not return a usable app password.
  no_log: true
