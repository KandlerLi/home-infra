---
# Shared by nextcloud-tools.yml (bootstrap) and rotate-nextcloud-tools-token.yml
# (rotation): generate a new Nextcloud app password token via `occ`, extract
# it from the command output, and validate its shape before it's trusted.
#
# Sets `nextcloud_tools_generated_app_password`. Callers that only want this
# to run conditionally (bootstrap skips it when a valid password or its file
# already exists; rotation always generates) put `when:` on the
# `include_tasks` task itself -- when skipped, `default()` on the consuming
# side falls back correctly, since none of these tasks run at all.

- name: Generate Nextcloud app password
  community.docker.docker_container_exec:
    container: "{{ nextcloud_tools_nextcloud_container }}"
    user: www-data
    argv:
      - php
      - occ
      - user:auth-tokens:add
      - --no-interaction
      - "--name={{ nextcloud_tools_token_name }}"
      - "{{ nextcloud_tools_username }}"
  register: nextcloud_tools_generated_token
  no_log: true

- name: Record generated Nextcloud app password for this apply
  ansible.builtin.set_fact:
    nextcloud_tools_generated_app_password: >-
      {{
        nextcloud_tools_generated_token.stdout_lines
        | last
        | trim
        | default('')
      }}
  no_log: true

- name: Validate generated Nextcloud app password
  ansible.builtin.assert:
    that:
      - nextcloud_tools_generated_app_password | length >= 16
      - >-
        nextcloud_tools_generated_app_password
        is match('^[A-Za-z0-9]{64,128}$')
    fail_msg: Nextcloud did not return a usable app password.
  no_log: true
