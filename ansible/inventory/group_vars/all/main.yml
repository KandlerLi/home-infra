---
shared_ingress_acme_email: "julian.kandler@outlook.com"
nextcloud_aio_reverse_proxy_enabled: true

# The homeserver's address on the k3s network, so k3s reaches Apache. Change together with shared_ingress_nextcloud_upstream.
nextcloud_aio_apache_ip_binding: 192.168.101.1
# Must match nextcloud_aio_apache_ip_binding.
shared_ingress_nextcloud_upstream: http://192.168.101.1:11000

# Lets the k3s-native home_agent reach home_tools_service over TCP, besides the Unix socket.
home_agent_tools_tcp_bind_address: 192.168.101.1

# shared_ingress is retired: k3s Traefik serves 80/443 via k3s_ingress_forward. The shared_ingress_* variables are leftovers.
k3s_ingress_forward_enabled: true

shared_ingress_enabled: false
shared_ingress_start: true
shared_ingress_apex_redirect_enabled: true
shared_ingress_agent_enabled: true
shared_ingress_agent_upstream: http://192.168.101.10:80
shared_ingress_open_webui_enabled: true
shared_ingress_open_webui_upstream: http://192.168.101.10:80

shared_ingress_deluge_enabled: true
shared_ingress_deluge_upstream: http://192.168.101.10:80

# Exports for k3s workloads on k3s-node-1 (192.168.101.10), nothing else under /mnt/black-hdd.
nfs_server_enabled: true
nfs_server_exports:
  - path: /mnt/black-hdd/downloads
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  - path: /mnt/black-hdd/deluge-config
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  # Open WebUI's live SQLite data: never two writers at once.
  - path: /var/lib/open-webui
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  # Target of k3s-apps' Authelia backup CronJob: see the authelia_backup role.
  - path: /mnt/red-hdd/authelia-backup
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  # Paperless-ngx (ADR 0023): see the paperless_storage role.
  - path: /mnt/black-hdd/paperless-media
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  - path: /mnt/red-hdd/paperless-export
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash

# Deluge's downloads as Nextcloud external storage, for the personal account below only.
nextcloud_aio_mount_dir: /mnt/black-hdd/downloads
# The Authelia-provisioned (user_oidc) account; the old native admin account was migrated onto it and retired.
nextcloud_aio_mount_applicable_user: c3d555d14a9e6f55acce409da0bf8fa03e31deff7b9d20c951aecfcf15832cd1

# Needs authelia_oidc_nextcloud_client_secret in Secrets Manager: see the nextcloud_aio README.
nextcloud_aio_oidc_enabled: true

# Needs the home-infra/monitoring secrets in Secrets Manager: see the monitoring README.
monitoring_enabled: true
shared_ingress_grafana_enabled: true
# Additive listener for the k3s-native Grafana; Prometheus itself stays on this host.
monitoring_prometheus_k3s_bind_address: 192.168.101.1
shared_ingress_grafana_upstream: http://192.168.101.10:80

# Additive listener for the k3s-native Alertmanager; the ntfy relay stays on this host.
monitoring_ntfy_relay_k3s_bind_address: 192.168.101.1
# The k3s-native Alertmanager only: listing both would double-fire every notification.
monitoring_alertmanager_upstream: 192.168.101.10:9093

# Scrapes the k3s nodes' node-exporter and kube-state-metrics (k3s-apps' node_exporter module).
monitoring_k3s_node_health_enabled: true

shared_ingress_home_enabled: true
shared_ingress_home_upstream: http://192.168.101.10:80

# Blocky runs in k3s (ADR 0020); its Postgres password lives in Secrets Manager for k3s-apps.
monitoring_blocky_upstream: 192.168.101.10:4000

# The LAN's ULA prefix, which never rotates; it is the relay's access boundary. See the role README.
blocky_ipv6_relay_enabled: true
blocky_ipv6_relay_lan_prefix: fd71:c3c8:f74d::/64

# Daily backup of Deluge config and Open WebUI data: see the aux_backup role.
aux_backup_enabled: true

# Destination side only; k3s-apps' CronJob does the backup. See the authelia_backup role.
authelia_backup_enabled: true

# Host side of Paperless-ngx (ADR 0023): see the paperless_storage role.
paperless_storage_enabled: true
