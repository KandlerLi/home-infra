---
github_runner_github_owner: "KandlerLi"
# github_runner_github_repositories is generated -- see
# ansible/inventory/group_vars/all/github_runner_repositories.yml

shared_ingress_acme_email: "julian.kandler@outlook.com"
nextcloud_aio_reverse_proxy_enabled: true
shared_ingress_enabled: true
shared_ingress_start: true
shared_ingress_apex_redirect_enabled: true
shared_ingress_agent_enabled: true
home_agent_enabled: true
home_agent_frontend_network_enabled: true
open_webui_enabled: true
shared_ingress_open_webui_enabled: true
nextcloud_tools_enabled: true
nextcloud_tools_allowed_root: Shared/AI Workspace

# Deluge: private deploy, Nextcloud wiring, and the guarded publish-deluge.yml
# run are all independently verified live (login-bug fix confirmed via a
# direct JSON-API check, torrent.jkandler.de confirmed to gate on the real
# Basic Auth credential). Persisted here so a full site.yml converge keeps
# both enabled instead of tearing the public route back down.
deluge_enabled: true
shared_ingress_deluge_enabled: true

# Nextcloud external storage for Deluge's downloads folder, visible only to
# the personal account below (not a service account) -- confirmed working
# privately (torrent + default-password bug both verified fixed) before
# wiring this up.
nextcloud_aio_mount_dir: /mnt/black-hdd/downloads
nextcloud_aio_mount_applicable_user: admin
sankey_export_enabled: true
# Nextcloud shares don't preserve the sharer's own path for the recipient
# -- confirmed live via `occ share:list --recipient=sankey-export`, which
# shows source-path "/admin/files/Documents/Finanzen" but target-path
# "/Shared/Finanzen". The dedicated account's WebDAV root therefore sees
# it at Shared/Finanzen, not Documents/Finanzen (same Shared/ prefix
# nextcloud_tools_allowed_root already has to account for above).
sankey_export_remote_dir: Shared/Finanzen