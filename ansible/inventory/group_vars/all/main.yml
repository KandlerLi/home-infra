---
shared_ingress_acme_email: "julian.kandler@outlook.com"
nextcloud_aio_reverse_proxy_enabled: true

# First step of migrating home_agent + open_webui + nextcloud_tools to
# the k3s cluster: nextcloud_tools is moving into the cluster alongside
# home_agent (as a sidecar sharing a Unix socket, preserving its current
# trust shape), which means it needs to reach Nextcloud AIO's Apache
# from inside the k3s VM instead of on loopback. AIO's mastercontainer
# only accepts one APACHE_IP_BINDING value at a time, so this is a
# switch, not an addition -- 192.168.101.1 is this homeserver's own
# address on the k3s VM's isolated libvirt NAT network, reachable from
# both this host and that one VM, same trust boundary shared_ingress's
# own home/deluge upstream exceptions already rely on (see both roles'
# widened validation for the full reasoning). shared_ingress's own
# nextcloud_upstream below must move in lockstep, or it loses its route
# to Apache entirely. Applying this needs the guarded
# MIGRATE_NEXTCLOUD_INGRESS confirmation flow, same as the original
# Docker->shared_ingress cutover.
#
# nextcloud_tools/home_agent themselves haven't moved into k3s yet --
# this proves the network path works with them still on this host,
# before adding that variable too.
nextcloud_aio_apache_ip_binding: 192.168.101.1
# Must move in lockstep with nextcloud_aio_apache_ip_binding above --
# see its comment for the full reasoning.
shared_ingress_nextcloud_upstream: http://192.168.101.1:11000

# Second half of the same migration step: home_tools_service can't move
# into the k3s cluster the way nextcloud_tools does (it reports this
# homeserver's own hardware, not something that makes sense to run
# anywhere else), so home_agent reaches it over this TCP listener
# instead once home_agent itself runs in the cluster. Purely additive --
# the Unix socket every other consumer keeps using is unaffected. See
# home_agent's own README/role comments for the full reasoning.
home_agent_tools_tcp_bind_address: 192.168.101.1

# false as of 2026-09-01: shared_ingress itself moved to k3s
# (infra/k3s-apps' own modules/ingress/), reached via the new
# k3s_ingress_forward DNAT relay instead of this role's own container.
# shared_ingress_enabled gates the whole role behind a `when:` -- a
# pure skip-guard, not a real toggle -- so this is the only thing
# standing between the next routine site.yml apply (for any unrelated
# change) and silently resurrecting the container that was
# deliberately stopped for the cutover, exactly the near-miss already
# documented for open_webui's own reshape. The container itself was
# stopped via ansible/playbooks/shared-ingress-k3s-cutover.yml, not by
# this flag -- flipping it back to true alone would NOT restart
# anything by itself, only re-arm the role's own tasks for the next
# apply. The role/container/host prerequisites stay as-is, not yet
# reshaped or deleted -- deferred to a real bake-in period, the same
# "prove it, then remove the old thing" discipline every prior
# migration here used.
# A real, live production outage 2026-09-01 caused exactly this way:
# k3s_ingress_forward_enabled was never persisted here, only ever
# passed via -e k3s_ingress_forward_enabled=true at apply time. That
# role is a real toggle, not a skip-guard (state: flips present/absent
# off this flag directly) -- so the one ansible-playbook run that
# omitted the -e flag didn't just skip re-creating the DNAT rules for
# 80/443/53, it actively tore them out, taking every public
# *.jkandler.de service down until caught and re-applied with the flag
# restored. Persisted here now specifically so a normal apply can
# never silently do that again -- every other role's own enabled flag
# already works this way; this one was the one outlier, by omission,
# not a deliberate choice.
k3s_ingress_forward_enabled: true

shared_ingress_enabled: false
shared_ingress_start: true
shared_ingress_apex_redirect_enabled: true
shared_ingress_agent_enabled: true
# ai.jkandler.de -- served by the k3s-native home_agent + open_webui
# pairing (infra/k3s-apps' modules/home_agent and modules/open_webui),
# not the Docker containers here any more. Both upstreams move in
# lockstep (see shared_ingress' own comment on
# shared_ingress_agent_upstream) since this file's own /healthz +
# /v1/chat vs. everything-else path split forwards both branches to
# the same k3s Traefik entrypoint, which then does the equivalent
# split on its own side via infra/k3s-apps' combined Ingress.
# Confirmed live before this cutover: the Docker open-webui container
# stopped cleanly, the k3s copy read the existing accounts/chat
# history correctly over the new NFS export (persisted database
# settings came back, not fresh env-var defaults). The home_agent and
# open_webui roles are reshaped now too, the same way deluge's own
# role was -- down to just the host prerequisites (home_tools_service;
# the open-webui service account and data directory) their k3s copies
# still depend on, no more Docker container/image logic, no more
# enable flags of their own. nextcloud_tools' role is gone outright
# (not reshaped) -- nothing on this host consumed it once home_agent's
# own Docker container, its only client, was retired; its Python
# source stays on as infra/k3s-apps' own vendored copy's canonical
# original, see that role's own README.
shared_ingress_agent_upstream: http://192.168.101.10:80
shared_ingress_open_webui_enabled: true
shared_ingress_open_webui_upstream: http://192.168.101.10:80

# Deluge itself runs as a k3s-native copy (infra/k3s-apps,
# Terraform-managed), not by anything in this repo -- confirmed live in
# production (real domain, real auth, real session state read cleanly
# over NFS) before the old Docker container was stopped. The deluge
# role here now only manages the host prerequisites the k3s copy still
# depends on (service account, NFS-exported directories/ACL) -- see its
# README -- so it has no enabled flag of its own any more.
shared_ingress_deluge_enabled: true
shared_ingress_deluge_upstream: http://192.168.101.10:80

# Shares exactly Deluge's own two directories with the k3s learning VM
# (infra/k3s-apps) -- nothing else under /mnt/black-hdd -- so a
# Kubernetes-native copy of Deluge can be a real drop-in replacement,
# Nextcloud integration included, rather than a disconnected sandbox
# with its own separate downloads directory. 192.168.101.10 is that
# VM's static address (see ansible/roles/k3s_node/defaults/main.yml).
nfs_server_enabled: true
nfs_server_exports:
  - path: /mnt/black-hdd/downloads
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  - path: /mnt/black-hdd/deluge-config
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash
  # Open WebUI's real, already-live data (accounts, chat history,
  # WEBUI_SECRET_KEY_FILE) -- same "share the k3s copy's real state,
  # don't start it fresh" choice already made for Deluge's config, and
  # the same live concurrent-write risk that surfaced during Deluge's
  # own migration applies here too: home-infra's own open-webui
  # container must be stopped before infra/k3s-apps' Pod is ever
  # started against this export, not just before the routing cutover --
  # two writers touching the same SQLite file (one local, one over NFS)
  # risks corrupting real chat history, unlike Deluge's crash-safe
  # session state.
  - path: /var/lib/open-webui
    client: 192.168.101.10
    options: rw,sync,no_subtree_check,root_squash

# Nextcloud external storage for Deluge's downloads folder, visible only to
# the personal account below (not a service account) -- confirmed working
# privately (torrent + default-password bug both verified fixed) before
# wiring this up.
nextcloud_aio_mount_dir: /mnt/black-hdd/downloads
# c3d555d14a9e6f55acce409da0bf8fa03e31deff7b9d20c951aecfcf15832cd1 is the
# user_oidc-provisioned account for the same person (Authelia login,
# 2026-09-09) -- the native "admin" account's real data (134GB, verified
# byte-for-byte via occ files:transfer-ownership) was migrated onto it
# and "admin" itself retired, once Nextcloud SSO was added
# (nextcloud_aio_oidc_enabled). files_external:applicable's own
# --add-user is additive-only, so admin's now-dead grant on this mount
# doesn't need an explicit --remove-user -- it stops mattering the
# moment that account is deleted.
nextcloud_aio_mount_applicable_user: c3d555d14a9e6f55acce409da0bf8fa03e31deff7b9d20c951aecfcf15832cd1

# "Sign in with Authelia" on Nextcloud's own login page (infra/k3s-apps'
# modules/authelia registers the matching "nextcloud" OIDC client) --
# see nextcloud_aio's own README for the full reasoning. Needs
# authelia_oidc_nextcloud_client_secret set in the home-infra/nextcloud
# AWS Secrets Manager group (playbooks/site.yml's own pre_tasks expose
# it under this same variable name) before a site.yml run against this
# flag will pass tasks/oidc.yml's own assert.
nextcloud_aio_oidc_enabled: true

# Prometheus/Grafana/Alertmanager monitoring stack (ADR 0019). Needs
# monitoring_ntfy_topic, monitoring_ses_smtp_username, and
# monitoring_ses_smtp_password set in the home-infra/monitoring AWS
# Secrets Manager group (playbooks/site.yml's own pre_tasks expose them
# under these same variable names) before a site.yml run against this
# flag will pass its own validate checks. (Grafana's own admin password
# isn't a shared secret any more -- see monitoring/README.md.)
monitoring_enabled: true
shared_ingress_grafana_enabled: true
# Phase 1 of moving the monitoring stack into the k3s cluster
# (infra/k3s-apps, modules/grafana): Grafana only -- Prometheus and
# Postgres stay on this host (node_exporter/cAdvisor/blackbox_exporter/
# Blocky itself all have to, see monitoring's and blocky's own
# comments), reached by the k3s-native Grafana over the two additive
# listeners below. Additive on both -- see
# monitoring_prometheus_k3s_bind_address's and
# blocky_postgres_k3s_bind_address's own comments for why neither one
# is a switch away from loopback the way nextcloud_aio_apache_ip_binding
# was. Confirmed live before the cutover below: the k3s Pod's real
# admin login working (not the default admin/admin -- an earlier bug in
# how its password Secret was wired up got caught here first), both
# datasources healthy, and a real PromQL query against Prometheus
# returning real, current scrape data through Grafana's own proxy.
monitoring_prometheus_k3s_bind_address: 192.168.101.1
# Same k3s cutover as shared_ingress_home_upstream/_deluge_upstream/
# etc. below -- see this file's own comment on shared_ingress_agent_upstream
# for the full reasoning. shared_ingress' own health check now sends
# the Host header this needs (see that role's tasks/main.yml).
shared_ingress_grafana_upstream: http://192.168.101.10:80

# Phase 2 of moving the monitoring stack into k3s: Alertmanager.
# Additive, same shape as monitoring_prometheus_k3s_bind_address above
# -- lets the k3s-native Alertmanager (infra/k3s-apps' modules/
# alertmanager) reach the ntfy relay, which stays on this host.
monitoring_ntfy_relay_k3s_bind_address: 192.168.101.1
# The actual cutover: confirmed independently first (2026-08-31) that
# infra/k3s-apps' own Alertmanager delivers real notifications on its
# own -- a synthetic test alert posted straight to its API reached both
# ntfy and the real SES inbox -- before ever pointing Prometheus at it.
# A clean switch, not an addition (see this variable's own comment in
# ansible/roles/monitoring/defaults/main.yml for why listing both
# Alertmanagers at once would double-fire every real notification).
monitoring_alertmanager_upstream: 192.168.101.10:9093

# home.jkandler.de -- served by the k3s-native copy of this service
# (infra/k3s-apps, Terraform-managed), not by anything in this repo.
# The landing_page role that used to run this as a Docker container is
# gone entirely (not just disabled) -- its cutover was confirmed live
# in production first (real domain, real TLS, real auth, checked in the
# browser, then its container's clean removal also confirmed live)
# before the role itself was deleted.
shared_ingress_home_enabled: true
shared_ingress_home_upstream: http://192.168.101.10:80

# Network-wide DNS ad-blocking (ADR 0020) -- now fully k3s-native
# (infra/k3s-apps, modules/blocky/), reached over k3s_ingress_forward's
# own DNAT relay. blocky_enabled and blocky_postgres_k3s_bind_address
# (this repo's own Docker deployment and its additive Grafana-reach
# listener) are both gone -- the blocky role itself was deleted once
# the cutover was confirmed live, matching shared_ingress's own
# precedent. blocky_postgres_password is still real: infra/k3s-apps'
# own modules/blocky consumes it directly from the home-infra/blocky
# AWS Secrets Manager group (secrets.tf), independent of this repo's
# own roles entirely.
#
# The actual cutover: confirmed independently first (2026-09-01) that
# infra/k3s-apps' own modules/blocky is serving real production LAN
# DNS traffic correctly (k3s_ingress_forward's own DNAT relay, a real
# dig against the homeserver's own LAN IP resolving correctly, and
# Blocky's own query log showing the real requesting client's address
# after blocky-svc's externalTrafficPolicy fix) -- the same bar
# monitoring_alertmanager_upstream's own cutover was held to. A clean
# switch, not an addition -- see this variable's own comment in
# ansible/roles/monitoring/defaults/main.yml for why scraping both at
# once would be actively misleading.
monitoring_blocky_upstream: 192.168.101.10:4000

# blocky_ipv6_relay: bridges IPv6-transport DNS queries from the LAN
# to Blocky's own IPv4-only address in k3s (see that role's own README
# for why a relay, not a DNAT extension). fd71:c3c8:f74d::/64 is this
# LAN's own real ULA prefix (FRITZ!Box Heimnetz-Eigenschaften, checked
# 2026-09-01) -- ULA specifically, not the ISP-delegated GUA prefix
# also shown there, since ULA never rotates the way a delegated prefix
# can. This is the access boundary for the relay (see
# blocky_ipv6_relay_lan_prefix's own comment in defaults/main.yml),
# not optional hardening. FRITZ!Box's own "Andere DNSv6-Server"
# setting is NOT pointed at the homeserver yet -- that's a separate,
# still-pending step (needs the homeserver's own IPv6 interface ID
# confirmed stable first; its addresses were still showing
# "Temporary" as of this same check) -- so nothing about real LAN
# traffic changes yet just from this being enabled.
blocky_ipv6_relay_enabled: true
blocky_ipv6_relay_lan_prefix: fd71:c3c8:f74d::/64