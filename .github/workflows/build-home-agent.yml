name: Build home-agent image

# Builds home_agent's image on the self-hosted runner and pushes it to GHCR.

on:
  push:
    branches:
      - main
    paths:
      - ansible/roles/home_agent/files/agent/**
      - .github/workflows/build-home-agent.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build home-agent image
        run: >-
          docker build
          -t ghcr.io/kandlerli/home-agent:${{ github.sha }}
          -t ghcr.io/kandlerli/home-agent:main
          ansible/roles/home_agent/files/agent

      # :main is what Renovate follows to propose the new digest to k3s-apps.
      - name: Push home-agent image
        run: |
          docker push ghcr.io/kandlerli/home-agent:${{ github.sha }}
          docker push ghcr.io/kandlerli/home-agent:main

      # The immutable digest is what k3s-apps pins.
      - name: Print pushed image digest
        run: >-
          docker inspect
          --format='{{index .RepoDigests 0}}'
          ghcr.io/kandlerli/home-agent:${{ github.sha }}
