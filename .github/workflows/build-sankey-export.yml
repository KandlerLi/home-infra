name: Build sankey-export image

# Builds and pushes sankey_export's image to GHCR on the self-hosted CI
# runner -- same shape as build-home-agent.yml (same runner, same
# GITHUB_TOKEN-based GHCR login, no long-lived write credential needed).

on:
  push:
    branches:
      - main
    paths:
      - containers/sankey-export/**
      - .github/workflows/build-sankey-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build sankey-export image
        run: >-
          docker build
          -t ghcr.io/kandlerli/sankey-export:${{ github.sha }}
          containers/sankey-export

      - name: Push sankey-export image
        run: docker push ghcr.io/kandlerli/sankey-export:${{ github.sha }}

      # Prints the real, immutable pushed digest -- this repo pins every
      # image by digest, not a moving tag (see e.g. home_agent/deluge/
      # blocky/monitoring), so this is what actually gets copied into
      # infra/k3s-apps' CronJob once this image is ready to use.
      - name: Print pushed image digest
        run: >-
          docker inspect
          --format='{{index .RepoDigests 0}}'
          ghcr.io/kandlerli/sankey-export:${{ github.sha }}
