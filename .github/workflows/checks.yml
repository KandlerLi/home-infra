name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build CI image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      uid: ${{ steps.whoami.outputs.uid }}
      gid: ${{ steps.whoami.outputs.gid }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Hash of the build inputs plus the ISO week: rebuilt when they change, and weekly for Debian's security updates.
      - name: Determine image tag
        id: tag
        run: >-
          echo "image=ghcr.io/kandlerli/home-infra-ci:$(cat .github/ci/Dockerfile requirements.txt requirements.yml | sha256sum | cut -c1-12)-$(date -u +%G-w%V)"
          >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Check for an existing image
        id: existing
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CI image
        if: steps.existing.outputs.found != 'true'
        run: docker build -t "${{ steps.tag.outputs.image }}" -f .github/ci/Dockerfile .

      - name: Push CI image
        if: steps.existing.outputs.found != 'true'
        run: docker push "${{ steps.tag.outputs.image }}"

      - name: Determine service account identity
        id: whoami
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The reused workspace may be world-writable from an old run, which makes Ansible ignore ansible.cfg.
      - name: Ensure the workspace isn't world-writable
        run: chmod o-w "$GITHUB_WORKSPACE"

      - name: Ansible syntax check
        run: ansible-playbook ansible/playbooks/site.yml --syntax-check

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
