name: Checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build CI image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      uid: ${{ steps.whoami.outputs.uid }}
      gid: ${{ steps.whoami.outputs.gid }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build CI image
        run: docker build -t ghcr.io/kandlerli/home-infra-ci:latest -f .github/ci/Dockerfile .

      - name: Push CI image
        run: docker push ghcr.io/kandlerli/home-infra-ci:latest

      - name: Determine service account identity
        id: whoami
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kandlerli/home-infra-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # actions/checkout reuses this persistent workspace across runs and
      # doesn't reset the directory's own permission bits -- a previous
      # run's now-removed chmod -R a+rwX left it world-writable, which
      # makes Ansible refuse to load ansible.cfg from it at all (a real
      # security check: a world-writable ansible.cfg could be planted by
      # anyone else with access to the directory). Self-healing regardless
      # of history, not a one-off manual fix.
      - name: Ensure the workspace isn't world-writable
        run: chmod o-w "$GITHUB_WORKSPACE"

      - name: Ansible syntax check
        run: ansible-playbook ansible/playbooks/site.yml --syntax-check

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
