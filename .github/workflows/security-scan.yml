name: Security scan

# trivy image scan of every pinned image, informational. trivy config doesn't cover Ansible, see ADR 0022.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly: new CVEs in unchanged images, see trivy-image below.
  schedule:
    - cron: "23 5 * * 1"

jobs:
  # Informational on PR/push; the weekly run fails on fixable CRITICALs, which GitHub emails about.
  trivy-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node-exporter
            ref: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          - name: cadvisor
            ref: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
          - name: blackbox-exporter
            ref: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
          - name: prometheus
            ref: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
          # Not digest-pinned (AIO recommends :latest), so this entry drifts with :latest.
          - name: nextcloud-aio
            ref: ghcr.io/nextcloud-releases/all-in-one:latest
          # Built here, so scanned here: a repo-scoped token can only pull this repo's private packages.
          # Renovate keeps this and k3s-apps' argocd/home-agent/deployment.yaml on the newest build.
          - name: home-agent
            ref: ghcr.io/kandlerli/home-agent:main@sha256:9124434f328f51de4216d8f8aa2b69aa012c2c758678403834afb5fbdf9f9434
    uses: KandlerLi/gha-common/.github/workflows/trivy-image.yml@v0.0.17
    with:
      image_name: ${{ matrix.name }}
      image_ref: ${{ matrix.ref }}
      fail_on_severity: ${{ github.event_name == 'schedule' && 'CRITICAL' || '' }}
      # GitHub-hosted: the scan needs no AWS or homeserver access.
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read
      packages: read

  gitleaks:
    uses: KandlerLi/gha-common/.github/workflows/gitleaks.yml@v0.0.17
    permissions:
      contents: read
