[defaults]
inventory = ansible/inventory/home.yml
roles_path = ansible/roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
inject_facts_as_vars = False
vars_plugins_enabled = host_group_vars,community.sops.sops
# role_recap prints a second, per-role "ROLE RECAP" banner alongside the
# normal (host-only) PLAY RECAP -- see ansible/callback_plugins/role_recap.py.
callback_plugins = ansible/callback_plugins
callbacks_enabled = role_recap
