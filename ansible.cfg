[defaults]
inventory = ansible/inventory/home.yml
roles_path = ansible/roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
inject_facts_as_vars = False
vars_plugins_enabled = host_group_vars
# role_recap prints a second, per-role "ROLE RECAP" banner alongside the
# normal (host-only) PLAY RECAP -- see ansible/callback_plugins/role_recap.py.
callback_plugins = ansible/callback_plugins
callbacks_enabled = role_recap
# Ansible's own default (10s) is unreliably short against a
# freshly-cold-booted k3s guest VM: sshd accepting TCP connections
# (k3s_node's own wait_for: port 22 check) doesn't mean PAM/the
# privilege-escalation prompt is ready yet. Confirmed live 2026-09-04,
# twice, on different hosts/tasks: `fatal: UNREACHABLE!`, "Timeout
# (12s) waiting for privilege escalation prompt" -- see BACKLOG.md's
# "Homeserver: make a reboot a complete non-event" entry. This
# `timeout` setting (`DEFAULT_TIMEOUT`) covers both plain connection
# and privilege-escalation waits in this Ansible version -- there is
# no separate `become_timeout` ini key to set (checked live via
# `ansible-config list`; only `timeout` exists).
timeout = 60
